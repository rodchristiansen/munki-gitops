# ─── Reference copy: the production pipeline, sanitized ────────────────
#
# This is what actually runs, lifted nearly as-is and with tenant identifiers
# replaced by placeholders. It is here for accuracy, not as the recommended
# shape -- several thousand lines of Python inline in YAML is why the test
# suite in ../../tests/ has to extract code out of a pipeline file to run it,
# and why the condition translator exists twice with a comment between the
# copies saying "keep these in sync".
#
# The readable version of the same logic is ../../stages/ and ../../lib/,
# driven by ../azure/intune-mgmt.yml. Start there. Come here when you want to
# see how it is really wired, or what a stage does that the sample omits.
#
# Sanitized: service connection, variable group, storage account and container
# names are placeholders; the VPP app table is trimmed to three generic
# entries; the Teams webhook reads from the variable group rather than being
# hardcoded.
#
# ───────────────────────────────────────────────────────────────────────
# ─── Graph API Entitlements ────────────────────────────────────────────
# This pipeline requires the following Microsoft Graph API permissions:
#   - DeviceManagementConfiguration.ReadWrite.All (Application) — CRUD device configuration profiles + Settings Catalog (DDM) policies (macOS)
#   - Group.Read.All (Application)                              — Resolve group names for profile assignment
#   - DeviceManagementManagedDevices.Read.All (Application)     — Enumerate managed devices (force sync + model registry)
# ───────────────────────────────────────────────────────────────────────
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - profiles/**
      - deployment/manifests/**
      - scripts/**

# Scheduled reconcile: a device that joins a target group because it just
# ENROLLED (not because a manifest changed) is otherwise never force-synced, so
# its group-assigned profiles sit at notApplicable until the next native macOS
# check-in (~8h+). This schedule runs the group-membership sync + a drift-aware
# force-sync only (the push/assign stages are gated off via ReconcileOnly), so
# newly-enrolled/migrated Macs converge on a bounded cadence instead of by luck.
# PAUSED 2026-07-22. This schedule has run harmlessly for months, but PR 10407
# changed what a run does: membership now converges fully with no cap on
# removals. Until that behaviour is proven against real data, a timer that can
# unassign config profiles from Macs every two hours is not something to leave
# running. Re-enable once the group-sync test suite passes and the removal
# forecast has been produced by the pipeline's own logic rather than an
# approximation of it.
# schedules:
#   - cron: "0 */2 * * *"
#     displayName: "Every 2h: reconcile group membership + force-sync drifted devices"
#     branches:
#       include:
#         - main
#     always: true

variables:
  - group: 'gitops-secrets'
  - name: azureServiceConnection
    value: '$(INTUNE_SERVICE_CONNECTION)'
  - name: MUNKI_PROFILES_FOLDER
    value: '$(Build.SourcesDirectory)/profiles'
  # Supplied by the variable group above. NEVER hardcode a signed webhook
  # URL in a pipeline file -- the sig= parameter is a working credential.
  - name: errorsTeamsWebhookUrl
    value: '$(ERRORS_TEAMS_WEBHOOK_URL)'

parameters:
- name: forceFullRun
  displayName: 'Force full run (skip detection, run all stages)'
  type: boolean
  default: false
- name: targetSerials
  displayName: 'Targeted serials (comma-separated, e.g. SAMPLEMAC001,SAMPLEMAC002)'
  type: string
  default: ' '
- name: targetManifest
  displayName: 'Targeted manifest path (e.g. Assigned/Staff/IT)'
  type: string
  default: ' '
- name: failOnLintError
  displayName: 'Fail the run if a manifest condition cannot become an Intune filter'
  type: boolean
  default: true
- name: applyManagedExclusions
  displayName: 'Apply managed_uninstalls as Intune exclusions for profiles/apps/scripts (off = log the plan only)'
  type: boolean
  default: false
- name: allowLargeShrink
  displayName: 'Allow large group shrink (bypass the removal guards for a verified bulk cleanup, e.g. removing retired devices)'
  type: boolean
  default: false
- name: whatIf
  displayName: 'What-if (plan only): compute + log the full membership plan, write nothing'
  type: boolean
  default: false
- name: allowShrinkGroups
  displayName: 'Allow shrink for these groups only (comma-separated) — scoped override, keeps the guards on everywhere else'
  type: string
  default: ' '

pool:
  vmImage: 'macos-latest'

stages:
  #---------------------------------------------------------------------------
  # STAGE 1: Detect changed folders
  #---------------------------------------------------------------------------
  #---------------------------------------------------------------------------
  # STAGE 0: Lint manifest conditions for Intune compatibility
  #---------------------------------------------------------------------------
  - stage: lintConditions
    displayName: "Lint Intune Conditions"
    dependsOn: []
    jobs:
      - job: lintManifestConditions
        displayName: "Validate manifest conditional_items are Intune-compatible"
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install pyyaml
            displayName: "Install Python Dependencies"
          - task: PythonScript@0
            displayName: "Lint manifest conditions -> Intune assignment filters"
            env:
              FAIL_ON_LINT_ERROR: ${{ parameters.failOnLintError }}
              TEAMS_ERRORS_WEBHOOK_URL: $(errorsTeamsWebhookUrl)
            inputs:
              scriptSource: 'inline'
              script: |
                # ===================================================================
                #  LINT MANIFEST conditional_items FOR INTUNE COMPATIBILITY
                #
                #  Flags conditional_items the munki-intune-mgmt assign stages
                #  cannot honour, so a broken phased-rollout target is caught here
                #  instead of silently misfiring on the fleet:
                #    1. managed_profiles / managed_scripts conditions with no macOS
                #       Intune filter equivalent (the assign stage logs unsupported
                #       and SKIPS the assignment).
                #    2. Malformed conditions.
                #    3. managed_apps under conditional_items (the VPP stage reads
                #       only top-level managed_apps -> silently dropped).
                #    4. Conditions that translate but emit an operator Intune
                #       rejects on device.model (-notStartsWith / unary -not).
                #
                #  The translator below is the SAME one the managed_profiles /
                #  managed_scripts assign stages use -- keep them in sync.
                # ===================================================================
                import os
                import re
                import glob
                import hashlib
                import logging
                import yaml

                logging.basicConfig(level=logging.WARNING, format="%(levelname)-8s | %(message)s")

                MANIFESTS_ROOT = "deployment/manifests"
                WARN_ONLY = os.environ.get("FAIL_ON_LINT_ERROR", "true").strip().lower() != "true"

                class CondParseError(Exception):
                    pass

                class UnsupportedCondition(Exception):
                    pass

                _COND_TOKEN_RE = re.compile(
                    r'"(?:[^"\\]|\\.)*"'
                    r"|'(?:[^'\\]|\\.)*'"
                    r"|\d+"
                    r"|==|!=|>=|<=|>|<"
                    r"|\(|\)"
                    r"|[A-Za-z_][A-Za-z_0-9]*"
                )

                def _tokenize_cond(text):
                    return _COND_TOKEN_RE.findall(text)

                class _CondParser:
                    def __init__(self, tokens):
                        self.tokens = tokens
                        self.pos = 0
                    def _peek(self):
                        return self.tokens[self.pos] if self.pos < len(self.tokens) else None
                    def _take(self):
                        t = self._peek()
                        if t is None:
                            raise CondParseError("unexpected end of expression")
                        self.pos += 1
                        return t
                    def parse(self):
                        node = self._parse_or()
                        if self.pos < len(self.tokens):
                            raise CondParseError(f"trailing tokens: {self.tokens[self.pos:]}")
                        return node
                    def _parse_or(self):
                        n = self._parse_and()
                        while self._peek() == "OR":
                            self._take()
                            n = ("or", n, self._parse_and())
                        return n
                    def _parse_and(self):
                        n = self._parse_not()
                        while self._peek() == "AND":
                            self._take()
                            n = ("and", n, self._parse_not())
                        return n
                    def _parse_not(self):
                        if self._peek() == "NOT":
                            self._take()
                            return ("not", self._parse_unary())
                        return self._parse_unary()
                    def _parse_unary(self):
                        if self._peek() == "(":
                            self._take()
                            n = self._parse_or()
                            if self._peek() != ")":
                                raise CondParseError("missing ')'")
                            self._take()
                            return n
                        return self._parse_pred()
                    def _parse_pred(self):
                        ident = self._take()
                        if ident in ("ANY", "ALL", "SOME", "NONE"):
                            ident = f"{ident} {self._take()}"
                        op = self._take()
                        val = self._take()
                        if val and val[0] in ('"', "'"):
                            return ("pred", ident, op, val[1:-1], "string")
                        return ("pred", ident, op, val, "number")

                # machine_type form-factor classification.
                #
                # Intune reports device.model as a marketing name ("MacBook Pro",
                # "iMac") when Microsoft's lookup tables know the hardware, and as
                # a bare identifier ("Mac16,3") when they don't. Laptops are matched
                # by the stable "MacBook" prefix; desktop is the exact complement,
                # so every device matches exactly one branch -- no "matches nothing"
                # gap, and new desktop models need zero maintenance. A bare
                # identifier carries no form-factor signal, so the only case the
                # prefix misses is a laptop currently reporting one; those are
                # listed (form_factor: laptop) in provisioning/models.yaml, which
                # the maintainModelRegistry stage keeps current from Intune. That
                # override file is the only thing read here.
                def _is_model_identifier(m):
                    if not m.startswith("Mac"):
                        return False
                    a, sep, b = m[3:].partition(",")
                    return bool(sep) and a.isdigit() and b.isdigit()

                def _laptop_model_ids():
                    path = "provisioning/models.yaml"
                    ids = set()
                    if not os.path.exists(path):
                        return ids
                    try:
                        data = yaml.safe_load(open(path)) or {}
                    except Exception as e:
                        logging.warning(f"models.yaml unreadable ({e}); using MacBook prefix only.")
                        return ids
                    for entry in data.get("models") or []:
                        m = (entry.get("model") or "").strip()
                        if entry.get("form_factor") == "laptop" and _is_model_identifier(m):
                            ids.add(m)
                    return ids

                _LAPTOP_MODEL_IDS = _laptop_model_ids()
                _STR_OP_TO_INTUNE = {
                    "==": "-eq",
                    "!=": "-ne",
                    "CONTAINS": "-contains",
                    "BEGINSWITH": "-startsWith",
                    "ENDSWITH": "-endsWith",
                }

                def _translate_node(node):
                    if node[0] == "and":
                        return f"({_translate_node(node[1])} and {_translate_node(node[2])})"
                    if node[0] == "or":
                        return f"({_translate_node(node[1])} or {_translate_node(node[2])})"
                    if node[0] == "not":
                        return f"(not {_translate_node(node[1])})"
                    if node[0] == "pred":
                        return _translate_pred(*node[1:])
                    raise UnsupportedCondition(f"unknown AST node: {node[0]}")

                def _translate_pred(field, op, value, kind):
                    if field == "hostname":
                        if op in _STR_OP_TO_INTUNE:
                            return f'(device.deviceName {_STR_OP_TO_INTUNE[op]} "{value}")'
                        raise UnsupportedCondition(f"hostname {op}")
                    if field == "machine_type":
                        # desktop is the exact complement of laptop, so a device
                        # reporting an unknown/identifier model classifies as
                        # desktop rather than matching neither branch.
                        # NB: Intune rejects -notStartsWith and unary -not on
                        # device.model in assignment filters (verified against the
                        # Graph validator), so desktop uses -notContains "MacBook"
                        # -- equivalent here since every marketing MacBook string
                        # contains "MacBook" and identifier-laptops are excluded by
                        # -ne below.
                        laptop_rule = "(" + " or ".join(
                            ['(device.model -startsWith "MacBook")']
                            + [f'(device.model -eq "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        desktop_rule = "(" + " and ".join(
                            ['(device.model -notContains "MacBook")']
                            + [f'(device.model -ne "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        if value == "laptop":
                            return laptop_rule if op == "==" else desktop_rule
                        if value == "desktop":
                            return desktop_rule if op == "==" else laptop_rule
                        raise UnsupportedCondition(f'machine_type {op} "{value}"')
                    if field == "os_vers_major":
                        if kind == "number" and op == "==":
                            return f'(device.osVersion -startsWith "{value}.")'
                        if kind == "number" and op == "!=":
                            return f'(device.osVersion -notStartsWith "{value}.")'
                        raise UnsupportedCondition(f"os_vers_major {op}")
                    raise UnsupportedCondition(f"{field} {op}")

                def translate_condition(text):
                    """Translate a Munki condition string to (display_name, intune_rule).
                    Raises CondParseError or UnsupportedCondition on failure."""
                    normalized = " ".join(text.split())
                    rule = _translate_node(_CondParser(_tokenize_cond(normalized)).parse())
                    display = f"Munki: {normalized}"
                    if len(display) > 250:
                        h = hashlib.sha1(normalized.encode()).hexdigest()[:8]
                        display = display[:240] + f"... [{h}]"
                    return display, rule

                # --- Intune-forbidden operator guard ---------------------------
                # Some conditions translate without raising but still emit a filter
                # Intune rejects. Per the verified constraint, -notStartsWith and
                # the unary -not operator are rejected on device.model (they are
                # fine elsewhere, e.g. -not over device.deviceName). Flag only the
                # device.model cases to avoid false positives.
                def forbidden_operator(rule):
                    if "device.model -notStartsWith" in rule:
                        return "emits -notStartsWith on device.model, which Intune rejects"
                    if "(not " in rule and "device.model" in rule:
                        return "emits a unary -not over device.model, which Intune rejects"
                    return None

                # --- Manifest walking ------------------------------------------
                DELIVERABLE_KEYS = ("managed_profiles", "managed_scripts", "managed_apps")

                def _names_at(block, key):
                    val = block.get(key)
                    if not isinstance(val, list):
                        return []
                    return [v for v in val if isinstance(v, str)]

                def walk_block(block, parent_cond, collected):
                    """Collect (key, name, combined_condition_or_None), descending
                    conditional_items and AND-combining nested conditions exactly
                    like the assign stages' walk_managed_* helpers."""
                    if not isinstance(block, dict):
                        return
                    for key in DELIVERABLE_KEYS:
                        for name in _names_at(block, key):
                            collected.append((key, name, parent_cond))
                    for sub in block.get("conditional_items") or []:
                        if not isinstance(sub, dict):
                            continue
                        cond = (sub.get("condition") or "").strip()
                        if not cond:
                            walk_block(sub, parent_cond, collected)
                            continue
                        combined = f"({parent_cond}) AND ({cond})" if parent_cond else cond
                        walk_block(sub, combined, collected)

                def lint_manifest(path):
                    """Return list of (severity, key, name, condition, reason)."""
                    out = []
                    try:
                        with open(path, "r") as fh:
                            data = yaml.safe_load(fh)
                    except (yaml.YAMLError, OSError) as ex:
                        return [("error", "-", "-", None, f"could not load file: {ex}")]
                    if not isinstance(data, dict):
                        return out
                    collected = []
                    walk_block(data, None, collected)
                    for key, name, cond in collected:
                        if cond is None:
                            continue  # top-level (unconditional) entries are fine
                        if key == "managed_apps":
                            out.append(("error", key, name, cond,
                                        "conditional managed_apps is silently dropped -- the VPP "
                                        "apps stage assigns managed_apps only from the manifest top "
                                        "level and cannot translate conditions to filters"))
                            continue
                        try:
                            _display, rule = translate_condition(cond)
                        except UnsupportedCondition as ex:
                            out.append(("error", key, name, cond,
                                        f"condition has no macOS Intune filter equivalent ({ex}) -- "
                                        "the assignment will be skipped at deploy time"))
                            continue
                        except CondParseError as ex:
                            out.append(("error", key, name, cond,
                                        f"condition could not be parsed ({ex})"))
                            continue
                        bad = forbidden_operator(rule)
                        if bad:
                            out.append(("error", key, name, cond, bad))
                        else:
                            out.append(("ok", key, name, cond, rule))
                    return out

                def notify_teams(errors):
                    """Post problematic findings to the errors Teams webhook (best effort)."""
                    import json
                    from urllib.request import Request, urlopen
                    webhook = os.environ.get("TEAMS_ERRORS_WEBHOOK_URL", "").strip()
                    if not webhook:
                        print("WARNING: TEAMS_ERRORS_WEBHOOK_URL not set -- skipping Teams notification")
                        return
                    build_url = (
                        f"{os.environ.get('SYSTEM_TEAMFOUNDATIONCOLLECTIONURI', '')}"
                        f"{os.environ.get('SYSTEM_TEAMPROJECT', '')}/"
                        f"_build/results?buildId={os.environ.get('BUILD_BUILDID', '')}"
                    )
                    CAP = 25
                    bullets = []
                    for path, key, name, cond, reason in errors[:CAP]:
                        bullets.append(f"- **{path}** - `{key}: {name}`\r\n`{cond}` -- {reason}")
                    if len(errors) > CAP:
                        bullets.append(f"- _...and {len(errors) - CAP} more_")
                    card = {
                        "type": "AdaptiveCard",
                        "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                        "version": "1.3",
                        "body": [
                            {"type": "TextBlock", "weight": "Bolder", "size": "Medium",
                             "color": "Attention", "wrap": True,
                             "text": f"Munki Intune Lint - {len(errors)} unshippable condition(s)"},
                            {"type": "TextBlock", "wrap": True, "spacing": "Small", "isSubtle": True,
                             "text": "These manifest conditional_items will not deploy as written. "
                                     "Fix the condition or move the item out of conditional_items."},
                            {"type": "TextBlock", "wrap": True, "spacing": "Medium",
                             "text": "\r\n".join(bullets)},
                        ],
                        "actions": [{"type": "Action.OpenUrl", "title": "View Build", "url": build_url}],
                    }
                    payload = json.dumps({
                        "type": "message",
                        "attachments": [{"contentType": "application/vnd.microsoft.card.adaptive", "content": card}],
                    }).encode("utf-8")
                    try:
                        req = Request(webhook, data=payload, headers={"Content-Type": "application/json"})
                        with urlopen(req, timeout=30) as resp:
                            print(f"Teams notification sent ({resp.status})")
                    except Exception as exc:
                        print(f"WARNING: failed to send Teams notification: {exc}")

                def main():
                    files = sorted(glob.glob(f"{MANIFESTS_ROOT}/**/*.yaml", recursive=True))
                    files += sorted(glob.glob(f"{MANIFESTS_ROOT}/**/*.yml", recursive=True))
                    if not files:
                        print(f"intune-lint: no manifests found under {MANIFESTS_ROOT}")
                        return 0
                    errors, oks = [], []
                    for path in files:
                        for sev, key, name, cond, reason in lint_manifest(path):
                            (errors if sev == "error" else oks).append((path, key, name, cond, reason))
                    if errors:
                        print("Intune condition lint FAILED -- these conditional assignments "
                              "will not work as written:\n")
                        by_file = {}
                        for path, key, name, cond, reason in errors:
                            by_file.setdefault(path, []).append((key, name, cond, reason))
                        for path in sorted(by_file):
                            print(f"  {path}")
                            for key, name, cond, reason in by_file[path]:
                                print(f"    [{key}] {name}")
                                print(f"      condition: {cond}")
                                print(f"      problem:   {reason}")
                            print()
                    else:
                        print(f"intune-lint: OK -- {len(files)} manifest(s) scanned, "
                              f"{len(oks)} conditional assignment(s) translate cleanly.")
                    print(f"intune-lint summary: {len(errors)} error(s), {len(oks)} ok.")
                    if errors:
                        notify_teams(errors)
                    if errors and not WARN_ONLY:
                        return 1
                    if errors and WARN_ONLY:
                        print("failOnLintError=false -> warn-only, not failing the run.")
                    return 0

                raise SystemExit(main())

  - stage: detectChanges
    displayName: "Detect changes"
    dependsOn: lintConditions
    jobs:
      - job: detectFolderChanges
        displayName: "Check if profiles/ or deployment/manifests/ changed"
        pool:
          vmImage: 'macos-latest'
        steps:
          - checkout: self
            fetchDepth: 2
            persistCredentials: true
          - script: |
              echo "Detecting changed folders (Munki)..."
              
              forceFullRun="${{ parameters.forceFullRun }}"
              targetSerials="$(echo '${{ parameters.targetSerials }}' | tr -d '[:space:]')"
              targetManifest="$(echo '${{ parameters.targetManifest }}' | tr -d '[:space:]')"
              reconcileOnly=false

              # --- Targeted mode: serial numbers or manifest path provided ---
              if [ -n "$targetSerials" ] || [ -n "$targetManifest" ]; then
                echo "Targeted mode enabled"
                profilesChanged=false
                manifestsChanged=true
                targetedMode=true
              
                if [ -n "$targetManifest" ]; then
                  # Direct manifest path provided (e.g. Assigned/Staff/IT or Assigned/Staff/IT.yaml)
                  cleanManifest="$(echo "$targetManifest" | sed 's/\.ya\?ml$//')"
                  changedManifestPaths="deployment/manifests/${cleanManifest}.yaml"
                  echo "Targeted manifest: $changedManifestPaths"
                elif [ -n "$targetSerials" ]; then
                  # Look up serials in computers.csv to find their manifest paths
                  changedManifestPaths=""
                  IFS=',' read -ra SERIALS <<< "$targetSerials"
                  for serial in "${SERIALS[@]}"; do
                    serial=$(echo "$serial" | xargs)  # trim whitespace
                    row=$(grep -i "^${serial}," deployment/enroll/computers.csv || true)
                    if [ -z "$row" ]; then
                      echo "WARNING: Serial $serial not found in computers.csv, skipping"
                      continue
                    fi
                    usage=$(echo "$row" | cut -d',' -f6)
                    catalog=$(echo "$row" | cut -d',' -f2)
                    area=$(echo "$row" | cut -d',' -f3)
                    # Build manifest path from hierarchy: usage/catalog/area
                    mpath="deployment/manifests/${usage}/${catalog}/${area}.yaml"
                    echo "Serial $serial -> $mpath"
                    if [ -z "$changedManifestPaths" ]; then
                      changedManifestPaths="$mpath"
                    else
                      # Avoid duplicates
                      if ! echo "$changedManifestPaths" | grep -q "$mpath"; then
                        changedManifestPaths="$changedManifestPaths;$mpath"
                      fi
                    fi
                  done
                fi
              elif [ "$forceFullRun" = "True" ]; then
                echo "Force full run enabled - all stages will execute"
                profilesChanged=true
                manifestsChanged=true
                changedManifestPaths="__ALL__"
                targetedMode=false
              elif [ "$BUILD_REASON" = "Schedule" ]; then
                echo "Scheduled reconcile - group-membership sync + drift force-sync only (push/assign stages gated off via ReconcileOnly)"
                profilesChanged=false
                manifestsChanged=true
                changedManifestPaths="__ALL__"
                targetedMode=false
                reconcileOnly=true
              else
                git diff --name-only HEAD~1 HEAD > changed_files.txt
                profilesChanged=false
                manifestsChanged=false
                changedManifestPaths=""
                targetedMode=false

                while IFS= read -r file; do
                  case "$file" in
                    profiles/*)
                      profilesChanged=true
                      ;;
                    deployment/manifests/*)
                      manifestsChanged=true
                      if [ -z "$changedManifestPaths" ]; then
                        changedManifestPaths="$file"
                      else
                        changedManifestPaths="$changedManifestPaths;$file"
                      fi
                      ;;
                  esac
                done < changed_files.txt
              fi

              echo "ProfilesChanged  = $profilesChanged"
              echo "ManifestsChanged = $manifestsChanged"
              echo "ChangedManifestPaths = $changedManifestPaths"
              echo "TargetedMode     = ${targetedMode:-false}"
              echo "TargetSerials    = $targetSerials"

              # Expose as Azure DevOps output variables
              echo "##vso[task.setvariable variable=ProfilesChanged;isOutput=true]$profilesChanged"
              echo "##vso[task.setvariable variable=ManifestsChanged;isOutput=true]$manifestsChanged"
              echo "##vso[task.setvariable variable=ChangedManifestPaths;isOutput=true]$changedManifestPaths"
              echo "##vso[task.setvariable variable=TargetedMode;isOutput=true]${targetedMode:-false}"
              echo "##vso[task.setvariable variable=TargetSerials;isOutput=true]$targetSerials"
              echo "##vso[task.setvariable variable=ReconcileOnly;isOutput=true]${reconcileOnly:-false}"
            displayName: "Check changed files"
            name: setVars

#------------------------------------------------------------------------------
# STAGE 1b: Maintain the device-model registry (provisioning/models.yaml)
#------------------------------------------------------------------------------
# Enumerates live macOS models from Intune, reconciles provisioning/models.yaml
# (adds newly-seen models, classifies marketing names by prefix, defaults bare
# MacXX,Y identifiers to desktop, preserves manual overrides, prunes models no
# longer enrolled), commits the file when it changes, and posts a Teams alert
# listing any new identifiers. Independent (dependsOn: []) and non-blocking, so a
# registry hiccup never holds up profile assignment. models.yaml is outside this
# pipeline's trigger paths, so the commit does not retrigger any pipeline.
  - stage: maintainModelRegistry
    displayName: "Maintain model registry"
    dependsOn: []
    jobs:
      - job: modelRegistry
        displayName: "Reconcile provisioning/models.yaml from Intune"
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests pyyaml
            displayName: "Install Python Dependencies"
          - script: |
              git fetch origin main --quiet
              git checkout -B main origin/main --quiet
              git config user.email "devops@example.ca"
              git config user.name "Munki Pipeline"
            displayName: 'Sync to latest main'
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: PythonScript@0
            displayName: 'Reconcile model registry'
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              TEAMS_WEBHOOK_URL: $(TeamsWebhookUrl)
              MUNKI_TEAMS_CHANNEL: $(MunkiTeamsChannel)
            inputs:
              scriptSource: 'inline'
              script: |
                import os, json, logging
                from urllib.request import Request, urlopen
                import requests
                import yaml

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _n in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_n).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH_BETA = "https://graph.microsoft.com/beta"
                REGISTRY = "provisioning/models.yaml"
                DESKTOP_PREFIXES = ("iMac", "Mac mini", "Mac Studio", "Mac Pro")
                # AppleDB (api.appledb.dev) maps every Mac model identifier to its
                # model class, so bare identifiers classify automatically and
                # correctly. Results are cached per run; a miss/outage falls back
                # without downgrading an already-resolved entry.
                _APPLEDB_CACHE = {}

                def appledb_type(identifier):
                    if identifier in _APPLEDB_CACHE:
                        return _APPLEDB_CACHE[identifier]
                    t = None
                    try:
                        r = requests.get(f"https://api.appledb.dev/device/{identifier}.json",
                                         timeout=15)
                        if r.status_code == 200:
                            d = r.json()
                            t = (d.get("type") or d.get("name") or "").strip() or None
                    except Exception as e:
                        log.warning("AppleDB lookup failed for %s: %s", identifier, e)
                    _APPLEDB_CACHE[identifier] = t
                    return t

                def is_identifier(m):
                    if not m.startswith("Mac"):
                        return False
                    a, sep, b = m[3:].partition(",")
                    return bool(sep) and a.isdigit() and b.isdigit()

                def resolve(model, prev):
                    """Return (form_factor, classified_by, unresolved). A manual
                    override is never touched; an AppleDB miss keeps a prior
                    resolved value rather than downgrading it to a guess."""
                    if prev and prev.get("classified_by") == "manual":
                        return prev.get("form_factor", "desktop"), "manual", False
                    if model.startswith("MacBook"):
                        return "laptop", "prefix", False
                    if model.startswith(DESKTOP_PREFIXES):
                        return "desktop", "prefix", False
                    if is_identifier(model):
                        t = appledb_type(model)
                        if t:
                            return ("laptop" if t.startswith("MacBook") else "desktop"), "appledb", False
                        if prev and prev.get("classified_by") in ("appledb", "prefix"):
                            return prev.get("form_factor", "desktop"), prev["classified_by"], False
                        return "desktop", "assumed", True
                    return "desktop", "assumed", prev is None

                def fetch_model_counts(token):
                    headers = {"Authorization": f"Bearer {token}"}
                    counts, total = {}, 0
                    url = (f"{GRAPH_BETA}/deviceManagement/managedDevices"
                           f"?$select=model,operatingSystem"
                           f"&$filter=operatingSystem+eq+'macOS'&$top=999")
                    while url:
                        r = requests.get(url, headers=headers)
                        if r.status_code != 200:
                            log.error("managedDevices fetch failed: %s %s", r.status_code, r.text[:200])
                            raise SystemExit(1)
                        data = r.json()
                        for d in data.get("value", []):
                            m = (d.get("model") or "").strip()
                            if not m:
                                continue
                            counts[m] = counts.get(m, 0) + 1
                            total += 1
                        url = data.get("@odata.nextLink")
                    return counts, total

                def load_registry():
                    if not os.path.exists(REGISTRY):
                        return {}
                    with open(REGISTRY) as f:
                        data = yaml.safe_load(f) or {}
                    out = {}
                    for e in data.get("models") or []:
                        m = (e.get("model") or "").strip()
                        if m:
                            out[m] = e
                    return out

                def webhook_url():
                    for v in (os.getenv("TEAMS_WEBHOOK_URL", ""), os.getenv("MUNKI_TEAMS_CHANNEL", "")):
                        v = v.strip()
                        if v and not v.startswith("$("):
                            return v
                    return ""

                def post_teams(unresolved):
                    url = webhook_url()
                    if not url or not unresolved:
                        return
                    lines = "\n".join(
                        f"- `{m}` ({n} device{'s' if n != 1 else ''}) -- defaulted to **desktop**"
                        for m, n in unresolved)
                    text = ("**Unrecognized Mac model identifiers in Intune**\n\n"
                            "These aren't in AppleDB yet, so they were defaulted to "
                            "**desktop** in `provisioning/models.yaml`. They self-heal "
                            "automatically once AppleDB lists them (next run re-resolves). "
                            "If one is actually a **laptop** and you don't want to wait, "
                            "set `form_factor: laptop` and `classified_by: manual` -- that "
                            "override is preserved forever.\n\n" + lines)
                    card = {"@type": "MessageCard", "@context": "http://schema.org/extensions",
                            "summary": "Unrecognized Mac model identifiers", "themeColor": "0076D7",
                            "title": "Device-model registry: unrecognized identifiers", "text": text}
                    try:
                        req = Request(url, data=json.dumps(card).encode(),
                                      headers={"Content-Type": "application/json"})
                        urlopen(req, timeout=20)
                        log.info("Posted Teams alert for %d unresolved identifier(s).", len(unresolved))
                    except Exception as e:
                        log.warning("Teams alert failed: %s", e)

                def main():
                    token = os.getenv("GRAPH_TOKEN")
                    if not token or token.startswith("$("):
                        log.error("Missing GRAPH_TOKEN; skipping.")
                        return 0
                    counts, total = fetch_model_counts(token)
                    log.info("Intune: %d enrolled macOS device(s), %d distinct model string(s).",
                             total, len(counts))
                    if not counts:
                        log.warning("No models returned; leaving registry untouched.")
                        return 0
                    existing = load_registry()
                    models, unresolved = {}, []
                    for model, count in counts.items():
                        ff, by, miss = resolve(model, existing.get(model))
                        models[model] = {"model": model, "form_factor": ff, "classified_by": by}
                        if miss:
                            unresolved.append((model, count))
                    # A completed Graph pagination is authoritative (any page error
                    # aborts before we write), so a model absent now is genuinely
                    # gone -- prune it. The empty-result guard above is the only
                    # safety net needed; there is no fleet-size threshold to tune.
                    pruned = sorted(set(existing) - set(models))
                    if pruned:
                        log.info("Pruned %d model(s) no longer enrolled: %s",
                                 len(pruned), ", ".join(pruned))

                    ordered = sorted(models.values(), key=lambda e: (e["form_factor"], e["model"]))
                    header = (
                        "# Active Mac models in the fleet, auto-maintained by\n"
                        "# munki-intune-mgmt.yml (maintainModelRegistry stage). Rewritten\n"
                        "# from Intune each run: enrolled models listed, departed models pruned.\n"
                        "# DO NOT hand-edit except to add a manual override (see below).\n"
                        "#\n"
                        "# Intune reports device.model as a marketing name when Microsoft's\n"
                        "# lookup tables know the hardware, and as a bare identifier (Mac16,3)\n"
                        "# when they don't. Identifiers are resolved to a form factor via\n"
                        "# AppleDB (api.appledb.dev); marketing names by the MacBook/iMac/...\n"
                        "# prefix. machine_type filters treat laptops as the MacBook family and\n"
                        "# desktop as the exact complement, so classification just needs to be\n"
                        "# right -- which AppleDB makes automatic.\n"
                        "#\n"
                        "# classified_by: appledb=resolved via AppleDB, prefix=name-matched,\n"
                        "# assumed=not in AppleDB yet (defaulted to desktop; self-heals when\n"
                        "# AppleDB lists it), manual=set by a human and never overwritten.\n"
                        "#\n"
                        "# Manual override (rare): if an 'assumed' entry is wrong and you don't\n"
                        "# want to wait for AppleDB, set form_factor + classified_by: manual.\n"
                        "\n")
                    with open(REGISTRY, "w") as f:
                        f.write(header)
                        yaml.safe_dump({"models": ordered}, f, default_flow_style=False, sort_keys=False)
                    log.info("Wrote %s: %d model(s), %d unresolved identifier(s).",
                             REGISTRY, len(ordered), len(unresolved))
                    post_teams(unresolved)
                    return 0

                if __name__ == "__main__":
                    raise SystemExit(main())
          - script: |
              if [ -n "$(git status --porcelain provisioning/models.yaml)" ]; then
                git add provisioning/models.yaml
                git commit -m "Update device-model registry from Intune"
                git push origin HEAD:main
                echo "Registry updated and pushed."
              else
                echo "No registry changes."
              fi
            displayName: 'Commit registry changes'
            continueOnError: true

#------------------------------------------------------------------------------
# STAGE 2: Push unsigned macOS .mobileconfig to Intune
#------------------------------------------------------------------------------
  - stage: pushMobileConfigs
    displayName: "Push Profiles"
    dependsOn: detectChanges
    condition: |
      and(
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.TargetedMode'], 'true'),
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ReconcileOnly'], 'true'),
        or(
          eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ProfilesChanged'], 'true'),
          eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ManifestsChanged'], 'true')
        )
      )
    jobs:
      - job: pushConfigs
        displayName: "Push macOS .mobileconfig files"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: Bash@3
            displayName: 'Upload .mobileconfig profiles to Intune'
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              CERT_P12_PASSWORD: $(DevApplicationCertPassword)
            inputs:
              targetType: 'inline'
              script: |
                set -e
                ACCESS_TOKEN="$GRAPH_TOKEN"
                
                # Fetch existing macOSCustomConfiguration items
                echo "Retrieving device configs from Intune..."
                set +x
                all_configs="$(
                  curl -s -X GET \
                    -H "Authorization: Bearer $ACCESS_TOKEN" \
                    "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations?\$top=999"
                )"
                set -e
                existing_configs="$(
                  echo "$all_configs" | python3 -c '
                import sys, json
                data = json.load(sys.stdin)
                items = data.get("value", [])
                macos = [x for x in items if x.get("@odata.type") == "#microsoft.graph.macOSCustomConfiguration"]
                print(json.dumps({"value": macos}))
                '
                )"
                
                count="$(echo "$existing_configs" | python3 -c '
                import sys, json
                data = json.load(sys.stdin)
                print(len(data.get("value", [])))
                ')"
                echo "Found $count existing macOSCustomConfiguration items. Names:"
                echo "$existing_configs" | python3 -c '
                import sys, json
                data = json.load(sys.stdin)
                for item in data.get("value", []):
                    print(" -", item.get("displayName", "(no displayName)"))
                '
                
                declare -a existing_map__KEYS=()
                declare -a found_local__KEYS=()
                
                set_map() {
                  local mapName="$1"
                  local key="$2"
                  local val="$3"
                  eval "${mapName}_$key=\"\$val\""
                  local keyListVar="${mapName}__KEYS"
                  eval '
                if [[ " ${'"$keyListVar"'[*]} " != *" '$key' "* ]]; then
                  '"$keyListVar"'+=("'$key'")
                fi
                '
                }
                
                get_map() {
                  local mapName="$1"
                  local key="$2"
                  eval "echo \"\${${mapName}_$key:-}\""
                }
                
                list_map_keys() {
                  local mapName="$1"
                  local keyListVar="${mapName}__KEYS"
                  eval "echo \"\${${keyListVar}[@]}\""
                }
                
                # Build map of displayName -> configId
                while IFS= read -r row; do
                  dispName="$(echo "$row" | python3 -c 'import sys, json; j=json.load(sys.stdin); print(j["displayName"])')"
                  cfgId="$(echo "$row" | python3 -c 'import sys, json; j=json.load(sys.stdin); print(j["id"])')"
                  cfgType="$(echo "$row" | python3 -c 'import sys, json; j=json.load(sys.stdin); print(j["@odata.type"])')"
                  safeDispName="$(echo "$dispName" | sed 's/[^A-Za-z0-9_]/_/g')"
                  set_map "existing_map" "$safeDispName" "$cfgId"
                  set_map "existing_map_type" "$safeDispName" "$cfgType"
                done < <(echo "$existing_configs" | python3 -c '
                import sys, json
                data = json.load(sys.stdin)
                for item in data.get("value", []):
                    print(json.dumps({
                        "displayName": item["displayName"],
                        "id": item["id"],
                        "@odata.type": item["@odata.type"]
                    }))
                ')
                
                # Upload all local .mobileconfig files WITHOUT signing
                while IFS= read -r -d '' file; do
                  filename="$(basename "$file")"
                  displayName="${filename%.mobileconfig}"
                  safeDispName="$(echo "$displayName" | sed 's/[^A-Za-z0-9_]/_/g')"
                  staleDispName="${safeDispName}_STALE"
                  echo "Using unsigned file: $file"
                  payload_b64="$(base64 -i "$file")"
                  # Stable hash of *what we send* (displayName + payload), stamped into
                  # the description as a [munki-sync-hash:...] marker. The existing-profile
                  # branch below skips the PATCH when the remote marker already matches, so
                  # an unchanged .mobileconfig no longer bumps the Intune profile version and
                  # re-delivers to every assigned Mac -- that needless reinstall churn was
                  # dropping VPN shared-secret/keychain state mid-session. Mirrors the
                  # cimian-sync-hash gate already in cimian-intune-mgmt.yml.
                  localHash="$(printf '%s\n%s' "$displayName" "$payload_b64" | shasum -a 256 | cut -d' ' -f1)"
                  config_json="{
                  \"@odata.type\": \"#microsoft.graph.macOSCustomConfiguration\",
                  \"displayName\": \"$displayName\",
                  \"description\": \"Managed in Munki DevOps. Deployed via Azure DevOps. [munki-sync-hash:$localHash]\",
                  \"payloadName\": \"$displayName\",
                  \"payload\": \"$payload_b64\",
                  \"payloadFileName\": \"$(basename "$file")\",
                  \"roleScopeTagIds\": [\"0\"]
                }"
                  stripped_json="$(echo "$config_json" | python3 -c '
                import sys, json
                doc = json.load(sys.stdin)
                doc.pop("payload", None)
                print(json.dumps(doc, indent=2))
                ')"
                  echo "config_json:"
                  echo "$stripped_json"
                  existing_id="$(get_map "existing_map" "$safeDispName")"
                  stale_id="$(get_map "existing_map" "$staleDispName")"
                  
                  if [[ -n "$existing_id" ]]; then
                    # Skip the PATCH when the remote profile already carries this exact
                    # content hash -- a no-op PATCH still bumps the Intune version and
                    # re-delivers the profile to every assigned device.
                    remote_hash="$(
                      curl -s -X GET \
                        -H "Authorization: Bearer $ACCESS_TOKEN" \
                        "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$existing_id?\$select=description" \
                      | python3 -c 'import sys, json, re; d=(json.load(sys.stdin).get("description") or ""); m=re.search(r"\[munki-sync-hash:([0-9a-f]+)\]", d); print(m.group(1) if m else "")' 2>/dev/null || echo ""
                    )"
                    if [[ -n "$remote_hash" && "$remote_hash" == "$localHash" ]]; then
                      echo "Skipping PATCH (no change): $displayName ($existing_id) [hash=$localHash]"
                    else
                      # Profile exists with current name and content differs, update it
                      update_resp="$(
                        curl -s -X PATCH \
                          -H "Authorization: Bearer $ACCESS_TOKEN" \
                          -H "Content-Type: application/json" \
                          -d "$config_json" \
                          "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$existing_id"
                      )"
                      echo "Update (PATCH) response:"
                      echo "$update_resp"
                      echo "Updated macOS profile: $displayName ($existing_id)"
                    fi
                  elif [[ -n "$stale_id" ]]; then
                    # Profile exists with _STALE suffix, restore it by renaming and updating
                    echo "Restoring stale profile: $displayName ($stale_id)"
                    restore_resp="$(
                      curl -s -X PATCH \
                        -H "Authorization: Bearer $ACCESS_TOKEN" \
                        -H "Content-Type: application/json" \
                        -d "$config_json" \
                        "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$stale_id"
                    )"
                    echo "Restore (PATCH) response:"
                    echo "$restore_resp"
                    echo "Restored macOS profile from stale: $displayName ($stale_id)"
                  else
                    # Guard: query server to confirm no profile with this name exists
                    # (prevents duplicates if initial fetch was incomplete)
                    guard_resp="$(
                      curl -s -X GET \
                        -H "Authorization: Bearer $ACCESS_TOKEN" \
                        "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations?\$filter=displayName%20eq%20'$(python3 -c "import urllib.parse; print(urllib.parse.quote(\"$displayName\"))")'"
                    )"
                    guard_id="$(echo "$guard_resp" | python3 -c '
                import sys, json
                data = json.load(sys.stdin)
                items = [x for x in data.get("value", []) if x.get("@odata.type") == "#microsoft.graph.macOSCustomConfiguration"]
                print(items[0]["id"] if items else "")
                ' 2>/dev/null || echo "")"
                    if [[ -n "$guard_id" ]]; then
                      echo "Guard: found existing profile $displayName ($guard_id) via server query, updating instead of creating."
                      guard_update="$(
                        curl -s -X PATCH \
                          -H "Authorization: Bearer $ACCESS_TOKEN" \
                          -H "Content-Type: application/json" \
                          -d "$config_json" \
                          "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$guard_id"
                      )"
                      echo "Guard update (PATCH) response:"
                      echo "$guard_update"
                    else
                      # No existing profile confirmed, create new one
                      create_resp="$(
                        curl -s -X POST \
                          -H "Authorization: Bearer $ACCESS_TOKEN" \
                          -H "Content-Type: application/json" \
                          -d "$config_json" \
                          "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations"
                      )"
                      echo "Create (POST) response:"
                      echo "$create_resp"
                      newId="$(echo "$create_resp" | python3 -c 'import sys, json; print(json.load(sys.stdin).get("id", ""))')"
                      echo "Created new macOS profile: $displayName ($newId)"
                    fi
                  fi
                  set_map "found_local" "$safeDispName" "1"
                done < <(find "$MUNKI_PROFILES_FOLDER" -type f -name '*.mobileconfig' ! -name '*Signed.mobileconfig' -print0)
                echo "Finished creating and updating profiles. Checking for stale profiles..."
                echo ""
                # Mark stale macOS profiles that no longer exist locally by renaming them
                for dispName in $(list_map_keys "existing_map"); do
                  if [[ -z "$(get_map "found_local" "$dispName")" ]]; then
                    staleId="$(get_map "existing_map" "$dispName")"
                    profileType="$(get_map "existing_map_type" "$dispName")"
                    if [[ "$profileType" == "#microsoft.graph.macOSCustomConfiguration" ]]; then
                      # Check if this is already a stale profile (ends with _STALE)
                      if [[ "$dispName" == *"_STALE" ]]; then
                        echo "Profile $dispName is already marked as stale, skipping."
                        continue
                      fi
                      
                      # Get original display name from the configuration
                      original_display_name="$(
                        curl -s -X GET \
                          -H "Authorization: Bearer $ACCESS_TOKEN" \
                          "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$staleId" | \
                        python3 -c 'import sys, json; print(json.load(sys.stdin).get("displayName", ""))'
                      )"
                      
                      stale_display_name="${original_display_name}_STALE"
                      echo "Marking macOS profile as stale: $dispName -> $stale_display_name ($staleId)"
                      
                      # Create stale config JSON with updated displayName
                      stale_config_json="{
                        \"@odata.type\": \"#microsoft.graph.macOSCustomConfiguration\",
                        \"displayName\": \"$stale_display_name\",
                        \"description\": \"STALE - Managed in Munki DevOps. No longer active in manifests.\"
                      }"
                      
                      stale_resp="$(
                        curl -s -X PATCH \
                          -H "Authorization: Bearer $ACCESS_TOKEN" \
                          -H "Content-Type: application/json" \
                          -d "$stale_config_json" \
                          "https://graph.microsoft.com/v1.0/deviceManagement/deviceConfigurations/$staleId"
                      )"
                      echo "Stale rename (PATCH) response:"
                      echo "$stale_resp"
                      echo "Marked macOS profile as stale: $stale_display_name ($staleId)"
                    else
                      echo "Skipping stale config $dispName ($staleId), type=$profileType"
                    fi
                  fi
                done
                echo "All synchronization steps complete."

#------------------------------------------------------------------------------
# STAGE 2.6: Push macOS DDM Settings Catalog profiles to Intune
#------------------------------------------------------------------------------
  - stage: pushSettingsCatalog
    displayName: "Push Settings Catalog"
    dependsOn: detectChanges
    condition: |
      and(
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.TargetedMode'], 'true'),
        eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ProfilesChanged'], 'true')
      )
    jobs:
      - job: pushSettingsCatalog
        displayName: "Send DDM Settings Catalog profiles to Intune"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests pyyaml
            displayName: "Install Python Dependencies"
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: PythonScript@0
            displayName: "Push DDM Settings Catalog profiles"
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              MUNKI_PROFILES_FOLDER: $(MUNKI_PROFILES_FOLDER)
            inputs:
              scriptSource: 'inline'
              script: |
                # ===================================================================
                #  PUSH macOS DDM SETTINGS CATALOG PROFILES
                #
                #  Reads profiles/**/*.yaml files that carry a `settingsCatalog:`
                #  block and deploys each as a macOS Settings Catalog (Declarative
                #  Device Management) policy via Microsoft Graph, then assigns it to
                #  its include groups while excluding any exclude groups.
                #
                #  Only policies whose description carries the managed marker are
                #  ever modified or deleted -- portal-created policies are left
                #  untouched. A content hash in the description lets an unchanged
                #  policy be skipped instead of recreated.
                # ===================================================================
                import os
                import glob
                import json
                import hashlib
                import logging
                import requests
                import yaml

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _n in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_n).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH = "https://graph.microsoft.com/beta/deviceManagement"
                GRAPH_V1 = "https://graph.microsoft.com/v1.0"
                MARKER = "[managed-by:munki-intune-mgmt]"
                PROFILES_DIR = os.getenv("MUNKI_PROFILES_FOLDER", "profiles")
                TOKEN = os.getenv("GRAPH_TOKEN")

                def headers():
                    return {"Authorization": "Bearer " + TOKEN,
                            "Content-Type": "application/json"}

                def get_all(url):
                    items = []
                    while url:
                        r = requests.get(url, headers=headers())
                        r.raise_for_status()
                        data = r.json()
                        items += data.get("value", [])
                        url = data.get("@odata.nextLink")
                    return items

                def build_instance(node):
                    """Recursively convert a YAML settings node to a Graph instance."""
                    kind = node.get("kind")
                    sid = node["id"]
                    if kind == "group":
                        children = [build_instance(c) for c in node.get("children", [])]
                        return {
                            "@odata.type": "#microsoft.graph.deviceManagementConfigurationGroupSettingCollectionInstance",
                            "settingDefinitionId": sid,
                            "groupSettingCollectionValue": [{"children": children}],
                        }
                    if kind == "choice":
                        return {
                            "@odata.type": "#microsoft.graph.deviceManagementConfigurationChoiceSettingInstance",
                            "settingDefinitionId": sid,
                            "choiceSettingValue": {
                                "value": node["value"],
                                "children": [build_instance(c) for c in node.get("children", [])],
                            },
                        }
                    if kind in ("integer", "string"):
                        vtype = "IntegerSettingValue" if kind == "integer" else "StringSettingValue"
                        value = int(node["value"]) if kind == "integer" else str(node["value"])
                        return {
                            "@odata.type": "#microsoft.graph.deviceManagementConfigurationSimpleSettingInstance",
                            "settingDefinitionId": sid,
                            "simpleSettingValue": {
                                "@odata.type": "#microsoft.graph.deviceManagementConfiguration" + vtype,
                                "value": value,
                            },
                        }
                    raise ValueError("unknown setting kind '%s' for '%s'" % (kind, sid))

                def build_settings(doc):
                    return [
                        {"@odata.type": "#microsoft.graph.deviceManagementConfigurationSetting",
                         "settingInstance": build_instance(root)}
                        for root in doc.get("settingsCatalog", [])
                    ]

                def find_group_id(name):
                    safe = name.replace("'", "''")
                    r = requests.get(
                        GRAPH_V1 + "/groups?$filter=displayName eq '" + safe + "'&$select=id",
                        headers=headers())
                    r.raise_for_status()
                    v = r.json().get("value", [])
                    return v[0]["id"] if v else None

                def assign(policy_id, include_ids, exclude_ids):
                    targets = []
                    for gid in include_ids:
                        targets.append({"target": {
                            "@odata.type": "#microsoft.graph.groupAssignmentTarget",
                            "groupId": gid}})
                    for gid in exclude_ids:
                        targets.append({"target": {
                            "@odata.type": "#microsoft.graph.exclusionGroupAssignmentTarget",
                            "groupId": gid}})
                    r = requests.post(
                        GRAPH + "/configurationPolicies/" + policy_id + "/assign",
                        headers=headers(), json={"assignments": targets})
                    r.raise_for_status()

                def delete_policy(policy_id):
                    d = requests.delete(GRAPH + "/configurationPolicies/" + policy_id,
                                        headers=headers())
                    return d.status_code < 400 or d.status_code == 404

                def process(path, existing_policies):
                    with open(path) as f:
                        doc = yaml.safe_load(f) or {}
                    if not isinstance(doc, dict) or not doc.get("settingsCatalog"):
                        return None
                    name = doc["displayName"]
                    log.info("=== %s  (%s) ===", name, path)

                    settings = build_settings(doc)
                    technologies = doc.get("technologies", "mdm,appleRemoteManagement")
                    tags = [str(t) for t in (doc.get("roleScopeTagIds") or [0])]
                    assignments = doc.get("assignments") or {}
                    include_names = assignments.get("include") or []
                    exclude_names = assignments.get("exclude") or []

                    content_hash = hashlib.sha1(json.dumps({
                        "name": name, "technologies": technologies, "tags": tags,
                        "settings": settings,
                        "include": sorted(include_names),
                        "exclude": sorted(exclude_names),
                    }, sort_keys=True, separators=(",", ":")).encode()).hexdigest()[:12]
                    hash_tag = "[suhash:" + content_hash + "]"

                    same_name = [p for p in existing_policies if p.get("name") == name]
                    managed = [p for p in same_name
                               if MARKER in (p.get("description") or "")]
                    for p in same_name:
                        if p not in managed:
                            log.warning("  a policy '%s' (%s) exists without the managed "
                                        "marker - leaving it untouched", name, p["id"])

                    up_to_date = [p for p in managed
                                  if hash_tag in (p.get("description") or "")]
                    if up_to_date:
                        keep = up_to_date[0]
                        log.info("  unchanged (hash %s) - keeping %s", content_hash, keep["id"])
                        for p in managed:
                            if p["id"] != keep["id"] and delete_policy(p["id"]):
                                log.info("  removed superseded copy %s", p["id"])
                        return True

                    # Resolve assignment groups (read-only on directory groups).
                    include_ids, exclude_ids = [], []
                    for g in include_names:
                        gid = find_group_id(g)
                        if gid:
                            include_ids.append(gid)
                        else:
                            log.error("  include group '%s' not found - assignment "
                                      "will be incomplete", g)
                    for g in exclude_names:
                        gid = find_group_id(g)
                        if gid:
                            exclude_ids.append(gid)
                        else:
                            log.warning("  exclude group '%s' not found - skipping "
                                        "exclusion (no devices to exclude yet)", g)

                    description = " ".join(x for x in [
                        (doc.get("description") or "").strip(), MARKER, hash_tag] if x)
                    body = {
                        "name": name,
                        "description": description,
                        "platforms": doc.get("platform", "macOS"),
                        "technologies": technologies,
                        "roleScopeTagIds": tags,
                        "settings": settings,
                    }

                    r = requests.post(GRAPH + "/configurationPolicies",
                                      headers=headers(), json=body)
                    if r.status_code >= 400:
                        log.error("  create failed: HTTP %s %s", r.status_code, r.text)
                        return False
                    new_id = r.json()["id"]
                    log.info("  created policy %s (hash %s)", new_id, content_hash)

                    if include_ids or exclude_ids:
                        assign(new_id, include_ids, exclude_ids)
                        log.info("  assigned: %d include, %d exclude",
                                 len(include_ids), len(exclude_ids))
                    else:
                        log.warning("  no assignment targets resolved - policy "
                                    "created but left unassigned")

                    for p in managed:
                        if delete_policy(p["id"]):
                            log.info("  removed previous policy %s", p["id"])
                        else:
                            log.warning("  could not delete old policy %s", p["id"])
                    return True

                def main():
                    if not TOKEN:
                        log.error("Missing GRAPH_TOKEN env var.")
                        return 1
                    files = sorted(
                        glob.glob(PROFILES_DIR + "/**/*.yaml", recursive=True)
                        + glob.glob(PROFILES_DIR + "/**/*.yml", recursive=True))
                    existing = get_all(
                        GRAPH + "/configurationPolicies?$select=id,name,description")
                    log.info("Found %d existing Settings Catalog policies in Intune.",
                             len(existing))

                    processed = failed = 0
                    for path in files:
                        try:
                            result = process(path, existing)
                        except Exception as ex:
                            log.error("  error processing %s: %s", path, ex)
                            failed += 1
                            continue
                        if result is None:
                            continue
                        processed += 1
                        if result is False:
                            failed += 1
                    log.info("Settings Catalog sync: %d profile(s) processed, %d failed.",
                             processed, failed)
                    return 1 if failed else 0

                if __name__ == "__main__":
                    raise SystemExit(main())

#------------------------------------------------------------------------------
# STAGE 2.5: Sync Entra group membership for changed manifests
#------------------------------------------------------------------------------
  - stage: syncGroupMembership
    displayName: "Sync Group Membership"
    dependsOn: detectChanges
    condition: "eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ManifestsChanged'], 'true')"
    variables:
      changedManifestPaths: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ChangedManifestPaths'] ]
      targetedMode: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.TargetedMode'] ]
      targetSerials: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.TargetSerials'] ]
      reconcileOnly: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ReconcileOnly'] ]
    jobs:
      - job: syncGroups
        displayName: "Ensure devices are in correct Entra groups"
        pool:
          vmImage: 'macos-latest'
        variables:
          changedManifestPaths: $[stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ChangedManifestPaths']]
          targetedMode: $[stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.TargetedMode']]
          targetSerials: $[stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.TargetSerials']]
          reconcileOnly: $[stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ReconcileOnly']]
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests
            displayName: "Install Python Dependencies"
          # Gate every sync on the group-membership test suite. The suite extracts the
          # sync straight out of this file and runs it against an in-memory Graph, so a
          # change that would strip the wrong platform, empty a group, or act on degraded
          # inventory fails here rather than against the live tenant.
          - script: python3 tests/group_sync/test_sync.py
            displayName: "Test group membership sync"
          # And the mirror guard for the assignment side: a collapsed manifest parse
          # must not unassign a profile from every device. Extracted from this file
          # the same way, so it tests exactly what ships.
          - script: python3 tests/assignment_guard/test_assignment_guard.py
            displayName: "Test assignment floor guards"
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token & Download intune.csv'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
                az storage blob download \
                  --account-name $(INVENTORY_STORAGE_ACCOUNT) \
                  --container-name inventory-data \
                  --name production/intune.csv \
                  --file "$(Build.SourcesDirectory)/intune.csv" \
                  --auth-mode login
                echo "##vso[task.setvariable variable=INTUNE_CSV_PATH]$(Build.SourcesDirectory)/intune.csv"
          - task: PythonScript@0
            displayName: "Targeted Group Membership Sync"
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              CHANGED_MANIFEST_PATHS: $(changedManifestPaths)
              TARGETED_MODE: $(targetedMode)
              TARGET_SERIALS: $(targetSerials)
              INTUNE_CSV_PATH: $(INTUNE_CSV_PATH)
              ALLOW_LARGE_SHRINK: ${{ parameters.allowLargeShrink }}
              WHATIF: ${{ parameters.whatIf }}
              ALLOW_SHRINK_GROUPS: ${{ parameters.allowShrinkGroups }}
              ENSURE_PLACEHOLDER_GROUPS: 'true'
            inputs:
              scriptSource: 'inline'
              script: |
                """
                Entra Group Membership Sync for Munki (macOS) Manifests

                Supports two modes:
                  1. Normal mode: triggered by manifest changes, syncs groups using
                     intune.csv from blob storage (existing behavior).
                  2. Targeted mode: triggered by targetSerials/targetManifest parameters,
                     reads computers.csv for hierarchy mapping and queries Graph API
                     for fresh object_ids (bypasses stale intune.csv).

                Platform filter: Macintosh only (Munki is macOS)
                """
                import os
                import csv
                import io
                import logging
                import time
                import requests

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _noisy in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_noisy).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH_BASE = "https://graph.microsoft.com/v1.0"
                GRAPH_BETA = "https://graph.microsoft.com/beta"
                COMPUTERS_CSV = "deployment/enroll/computers.csv"

                # Platform filter for this pipeline (Munki = macOS only)
                PLATFORM_FILTER = "Macintosh"

                # Top-level usage roots that map to device hierarchy groups
                USAGE_ROOTS = {"Assigned", "Shared"}

                # Intune's own operatingSystem value for this pipeline's platform. Distinct from
                # PLATFORM_FILTER above, which matches intune.csv's inventory-supplied column:
                # the eviction guard is built from Graph, not from the CSV.
                INTUNE_OS_FILTER = "macOS"

                # Membership converges fully on every run -- the manifests are the source of truth
                # and a group left half-synced is drift. There is deliberately no cap on how many
                # members may be removed: capping the OUTPUT silently leaves groups wrong, which is
                # the failure we are trying to eliminate.
                #
                # Safety comes from validating the INPUT instead. Config profiles and policies are
                # assigned to these groups, so a wrong membership diff pulls real settings off real
                # machines. If any input looks degraded we abort the entire run before performing a
                # single write, and exit non-zero so the pipeline goes red. Refusing to act on bad
                # data is safe; acting on it is not; quietly skipping part of the work is neither.
                MIN_INVENTORY_ROWS = 500          # intune.csv floor; the real file carries ~1500
                MIN_PLATFORM_DEVICES = 100        # floor for this platform's live Graph objects
                MIN_GROUP_RESOLUTION_RATIO = 0.95  # per-group serial -> Entra object resolution
                MIN_NONBLANK_RATIO = 0.95          # rows carrying a usable serial / usage value
                # A sync must never empty a group, and must never take out most of one. Every
                # realistic inventory corruption -- a blank column, a renamed header, an upstream
                # join that fails -- collapses the desired set to nothing, and an empty desired set
                # otherwise means "remove every member we own". That is indistinguishable from a
                # legitimate emptying, so treat it as bad input and abort. Set ALLOW_LARGE_SHRINK
                # to push a genuine bulk decommission through deliberately.
                MAX_GROUP_SHRINK = 0.50
                # Guards have to tell local churn apart from a systemic collapse. A leaf group
                # emptying because its last occupant moved room is routine; every group emptying
                # at once because a column arrived blank is the catastrophe. So small absolute
                # removals are always allowed, the percentage guard applies above that, and a
                # separate ceiling on the whole run catches the systemic case.
                MAX_SMALL_REMOVAL = 5
                MAX_TOTAL_SHRINK = 0.20
                REQUIRED_CSV_COLUMNS = ("serial", "platform", "usage", "status")


                def _graph_call(method, url, **kw):
                    """
                    Graph call with backoff.

                    Both orchestration pipelines may run at once and will throttle each other.
                    A 429 or a transient 5xx must not fail a run: the sync is all-or-nothing, so
                    a single throttled page would abort the whole reconcile and leave membership
                    stale. Honour Retry-After when Graph sends it.
                    """
                    delay = 2
                    last = None
                    for attempt in range(8):
                        resp = getattr(requests, method)(url, **kw)
                        if resp.status_code not in (429, 500, 502, 503, 504):
                            return resp
                        last = resp
                        wait = delay
                        try:
                            hdr = getattr(resp, "headers", None) or {}
                            wait = int(hdr.get("Retry-After") or delay)
                        except (TypeError, ValueError):
                            wait = delay
                        log.warning("Graph %s %s -> %s; retrying in %ss (attempt %d/8)",
                                    method.upper(), url.split("?")[0][-60:], resp.status_code, wait, attempt + 1)
                        time.sleep(min(wait, 60))
                        delay = min(delay * 2, 60)
                    return last


                class GraphClient:
                    def __init__(self, token):
                        self.token = token
                        log.info("Graph API token provided.")

                    def _headers(self):
                        return {
                            "Authorization": f"Bearer {self.token}",
                            "Content-Type": "application/json"
                        }

                    def find_group(self, group_name):
                        safe = group_name.replace("'", "''")
                        url = f"{GRAPH_BASE}/groups?$filter=displayName eq '{safe}'&$select=id,displayName"
                        r = _graph_call("get", url, headers=self._headers())
                        r.raise_for_status()
                        items = r.json().get("value", [])
                        return items[0]["id"] if items else None

                    def create_group(self, group_name):
                        body = {
                            "displayName": group_name,
                            "description": "Auto-created by DevOps pipeline for manifest-based device management.",
                            "mailEnabled": False,
                            "mailNickname": group_name.replace("-", "").replace(" ", "")[:64],
                            "securityEnabled": True,
                            "groupTypes": []
                        }
                        r = _graph_call("post", f"{GRAPH_BASE}/groups", headers=self._headers(), json=body)
                        if r.status_code >= 400:
                            log.error("Failed to create group '%s': %s %s", group_name, r.status_code, r.text)
                            return None
                        gid = r.json()["id"]
                        log.info("Created group '%s' (%s)", group_name, gid)
                        return gid

                    def get_or_create_group(self, group_name):
                        gid = self.find_group(group_name)
                        if not gid:
                            gid = self.create_group(group_name)
                        return gid

                    def list_managed_group_names(self):
                        """Return the set of existing 'Devices-' group displayNames in one
                        paged sweep, so the placeholder pass creates only the missing groups
                        instead of a find_group call per manifest node."""
                        names = set()
                        url = (f"{GRAPH_BASE}/groups?$filter=startswith(displayName,'Devices-')"
                               "&$select=displayName&$top=999")
                        while url:
                            r = _graph_call("get", url, headers=self._headers())
                            r.raise_for_status()
                            data = r.json()
                            for g in data.get("value", []):
                                dn = g.get("displayName")
                                if dn:
                                    names.add(dn)
                            url = data.get("@odata.nextLink")
                        return names

                    def get_group_members(self, group_id):
                        members = set()
                        url = f"{GRAPH_BASE}/groups/{group_id}/members?$select=id&$top=999"
                        first_page = True
                        while url:
                            r = _graph_call("get", url, headers=self._headers())
                            # Graph directory can 404 a just-created group for a few
                            # seconds while the read replica catches up. Retry once.
                            if first_page and r.status_code == 404:
                                time.sleep(3)
                                r = _graph_call("get", url, headers=self._headers())
                                if r.status_code == 404:
                                    log.warning("Group %s still 404 after retry; treating as empty.", group_id)
                                    return set()
                            r.raise_for_status()
                            data = r.json()
                            for m in data.get("value", []):
                                members.add(m["id"])
                            url = data.get("@odata.nextLink")
                            first_page = False
                        return members

                    def add_member(self, group_id, object_id):
                        body = {
                            "@odata.id": f"{GRAPH_BASE}/directoryObjects/{object_id}"
                        }
                        r = _graph_call("post", 
                            f"{GRAPH_BASE}/groups/{group_id}/members/$ref",
                            headers=self._headers(), json=body
                        )
                        if r.status_code == 400 and "already exist" in r.text.lower():
                            return
                        if r.status_code >= 400:
                            log.warning("Failed to add %s to group %s: %s", object_id, group_id, r.text)

                    def remove_member(self, group_id, object_id):
                        r = _graph_call("delete", 
                            f"{GRAPH_BASE}/groups/{group_id}/members/{object_id}/$ref",
                            headers=self._headers()
                        )
                        if r.status_code >= 400:
                            log.warning("Failed to remove %s from group %s: %s", object_id, group_id, r.text)

                    def build_serial_to_object_id_map(self, platform_filter=None):
                        """
                        Bulk fetch: serial -> live Entra object_id.
                        Step 1: all Intune managed devices -> serial -> azureADDeviceId.
                        Step 2: all Entra devices -> azureADDeviceId -> object_id.
                        Returns dict {serial_upper: object_id}.
                        """
                        # Step 1: fetch all Intune managed devices
                        intune_url = (
                            f"{GRAPH_BETA}/deviceManagement/managedDevices"
                            f"?$select=serialNumber,azureADDeviceId,managementState,enrolledDateTime"
                            f"&$top=999"
                        )
                        if platform_filter:
                            intune_url += f"&$filter=operatingSystem eq '{platform_filter}'"
                        intune_devices = []
                        url = intune_url
                        while url:
                            r = _graph_call("get", url, headers=self._headers())
                            r.raise_for_status()
                            data = r.json()
                            intune_devices.extend(data.get("value", []))
                            url = data.get("@odata.nextLink")
                        log.info("Fetched %d Intune managed devices", len(intune_devices))

                        # serial -> most-recent, non-retired Intune record -> azureADDeviceId
                        serial_to_azure_id = {}
                        for d in intune_devices:
                            serial = d.get("serialNumber", "").strip().upper()
                            azure_id = d.get("azureADDeviceId", "").strip()
                            if not serial or not azure_id:
                                continue
                            existing = serial_to_azure_id.get(serial)
                            if existing is None:
                                serial_to_azure_id[serial] = d
                            else:
                                # prefer non-retired, then most recently enrolled
                                retired = {"retired", "deleted"}
                                ex_retired = existing.get("managementState") in retired
                                new_retired = d.get("managementState") in retired
                                if ex_retired and not new_retired:
                                    serial_to_azure_id[serial] = d
                                elif not ex_retired and not new_retired:
                                    if d.get("enrolledDateTime", "") > existing.get("enrolledDateTime", ""):
                                        serial_to_azure_id[serial] = d

                        # Step 2: fetch all Entra devices -> azureADDeviceId -> object_id
                        entra_url = f"{GRAPH_BASE}/devices?$select=id,deviceId&$top=999"
                        azure_id_to_object_id = {}
                        url = entra_url
                        while url:
                            r = _graph_call("get", url, headers=self._headers())
                            r.raise_for_status()
                            data = r.json()
                            for dev in data.get("value", []):
                                did = dev.get("deviceId", "").strip()
                                oid = dev.get("id", "").strip()
                                if did and oid:
                                    azure_id_to_object_id[did] = oid
                            url = data.get("@odata.nextLink")
                        log.info("Fetched %d Entra device objects", len(azure_id_to_object_id))

                        # Join: serial -> object_id
                        result = {}
                        for serial, rec in serial_to_azure_id.items():
                            azure_id = rec.get("azureADDeviceId", "").strip()
                            oid = azure_id_to_object_id.get(azure_id)
                            if oid:
                                result[serial] = oid
                        # Serials Intune has a record for, before the Entra join. A device in
                        # inventory but absent here is simply not enrolled -- a normal steady
                        # state, not a Graph failure -- and must not count against the
                        # resolution check below.
                        self.enrolled_serials = {
                            (d.get("serialNumber") or "").strip().upper()
                            for d in intune_devices
                            if (d.get("serialNumber") or "").strip()
                        }
                        log.info("Resolved %d serial -> object_id mappings (%d serials enrolled in Intune)",
                                 len(result), len(self.enrolled_serials))
                        return result

                    def fetch_device_object_id(self, serial_number):
                        """
                        Query Graph API for a serial number's current Entra object_id.
                        Two-step: managedDevices (by serial) -> devices (by azureADDeviceId).
                        Returns object_id or None.
                        """
                        hdr = {"Authorization": f"Bearer {self.token}"}
                        select = "id,azureADDeviceId,enrolledDateTime,managementState,serialNumber"

                        url = (
                            f"{GRAPH_BETA}/deviceManagement/managedDevices"
                            f"?$filter=startsWith(serialNumber,'{serial_number}')"
                            f"&$select={select}&$top=999"
                        )
                        resp = _graph_call("get", url, headers=hdr)

                        if resp.status_code == 400:
                            url = f"{GRAPH_BETA}/deviceManagement/managedDevices?$select={select}&$top=999"
                            resp = _graph_call("get", url, headers=hdr)

                        if resp.status_code != 200:
                            log.warning("Graph API error fetching device %s: %s", serial_number, resp.status_code)
                            return None

                        devices = [
                            d for d in resp.json().get("value", [])
                            if d.get("serialNumber", "").strip().upper() == serial_number.upper()
                        ]
                        if not devices:
                            log.warning("Serial %s not found in Intune managed devices", serial_number)
                            return None

                        devices.sort(key=lambda d: d.get("enrolledDateTime", ""), reverse=True)
                        candidate = next(
                            (d for d in devices if d.get("managementState") not in ("retired", "deleted")),
                            devices[0]
                        )
                        azure_device_id = candidate.get("azureADDeviceId")
                        if not azure_device_id:
                            log.warning("Serial %s: no azureADDeviceId on Intune record", serial_number)
                            return None

                        url = f"{GRAPH_BASE}/devices?$filter=deviceId eq '{azure_device_id}'&$select=id"
                        resp = _graph_call("get", url, headers=self._headers())
                        if resp.status_code != 200:
                            log.warning("Failed to resolve Entra object for device %s: %s", azure_device_id, resp.status_code)
                            return None

                        entra_devices = resp.json().get("value", [])
                        if not entra_devices:
                            log.warning("Serial %s: azureADDeviceId %s not found in Entra", serial_number, azure_device_id)
                            return None

                        object_id = entra_devices[0]["id"]
                        log.info("Serial %s -> object_id %s (fresh from Graph API)", serial_number, object_id)
                        return object_id


                def download_intune_csv():
                    """Read intune.csv from local path (downloaded by AzureCLI step)."""
                    csv_path = os.getenv("INTUNE_CSV_PATH", "intune.csv")
                    if not os.path.exists(csv_path):
                        raise FileNotFoundError(f"intune.csv not found at {csv_path}")
                    with open(csv_path, "r") as f:
                        data = f.read()
                    log.info("Read intune.csv from %s (%d bytes)", csv_path, len(data))
                    return data


                def read_computers_csv():
                    """Read the repo's local computers.csv for device-to-hierarchy mapping."""
                    if not os.path.exists(COMPUTERS_CSV):
                        log.error("computers.csv not found at %s", COMPUTERS_CSV)
                        return []
                    with open(COMPUTERS_CSV, "r") as f:
                        reader = csv.DictReader(f)
                        devices = list(reader)
                    log.info("Loaded %d devices from %s", len(devices), COMPUTERS_CSV)
                    return devices


                def device_row_to_group_name(row):
                    """
                    Convert a computers.csv row to its Entra group name.
                    Uses usage/catalog/area/location fields -> Devices-{usage}-{catalog}-{area}-{location}
                    Drops empty trailing segments.
                    """
                    segments = []
                    for field in ["usage", "catalog", "area", "location"]:
                        val = row.get(field, "").strip().replace(" ", "")
                        if val:
                            segments.append(val)
                        else:
                            break
                    if not segments:
                        return None
                    if segments[0] not in USAGE_ROOTS:
                        return None
                    return "Devices-" + "-".join(segments)


                def build_waterfall_groups(row):
                    """
                    Build the full waterfall group hierarchy for a device, matching enrollment-intune.
                    Returns list: ["Devices-All", "Devices-{usage}", ..., "Devices-{usage}-{catalog}-{area}-{location}"]
                    """
                    usage = row.get("usage", "").strip().replace(" ", "")
                    catalog = row.get("catalog", "").strip().replace(" ", "")
                    area = row.get("area", "").strip().replace(" ", "")
                    location = row.get("location", "").strip().replace(" ", "")

                    if not usage or usage not in USAGE_ROOTS:
                        return []

                    groups = ["Devices-All", f"Devices-{usage}"]
                    if catalog:
                        groups.append(f"Devices-{usage}-{catalog}")
                    if catalog and area:
                        groups.append(f"Devices-{usage}-{catalog}-{area}")
                    if catalog and area and location:
                        groups.append(f"Devices-{usage}-{catalog}-{area}-{location}")

                    return groups


                def parse_manifest_path_to_group(manifest_path):
                    """
                    Convert a manifest file path to its Entra group name.
                    e.g. deployment/manifests/Assigned/Staff/IT.yaml -> Devices-Assigned-Staff-IT
                    Returns None if the manifest doesn't map to a device-hierarchy group.
                    """
                    path = manifest_path.replace("\\", "/")
                    if path.startswith("deployment/manifests/"):
                        path = path[len("deployment/manifests/"):]

                    if path.endswith(".yaml"):
                        path = path[:-5]
                    elif path.endswith(".yml"):
                        path = path[:-4]

                    segments = path.split("/")
                    base_name = segments[-1]

                    if segments[0] not in USAGE_ROOTS:
                        return None

                    # Faculty Instructors don't use location in manifest paths
                    # (4th segment is device hostname, not location — matches preflight logic).
                    # Map to area-level group instead.
                    if len(segments) == 4 and segments[1] == "Faculty" and segments[2] in ("Instructor", "Laptop"):
                        segments = segments[:3]

                    # Cap at 4 segments (usage/catalog/area/location) - skip device-level
                    if len(segments) > 4:
                        segments = segments[:4]

                    return "Devices-" + "-".join(segments)


                def group_name_to_filter(group_name):
                    """
                    Convert a group name to intune.csv filter criteria.
                    Devices-Assigned-Staff-IT -> {usage: Assigned, catalog: Staff, area: IT}
                    """
                    parts = group_name.split("-")
                    if len(parts) < 2 or parts[0] != "Devices":
                        return None

                    criteria = {}
                    field_map = ["usage", "catalog", "area", "location"]
                    for i, field in enumerate(field_map):
                        idx = i + 1
                        if idx < len(parts):
                            criteria[field] = parts[idx]

                    return criteria


                def is_in_service(status):
                    """True for every Snipe-IT status that means the device is deployed.

                    The status label is not just "Active": the asset register also carries
                    "Active (Legacy)", "Active (Buyouts)" and "Active (Lease End)" for
                    machines that are in daily use but bought or leased under a different
                    arrangement. Matching "Active" exactly treated all of them as retired
                    and dropped them from every desired set, which planned their removal
                    from every group they belong to -- taking their policy with them.
                    Retired/Donated/Recycled/Missing/Stolen/Damaged/Returned stay excluded.
                    """
                    return str(status or "").strip().lower().startswith("active")

                def filter_devices(devices, criteria, platform_filter):
                    """Filter devices matching all criteria and platform."""
                    matched = []
                    for dev in devices:
                        if platform_filter and dev.get("platform", "") != platform_filter:
                            continue
                        if not is_in_service(dev.get("status", "")):
                            continue
                        match = True
                        for field, value in criteria.items():
                            dev_value = dev.get(field, "").replace(" ", "")
                            if dev_value != value:
                                match = False
                                break
                        if match:
                            matched.append(dev)
                    return matched


                def validate_inventory(devices):
                    """Abort on a degraded intune.csv rather than syncing membership from it."""
                    if len(devices) < MIN_INVENTORY_ROWS:
                        raise RuntimeError(
                            f"intune.csv has only {len(devices)} rows (floor {MIN_INVENTORY_ROWS}). "
                            "Refusing to sync membership from a truncated or empty inventory."
                        )
                    missing = [c for c in REQUIRED_CSV_COLUMNS if c not in (devices[0] or {})]
                    if missing:
                        raise RuntimeError(
                            f"intune.csv is missing required column(s): {', '.join(missing)}. "
                            "Refusing to sync membership from a malformed inventory."
                        )
                    for col in ("serial", "usage"):
                        nonblank = sum(1 for d in devices if (d.get(col) or "").strip())
                        ratio = nonblank / len(devices)
                        if ratio < MIN_NONBLANK_RATIO:
                            raise RuntimeError(
                                f"intune.csv column '{col}' is blank on {(1 - ratio):.1%} of rows "
                                f"({len(devices) - nonblank}/{len(devices)}). Refusing to sync: a blank "
                                "criteria column collapses the desired set and would strip whole groups."
                            )
                    active = sum(1 for d in devices if (d.get("status") or "") == "Active")
                    if active < MIN_INVENTORY_ROWS // 2:
                        raise RuntimeError(
                            f"intune.csv has only {active} Active rows. Refusing to sync: nearly every "
                            "device reading inactive would empty the groups."
                        )
                    platform_rows = sum(1 for d in devices if d.get("platform", "") == PLATFORM_FILTER)
                    if not platform_rows:
                        raise RuntimeError(
                            f"intune.csv contains no {PLATFORM_FILTER} rows. Refusing to sync: this "
                            "would compute an empty desired set and strip every group."
                        )
                    log.info("Inventory validated: %d rows, %d %s", len(devices), platform_rows, PLATFORM_FILTER)


                def validate_platform_map(serial_to_oid):
                    """Abort if the Graph-side device map looks partial."""
                    if len(serial_to_oid) < MIN_PLATFORM_DEVICES:
                        raise RuntimeError(
                            f"Only {len(serial_to_oid)} {INTUNE_OS_FILTER} devices resolved to live Entra "
                            f"objects (floor {MIN_PLATFORM_DEVICES}). Graph looks partial; refusing to sync."
                        )
                    log.info("Graph device map validated: %d %s serial -> object_id mappings",
                             len(serial_to_oid), INTUNE_OS_FILTER)


                def run_targeted_serial_sync(graph, target_serials_raw):
                    """
                    Targeted serial sync: for each serial, look up its group from computers.csv
                    and fetch a fresh object_id from Graph API, then add to the correct group.
                    Additive only — does not remove members (full enrollment-intune handles cleanup).
                    """
                    serials = [s.strip() for s in target_serials_raw.split(",") if s.strip()]
                    if not serials:
                        log.info("No target serials provided.")
                        return 0

                    computers = read_computers_csv()
                    if not computers:
                        return 1

                    serial_lookup = {}
                    for row in computers:
                        serial_lookup[row.get("serial", "").strip().upper()] = row

                    total_added = 0
                    for serial in serials:
                        log.info("--- Processing serial: %s ---", serial)
                        row = serial_lookup.get(serial.upper())
                        if not row:
                            log.warning("  Serial %s not found in computers.csv, skipping", serial)
                            continue

                        waterfall = build_waterfall_groups(row)
                        if not waterfall:
                            log.warning("  Serial %s: could not derive group hierarchy from row %s", serial, row)
                            continue

                        object_id = graph.fetch_device_object_id(serial)
                        if not object_id:
                            log.warning("  Serial %s: could not get fresh object_id from Graph API, skipping", serial)
                            continue

                        log.info("  Waterfall groups: %s", waterfall)
                        for group_name in waterfall:
                            group_id = graph.get_or_create_group(group_name)
                            if not group_id:
                                log.error("  Could not find or create group '%s', skipping", group_name)
                                continue
                            graph.add_member(group_id, object_id)
                            log.info("  %s -> added %s to %s (%s)", serial, object_id, group_name, group_id)

                        total_added += 1

                    log.info("=== Targeted serial sync complete: %d devices processed ===", total_added)
                    return 0


                def run_targeted_manifest_sync(graph, changed_paths):
                    """
                    Targeted manifest sync: fetches fresh object_ids from Graph API using
                    computers.csv serials. Follows the enrollment-intune waterfall pattern,
                    adding each device to ALL hierarchical groups.
                    """
                    target_groups = {}
                    for path in changed_paths:
                        group_name = parse_manifest_path_to_group(path)
                        if group_name and group_name not in target_groups:
                            criteria = group_name_to_filter(group_name)
                            if criteria:
                                target_groups[group_name] = criteria
                                log.info("  %s -> %s (filter: %s)", path, group_name, criteria)
                        elif not group_name:
                            log.info("  %s -> skipped (non-hierarchy manifest)", path)

                    if not target_groups:
                        log.info("No device-hierarchy groups affected.")
                        return 0

                    computers = read_computers_csv()
                    if not computers:
                        return 1

                    # Collect all unique devices affected by changed manifests
                    seen_serials = set()
                    affected_devices = []
                    for group_name, criteria in sorted(target_groups.items()):
                        log.info("--- Finding devices for group: %s ---", group_name)
                        for dev in computers:
                            if dev.get("platform", "") != PLATFORM_FILTER:
                                continue
                            if not is_in_service(dev.get("status", "")):
                                continue
                            serial = dev.get("serial", "").strip().upper()
                            if serial in seen_serials:
                                continue
                            match = True
                            for field, value in criteria.items():
                                dev_value = dev.get(field, "").replace(" ", "")
                                if dev_value != value:
                                    match = False
                                    break
                            if match:
                                seen_serials.add(serial)
                                affected_devices.append(dev)

                    log.info("Found %d unique devices affected by changed manifests", len(affected_devices))

                    # Process each device: fetch fresh object_id, add to full waterfall
                    total_added = 0
                    for dev in affected_devices:
                        serial = dev.get("serial", "").strip()
                        if not serial:
                            continue

                        waterfall = build_waterfall_groups(dev)
                        if not waterfall:
                            log.warning("  Serial %s: could not derive group hierarchy, skipping", serial)
                            continue

                        object_id = graph.fetch_device_object_id(serial)
                        if not object_id:
                            log.warning("  Serial %s: no object_id from Graph, skipping", serial)
                            continue

                        log.info("  Serial %s: waterfall groups: %s", serial, waterfall)
                        for group_name in waterfall:
                            group_id = graph.get_or_create_group(group_name)
                            if not group_id:
                                log.error("  Could not find or create group '%s', skipping", group_name)
                                continue
                            graph.add_member(group_id, object_id)
                            log.info("  %s -> added %s to %s", serial, object_id, group_name)

                        total_added += 1

                    log.info("=== Targeted manifest sync complete: %d devices processed ===", total_added)
                    return 0


                def run_normal_sync(graph, changed_paths_raw):
                    """Normal sync mode: intune.csv from blob, diff-based membership."""
                    import glob

                    if changed_paths_raw == "__ALL__":
                        log.info("Force full run - processing ALL manifests")
                        changed_paths = glob.glob("deployment/manifests/**/*.yaml", recursive=True)
                        changed_paths.extend(glob.glob("deployment/manifests/**/*.yml", recursive=True))
                        log.info("Found %d total manifest files", len(changed_paths))
                    else:
                        changed_paths = [p.strip() for p in changed_paths_raw.split(";") if p.strip()]
                        log.info("Changed manifest paths (%d): %s", len(changed_paths), changed_paths)

                    target_groups = {}
                    for path in changed_paths:
                        group_name = parse_manifest_path_to_group(path)
                        if group_name and group_name not in target_groups:
                            criteria = group_name_to_filter(group_name)
                            if criteria:
                                target_groups[group_name] = criteria
                                log.info("  %s -> %s (filter: %s)", path, group_name, criteria)
                            else:
                                log.info("  %s -> %s (no valid filter, skipping)", path, group_name)
                        elif not group_name:
                            log.info("  %s -> skipped (non-hierarchy manifest)", path)

                    if not target_groups:
                        log.info("No device-hierarchy groups affected by manifest changes.")
                        return 0

                    csv_data = download_intune_csv()
                    reader = csv.DictReader(io.StringIO(csv_data))
                    devices = list(reader)
                    log.info("Loaded %d devices from intune.csv", len(devices))
                    validate_inventory(devices)

                    # Build a fresh serial -> object_id map from Graph (never use stale CSV object_ids).
                    # This is 2 bulk API calls regardless of device count.
                    serial_to_oid = graph.build_serial_to_object_id_map(platform_filter=INTUNE_OS_FILTER)
                    validate_platform_map(serial_to_oid)
                    all_known_oids = set(serial_to_oid.values())

                    # Plan every group before touching anything. A group whose inputs do not check out
                    # aborts the whole run, so we never leave the estate half-converged: either the full
                    # plan is trustworthy and gets applied, or nothing is written at all.
                    plan = []
                    total_own = 0
                    guarded_own = 0       # own memberships in groups the whole-run guard still watches
                    guarded_remove = 0    # removals in those same (non-exempt) groups
                    for group_name, criteria in sorted(target_groups.items()):
                        log.info("--- Processing group: %s ---", group_name)

                        matched = filter_devices(devices, criteria, PLATFORM_FILTER)
                        matched_serials = {
                            d.get("serial", "").strip().upper()
                            for d in matched
                            if d.get("serial", "").strip()
                        }
                        desired_ids = set()
                        for d in matched:
                            serial = d.get("serial", "").strip().upper()
                            oid = serial_to_oid.get(serial)
                            if oid:
                                desired_ids.add(oid)
                            else:
                                log.warning("  Serial %s: no live Entra object found, skipping", serial)
                        log.info("  Matched %d %s devices for criteria %s",
                                 len(matched), PLATFORM_FILTER, criteria)

                        group_id = graph.find_group(group_name)
                        if group_id:
                            current_ids = graph.get_group_members(group_id)
                        else:
                            group_id = graph.create_group(group_name)
                            if not group_id:
                                # The sibling pipeline may have created it moments ago; a create losing
                                # that race is benign, so re-resolve before treating this as fatal.
                                group_id = graph.find_group(group_name)
                            if not group_id:
                                raise RuntimeError(
                                    f"Could not find or create group '{group_name}'. Aborting before any "
                                    "writes rather than syncing a partial set of groups."
                                )
                            # Freshly-created group: skip the /members read to
                            # avoid racing Graph directory replication.
                            current_ids = set()

                        # Every ENROLLED matched device must resolve to a live Entra object. If a
                        # device Intune has a record for has no Entra object, the join failed and the
                        # device would look absent from the desired set and be removed -- pulling its
                        # profiles. Abort in that case.
                        #
                        # Devices in inventory that Intune has never seen are excluded: they are simply
                        # not enrolled, cannot be group members, and are a permanent feature of the
                        # estate. Counting them made this check fire constantly on healthy data (79.7%
                        # on the real tenant) while telling us nothing about Graph health.
                        enrolled = getattr(graph, "enrolled_serials", None)
                        expected_serials = matched_serials & enrolled if enrolled else matched_serials
                        expected_count = len(expected_serials)
                        if expected_count:
                            resolution_ratio = len(desired_ids) / expected_count
                            if resolution_ratio < MIN_GROUP_RESOLUTION_RATIO:
                                raise RuntimeError(
                                    f"{group_name}: only {resolution_ratio:.1%} of enrolled matched devices "
                                    f"({len(desired_ids)}/{expected_count}) resolved to live Entra objects. "
                                    "Graph resolution is incomplete; refusing to sync any group this run."
                                )

                        to_add = desired_ids - current_ids
                        to_remove = current_ids - desired_ids
                        # Only ever touch our own platform. Devices-Shared and Devices-Assigned are mixed
                        # Windows/Mac groups; the other platform's pipeline owns its members.
                        to_remove = to_remove & all_known_oids

                        # Never empty a group we own members in, and never take out most of one.
                        # Both are the signature of degraded inventory rather than a real change --
                        # UNLESS this removal is intended: the blunt global override, a standing
                        # high-churn/staging group, or a per-run scoped override naming this group.
                        own_current = current_ids & all_known_oids
                        group_exempt = (ALLOW_LARGE_SHRINK
                                        or group_name in HIGH_CHURN_GROUPS
                                        or group_name in ALLOW_SHRINK_GROUPS)
                        if (own_current and to_remove and not group_exempt
                                and len(to_remove) > MAX_SMALL_REMOVAL):
                            shrink = len(to_remove) / len(own_current)
                            if shrink > MAX_GROUP_SHRINK:
                                raise RuntimeError(
                                    f"{group_name}: would remove {len(to_remove)} of {len(own_current)} "
                                    f"{PLATFORM_FILTER} members ({shrink:.0%}). Refusing this run. Re-run "
                                    "naming this group in allowShrinkGroups (or ALLOW_LARGE_SHRINK) if "
                                    "this bulk change is intended."
                                )
                        total_own += len(own_current)
                        # Only NON-exempt groups feed the systemic whole-run guard, so an intended bulk
                        # change in one group can't blind the guard to a collapse everywhere else.
                        if not group_exempt:
                            guarded_own += len(own_current)
                            guarded_remove += len(to_remove)

                        plan.append((group_name, group_id, to_add, to_remove, len(desired_ids)))
                        log.info("  %s: planned +%d added, -%d removed, %d desired total",
                                 group_name, len(to_add), len(to_remove), len(desired_ids))

                    planned_add = sum(len(p[2]) for p in plan)
                    planned_remove = sum(len(p[3]) for p in plan)
                    # Systemic check. One group emptying is churn; a large share of the estate
                    # leaving at once is a collapsed desired set -- a blank column, a renamed
                    # header, a failed upstream join -- and must never be executed automatically.
                    if guarded_own and not ALLOW_LARGE_SHRINK:
                        total_shrink = guarded_remove / guarded_own
                        if total_shrink > MAX_TOTAL_SHRINK:
                            raise RuntimeError(
                                f"run would remove {guarded_remove} of {guarded_own} guarded "
                                f"{PLATFORM_FILTER} memberships ({total_shrink:.0%}) across the estate "
                                "(high-churn and allowShrinkGroups excluded). That is a collapsed desired "
                                "set, not real churn; refusing to sync. Re-run with ALLOW_LARGE_SHRINK=true "
                                "if this bulk change is intended."
                            )
                    log.info("=== Plan validated: %d groups, +%d to add, -%d to remove.%s ===",
                             len(plan), planned_add, planned_remove,
                             " WHAT-IF: writing nothing." if WHATIF else " Applying.")

                    # PLAN step of a large change: show the plan, write nothing, exit clean.
                    if WHATIF:
                        for group_name, group_id, to_add, to_remove, desired_total in plan:
                            if to_add or to_remove:
                                log.info("  [what-if] %s: +%d / -%d (desired %d)",
                                         group_name, len(to_add), len(to_remove), desired_total)
                        log.info("=== WHAT-IF complete: no membership changes written. "
                                 "Re-run without whatIf to apply. ===")
                        return 0

                    total_added = 0
                    total_removed = 0
                    for group_name, group_id, to_add, to_remove, desired_total in plan:
                        for oid in to_add:
                            graph.add_member(group_id, oid)
                        for oid in to_remove:
                            graph.remove_member(group_id, oid)
                        total_added += len(to_add)
                        total_removed += len(to_remove)
                        log.info("  %s: +%d added, -%d removed, %d desired total",
                                 group_name, len(to_add), len(to_remove), desired_total)

                    log.info("=== Group sync complete: %d groups processed, +%d added, -%d removed ===",
                             len(plan), total_added, total_removed)
                    return 0


                ALLOW_LARGE_SHRINK = os.getenv("ALLOW_LARGE_SHRINK", "").lower() in ("1", "true", "yes")

                # Standing exemption for groups whose churn is EXPECTED -- staging / holding groups
                # that devices flow through as they are (re)provisioned or retired. Their per-group
                # shrink is normal, not a degraded-inventory signature, so the per-group guard is
                # relaxed for them and their removals don't count toward the systemic whole-run guard.
                # This is what lets the scheduled reconcile run unattended through lease-end batches.
                HIGH_CHURN_GROUPS = {
                    "Devices-Shared-Provisioning",
                    "Devices-Shared-Provisioning-Unallocated",
                }
                # Per-run SCOPED override: names listed in ALLOW_SHRINK_GROUPS bypass the per-group
                # shrink guard for THIS run only -- without disabling it for the rest of the estate the
                # way the blunt ALLOW_LARGE_SHRINK does. So you override exactly the group you intend to
                # change, and an unexpected shrink anywhere else still aborts the run. Set via the
                # allowShrinkGroups pipeline parameter.
                ALLOW_SHRINK_GROUPS = {
                    g.strip() for g in os.getenv("ALLOW_SHRINK_GROUPS", "").split(",") if g.strip()
                }
                # What-if / plan-only: compute and log the full plan, write nothing. The PLAN step of a
                # large change -- review the log, confirm the removals are intended, then re-run for
                # real. Set via the whatIf pipeline parameter.
                WHATIF = os.getenv("WHATIF", "").lower() in ("1", "true", "yes")


                def _assignment_hierarchy_group_names():
                    """Every Entra group an Assigned/** or Shared/** manifest can be a target
                    for, derived exactly as the assignment stage derives it (root in
                    USAGE_ROOTS, Faculty Instructor/Laptop maps to its area, capped at 4
                    segments). Deliberately applies NO skip filter, so this set is a superset
                    of what the assignment stage resolves -- the placeholder pass must cover
                    every group assignment can look up, or assignment still aborts."""
                    import glob
                    names = set()
                    files = glob.glob("deployment/manifests/**/*.yaml", recursive=True)
                    files += glob.glob("deployment/manifests/**/*.yml", recursive=True)
                    for path in files:
                        p = path.replace("\\", "/")
                        if p.startswith("deployment/manifests/"):
                            p = p[len("deployment/manifests/"):]
                        for ext in (".yaml", ".yml"):
                            if p.endswith(ext):
                                p = p[:-len(ext)]
                                break
                        segments = p.split("/")
                        if not segments or segments[0] not in USAGE_ROOTS:
                            continue
                        if len(segments) == 4 and segments[1] == "Faculty" and segments[2] in ("Instructor", "Laptop"):
                            segments = segments[:3]
                        if len(segments) > 4:
                            segments = segments[:4]
                        names.add("Devices-" + "-".join(segments))
                    return names


                def ensure_manifest_groups_exist(graph):
                    """Pre-create an EMPTY Entra group for every manifest-declared room, so the
                    assignment stage can always resolve its target group -- including rooms
                    whose devices have not migrated to Intune yet (no members -> membership sync
                    never creates the group -> assignment aborts the whole run rather than
                    unassign live policy). Additive only: never edits or removes a group and
                    never touches membership. Best-effort -- a failure here must not abort the
                    sync; the assignment guard stays the backstop."""
                    try:
                        desired = _assignment_hierarchy_group_names()
                        if not desired:
                            log.info("Placeholder pass: no Assigned/Shared manifest groups derived; skipping.")
                            return
                        existing = graph.list_managed_group_names()
                        missing = sorted(n for n in desired if n not in existing)
                        log.info("Placeholder pass: %d manifest groups, %d present, %d missing.",
                                 len(desired), len(desired) - len(missing), len(missing))
                        if not missing:
                            return
                        if WHATIF:
                            for n in missing:
                                log.info("  [what-if] would create empty placeholder group %s", n)
                            return
                        created = 0
                        for n in missing:
                            if graph.get_or_create_group(n):
                                created += 1
                            else:
                                log.warning("  placeholder: could not create group %s", n)
                        log.info("Placeholder pass: created %d empty placeholder group(s).", created)
                    except Exception as ex:
                        log.warning("Placeholder pass skipped (non-fatal): %s", ex)


                def main():
                    token = os.getenv("GRAPH_TOKEN")
                    changed_paths_raw = os.getenv("CHANGED_MANIFEST_PATHS", "")
                    targeted_mode = os.getenv("TARGETED_MODE", "false").lower() == "true"
                    target_serials = os.getenv("TARGET_SERIALS", "").strip()

                    if not token:
                        log.error("Missing GRAPH_TOKEN env var.")
                        return 1

                    graph = GraphClient(token)

                    # Ensure every manifest-declared room group exists (empty is fine) before the
                    # membership diff or the downstream assignment stage runs, so a not-yet-migrated
                    # room never makes assignment abort the whole run. Additive and best-effort.
                    # Opt-in via env (like WHATIF / ALLOW_LARGE_SHRINK) so the hermetic sync tests
                    # that drive main() directly are unaffected; the pipeline sets it true.
                    if os.getenv("ENSURE_PLACEHOLDER_GROUPS", "").lower() in ("1", "true", "yes"):
                        ensure_manifest_groups_exist(graph)

                    # --- Targeted mode: fresh Graph API lookups ---
                    if targeted_mode and target_serials:
                        log.info("=== TARGETED SERIAL MODE: %s ===", target_serials)
                        return run_targeted_serial_sync(graph, target_serials)

                    if targeted_mode and changed_paths_raw:
                        log.info("=== TARGETED MANIFEST MODE ===")
                        changed_paths = [p.strip() for p in changed_paths_raw.split(";") if p.strip()]
                        return run_targeted_manifest_sync(graph, changed_paths)

                    # --- Normal mode: intune.csv downloaded by the AzureCLI step ---
                    if not changed_paths_raw:
                        log.info("No changed manifest paths provided. Nothing to do.")
                        return 0

                    try:
                        return run_normal_sync(graph, changed_paths_raw)
                    except Exception as ex:
                        # Validation failed, or Graph stayed unavailable through every retry. Nothing
                        # was written: the plan is built in full before any group is touched, so an
                        # error raised while planning cannot leave a half-converged estate. Fail the
                        # run so this is visible rather than leaving membership silently stale.
                        log.error("ABORTED before any membership change: %s", ex)
                        return 1

                if __name__ == "__main__":
                    raise SystemExit(main())
          - task: PythonScript@0
            displayName: "Force Sync Affected Devices"
            condition: succeeded()
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              TARGET_SERIALS: $(targetSerials)
              CHANGED_MANIFEST_PATHS: $(changedManifestPaths)
              RECONCILE_ONLY: $(reconcileOnly)
            inputs:
              scriptSource: 'inline'
              script: |
                import os, csv, logging, time, requests

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _n in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_n).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH_BETA = "https://graph.microsoft.com/beta"
                COMPUTERS_CSV = "deployment/enroll/computers.csv"
                MAX_SYNC = 200
                USAGE_ROOTS = {"Assigned", "Shared"}

                def fetch_managed_device_ids(token, serials_set):
                    headers = {"Authorization": f"Bearer {token}"}
                    serial_to_rec = {}
                    url = (f"{GRAPH_BETA}/deviceManagement/managedDevices"
                           f"?$select=id,serialNumber,managementState,enrolledDateTime"
                           f"&$filter=operatingSystem+eq+'macOS'&$top=999")
                    while url:
                        r = requests.get(url, headers=headers)
                        if r.status_code != 200:
                            log.error("Managed devices fetch failed: %s", r.status_code)
                            break
                        data = r.json()
                        for d in data.get("value", []):
                            s = d.get("serialNumber", "").strip().upper()
                            if s not in serials_set:
                                continue
                            ex = serial_to_rec.get(s)
                            retired = {"retired", "deleted"}
                            if ex is None or (
                                ex.get("managementState") in retired
                                and d.get("managementState") not in retired
                            ) or (
                                d.get("enrolledDateTime", "") > ex.get("enrolledDateTime", "")
                                and d.get("managementState") not in retired
                            ):
                                serial_to_rec[s] = d
                        url = data.get("@odata.nextLink")
                    return {s: d["id"] for s, d in serial_to_rec.items()}

                def sync_devices(token, dev_id_map):
                    headers = {"Authorization": f"Bearer {token}", "Content-Length": "0"}
                    ok = err = 0
                    for serial, dev_id in dev_id_map.items():
                        r = requests.post(
                            f"{GRAPH_BETA}/deviceManagement/managedDevices/{dev_id}/syncDevice",
                            headers=headers)
                        if r.status_code == 204:
                            log.info("Synced %s (%s)", serial, dev_id)
                            ok += 1
                        else:
                            log.warning("Sync failed for %s: HTTP %s", serial, r.status_code)
                            err += 1
                        if (ok + err) % 20 == 0:
                            time.sleep(1)
                    log.info("Device sync complete: %d OK, %d failed", ok, err)

                def resolve_serials():
                    target_serials = os.getenv("TARGET_SERIALS", "").strip()
                    if target_serials:
                        return [s.strip().upper() for s in target_serials.split(",") if s.strip()]
                    changed = os.getenv("CHANGED_MANIFEST_PATHS", "").strip()
                    if not changed:
                        return []
                    with open(COMPUTERS_CSV) as f:
                        devices = list(csv.DictReader(f))
                    if changed == "__ALL__":
                        serials = [d["serial"].strip().upper() for d in devices
                                   if d.get("platform") == "Macintosh"
                                   and d.get("status") == "Active"
                                   and d.get("usage") in USAGE_ROOTS]
                        log.info("Full run: %d candidate devices (capping at %d)", len(serials), MAX_SYNC)
                        return serials[:MAX_SYNC]
                    criteria = []
                    for p in changed.split(";"):
                        p = p.strip().replace("deployment/manifests/", "")
                        p = p.replace(".yaml", "").replace(".yml", "")
                        parts = p.split("/")
                        if parts and parts[0] in USAGE_ROOTS:
                            criteria.append(parts)
                    serials = set()
                    for dev in devices:
                        if dev.get("platform") != "Macintosh" or dev.get("status") != "Active":
                            continue
                        usage = dev.get("usage", "").strip()
                        catalog = dev.get("catalog", "").strip()
                        area = dev.get("area", "").strip()
                        for parts in criteria:
                            if len(parts) >= 1 and usage != parts[0]: continue
                            if len(parts) >= 2 and catalog != parts[1]: continue
                            if len(parts) >= 3 and area != parts[2]: continue
                            serials.add(dev.get("serial", "").strip().upper())
                            break
                    return list(serials)

                PROFILES_YAML = "provisioning/profiles.yaml"

                def load_critical_profiles_by_section():
                    """Parse provisioning/profiles.yaml -> {'All':set,'Assigned':set,'Shared':set}
                    of Intune display names (last dot-component of each PayloadIdentifier).
                    Hand-parsed to avoid a PyYAML dependency in this step."""
                    sections = {"All": set(), "Assigned": set(), "Shared": set()}
                    cur = None
                    if not os.path.exists(PROFILES_YAML):
                        log.warning("profiles.yaml not found at %s; drift sweep disabled.", PROFILES_YAML)
                        return sections
                    with open(PROFILES_YAML) as f:
                        for raw in f:
                            stripped = raw.strip()
                            if not stripped or stripped.startswith("#"):
                                continue
                            if not raw[:1].isspace() and stripped.endswith(":"):
                                key = stripped[:-1]
                                cur = key if key in sections else None
                                continue
                            if cur and stripped.startswith("- "):
                                ident = stripped[2:].split("#", 1)[0].strip()
                                if ident:
                                    sections[cur].add(ident.rsplit(".", 1)[-1])
                    return sections

                def find_drift_device_ids(token):
                    """Return {label: managedDeviceId} for macOS devices that likely have
                    group-assigned profiles stuck at notApplicable until a check-in:
                      (a) recently enrolled/wiped (enrolledDateTime within RECENT_ENROLL_DAYS)
                          -- swept wholesale, since a fresh device sits at notApplicable across
                          MANY profiles, not just profiles.yaml ones (e.g. XCredsPrefs); and
                      (b) any older device where an expected profiles.yaml profile (All always;
                          Assigned/Shared by computers.csv usage) is notApplicable -- catches a
                          new critical assignment landing on the existing fleet.
                    Bounded by MAX_SYNC."""
                    from datetime import datetime, timedelta, timezone
                    RECENT_ENROLL_DAYS = 14
                    cutoff = (datetime.now(timezone.utc) - timedelta(days=RECENT_ENROLL_DAYS)).strftime("%Y-%m-%dT%H:%M:%SZ")
                    crit = load_critical_profiles_by_section()
                    usage_by_serial = {}
                    try:
                        with open(COMPUTERS_CSV) as f:
                            for d in csv.DictReader(f):
                                if d.get("platform") == "Macintosh" and d.get("status") == "Active":
                                    usage_by_serial[d.get("serial", "").strip().upper()] = d.get("usage", "").strip()
                    except FileNotFoundError:
                        log.warning("computers.csv missing; drift uses All-section profiles only.")
                    headers = {"Authorization": f"Bearer {token}"}
                    macs = []
                    url = (f"{GRAPH_BETA}/deviceManagement/managedDevices"
                           f"?$select=id,deviceName,serialNumber,enrolledDateTime&$filter=operatingSystem+eq+'macOS'&$top=999")
                    while url:
                        r = requests.get(url, headers=headers)
                        if r.status_code != 200:
                            log.error("Drift: managedDevices fetch failed: %s", r.status_code)
                            return {}
                        data = r.json()
                        macs.extend(data.get("value", []))
                        url = data.get("@odata.nextLink")
                    drifted = {}
                    for d in macs:
                        did = d.get("id")
                        serial = d.get("serialNumber", "").strip().upper()
                        label = d.get("deviceName") or serial or did
                        # (a) recently enrolled/wiped: sweep wholesale (catches any stuck
                        # profile, including non-profiles.yaml ones like XCredsPrefs).
                        if d.get("enrolledDateTime", "") >= cutoff:
                            drifted[label] = did
                            if len(drifted) >= MAX_SYNC:
                                log.warning("Drift: hit MAX_SYNC cap (%d).", MAX_SYNC)
                                break
                            continue
                        # (b) older device: only sweep if an expected critical profile is stuck.
                        usage = usage_by_serial.get(serial, "")
                        expected = set(crit["All"])
                        if usage == "Assigned":
                            expected |= crit["Assigned"]
                        elif usage == "Shared":
                            expected |= crit["Shared"]
                        if not expected:
                            continue
                        r = requests.get(
                            f"{GRAPH_BETA}/deviceManagement/managedDevices/{did}/deviceConfigurationStates",
                            headers=headers)
                        if r.status_code != 200:
                            continue
                        states = {s.get("displayName"): s.get("state") for s in r.json().get("value", [])}
                        if any(states.get(name) == "notApplicable" for name in expected):
                            drifted[label] = did
                        if len(drifted) >= MAX_SYNC:
                            log.warning("Drift: hit MAX_SYNC cap (%d).", MAX_SYNC)
                            break
                    log.info("Drift sweep: %d macOS device(s) need a sync.", len(drifted))
                    return drifted

                token = os.getenv("GRAPH_TOKEN")
                if not token:
                    log.error("Missing GRAPH_TOKEN, skipping sync.")
                    raise SystemExit(0)

                # Scheduled reconcile: sync ONLY devices whose expected profiles are stuck
                # notApplicable (surgical self-heal) -- never a blanket fleet sync.
                if os.getenv("RECONCILE_ONLY", "").strip().lower() == "true":
                    drift = find_drift_device_ids(token)
                    if drift:
                        log.info("Reconcile: syncing %d drifted device(s).", len(drift))
                        sync_devices(token, drift)
                    else:
                        log.info("Reconcile: no drifted devices; nothing to sync.")
                    raise SystemExit(0)

                serials = resolve_serials()
                if not serials:
                    log.info("No devices to sync.")
                    raise SystemExit(0)
                if len(serials) > MAX_SYNC:
                    log.warning("Capping to %d of %d devices.", MAX_SYNC, len(serials))
                    serials = serials[:MAX_SYNC]
                log.info("Syncing %d device(s): %s%s", len(serials),
                         ", ".join(serials[:5]), "..." if len(serials) > 5 else "")
                dev_ids = fetch_managed_device_ids(token, set(serials))
                missing = set(serials) - set(dev_ids)
                if missing:
                    log.warning("No Intune record for: %s", ", ".join(sorted(missing)))
                if dev_ids:
                    sync_devices(token, dev_ids)

#------------------------------------------------------------------------------ 
# STAGE 3: Assign .mobileconfig Profiles to Groups from Munki XML manifests
#------------------------------------------------------------------------------
  - stage: manageProfileAssignments
    displayName: "Assign to Group(s)"
    dependsOn:
      - detectChanges
      - pushMobileConfigs
      - syncGroupMembership
    condition: |
      and(
        not(failed('pushMobileConfigs')),
        not(failed('syncGroupMembership')),
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ReconcileOnly'], 'true'),
        or(
          eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ProfilesChanged'], 'true'),
          eq(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ManifestsChanged'], 'true')
        )
      )
    variables:
      changedManifestPaths: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ChangedManifestPaths'] ]
      targetedMode: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.TargetedMode'] ]
    jobs:
      - job: manageMacProfiles
        displayName: "Assign macOS Profiles from manifests"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests pyyaml
            displayName: "Install Python Dependencies"
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: PythonScript@0
            displayName: "Assign macOS Custom Config Profiles"
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              TARGETED_MODE: $(targetedMode)
              CHANGED_MANIFEST_PATHS: $(changedManifestPaths)
              APPLY_MANAGED_EXCLUSIONS: ${{ parameters.applyManagedExclusions }}
            inputs:
              scriptSource: 'inline'
              script: |
                import os
                import re
                import glob
                import hashlib
                import plistlib
                import logging
                import requests
                import yaml

                logging.basicConfig(level=logging.INFO)
                for _noisy in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_noisy).setLevel(logging.WARNING)

                MANIFESTS_ROOT = "deployment/manifests"  # Adjust if needed
                GRAPH_BASE = "https://graph.microsoft.com/v1.0"
                GRAPH_BETA = "https://graph.microsoft.com/beta"  # assignmentFilters is beta-only

                # Munki conditional_items[*].managed_profiles entries are translated
                # to Intune Assignment Filters by this pipeline. Filters are created
                # on demand, named "Munki: <condition>", and reused across runs.
                # Conditions that can't be translated (e.g. arch, serial_number,
                # enrolled_area/room, catalogs) are logged + the profile assignment
                # for that block is skipped. The non-profile managed_installs /
                # managed_uninstalls in those conditionals remain authoritative for
                # Munki/MicroMDM-managed devices.
                #
                # Supported predicates:
                #   hostname == / != / CONTAINS / BEGINSWITH / ENDSWITH "string"
                #   machine_type == / != "laptop" / "desktop"
                #   os_vers_major == / != N
                #   AND, OR, NOT, parentheses
                #
                # macOS Intune Filter properties are limited to deviceName,
                # manufacturer, model, osVersion, deviceCategory,
                # enrollmentProfileName. The "model" value is the marketing name
                # (e.g. "MacBook Pro"); machine_model conditions referencing the
                # hardware identifier (e.g. "MacBookPro16,1") are not supported.

                class CondParseError(Exception):
                    pass

                class UnsupportedCondition(Exception):
                    pass

                _COND_TOKEN_RE = re.compile(
                    r'"(?:[^"\\]|\\.)*"'
                    r"|'(?:[^'\\]|\\.)*'"
                    r"|\d+"
                    r"|==|!=|>=|<=|>|<"
                    r"|\(|\)"
                    r"|[A-Za-z_][A-Za-z_0-9]*"
                )

                def _tokenize_cond(text):
                    return _COND_TOKEN_RE.findall(text)

                class _CondParser:
                    def __init__(self, tokens):
                        self.tokens = tokens
                        self.pos = 0
                    def _peek(self):
                        return self.tokens[self.pos] if self.pos < len(self.tokens) else None
                    def _take(self):
                        t = self._peek()
                        if t is None:
                            raise CondParseError("unexpected end of expression")
                        self.pos += 1
                        return t
                    def parse(self):
                        node = self._parse_or()
                        if self.pos < len(self.tokens):
                            raise CondParseError(f"trailing tokens: {self.tokens[self.pos:]}")
                        return node
                    def _parse_or(self):
                        n = self._parse_and()
                        while self._peek() == "OR":
                            self._take()
                            n = ("or", n, self._parse_and())
                        return n
                    def _parse_and(self):
                        n = self._parse_not()
                        while self._peek() == "AND":
                            self._take()
                            n = ("and", n, self._parse_not())
                        return n
                    def _parse_not(self):
                        if self._peek() == "NOT":
                            self._take()
                            return ("not", self._parse_unary())
                        return self._parse_unary()
                    def _parse_unary(self):
                        if self._peek() == "(":
                            self._take()
                            n = self._parse_or()
                            if self._peek() != ")":
                                raise CondParseError("missing ')'")
                            self._take()
                            return n
                        return self._parse_pred()
                    def _parse_pred(self):
                        ident = self._take()
                        if ident in ("ANY", "ALL", "SOME", "NONE"):
                            ident = f"{ident} {self._take()}"
                        op = self._take()
                        val = self._take()
                        if val and val[0] in ('"', "'"):
                            return ("pred", ident, op, val[1:-1], "string")
                        return ("pred", ident, op, val, "number")

                # machine_type form-factor classification.
                #
                # Intune reports device.model as a marketing name ("MacBook Pro",
                # "iMac") when Microsoft's lookup tables know the hardware, and as
                # a bare identifier ("Mac16,3") when they don't. Laptops are matched
                # by the stable "MacBook" prefix; desktop is the exact complement,
                # so every device matches exactly one branch -- no "matches nothing"
                # gap, and new desktop models need zero maintenance. A bare
                # identifier carries no form-factor signal, so the only case the
                # prefix misses is a laptop currently reporting one; those are
                # listed (form_factor: laptop) in provisioning/models.yaml, which
                # the maintainModelRegistry stage keeps current from Intune. That
                # override file is the only thing read here.
                def _is_model_identifier(m):
                    if not m.startswith("Mac"):
                        return False
                    a, sep, b = m[3:].partition(",")
                    return bool(sep) and a.isdigit() and b.isdigit()

                def _laptop_model_ids():
                    path = "provisioning/models.yaml"
                    ids = set()
                    if not os.path.exists(path):
                        return ids
                    try:
                        data = yaml.safe_load(open(path)) or {}
                    except Exception as e:
                        logging.warning(f"models.yaml unreadable ({e}); using MacBook prefix only.")
                        return ids
                    for entry in data.get("models") or []:
                        m = (entry.get("model") or "").strip()
                        if entry.get("form_factor") == "laptop" and _is_model_identifier(m):
                            ids.add(m)
                    return ids

                _LAPTOP_MODEL_IDS = _laptop_model_ids()
                _STR_OP_TO_INTUNE = {
                    "==": "-eq",
                    "!=": "-ne",
                    "CONTAINS": "-contains",
                    "BEGINSWITH": "-startsWith",
                    "ENDSWITH": "-endsWith",
                }

                def _translate_node(node):
                    if node[0] == "and":
                        return f"({_translate_node(node[1])} and {_translate_node(node[2])})"
                    if node[0] == "or":
                        return f"({_translate_node(node[1])} or {_translate_node(node[2])})"
                    if node[0] == "not":
                        return f"(not {_translate_node(node[1])})"
                    if node[0] == "pred":
                        return _translate_pred(*node[1:])
                    raise UnsupportedCondition(f"unknown AST node: {node[0]}")

                def _translate_pred(field, op, value, kind):
                    if field == "hostname":
                        if op in _STR_OP_TO_INTUNE:
                            return f'(device.deviceName {_STR_OP_TO_INTUNE[op]} "{value}")'
                        raise UnsupportedCondition(f"hostname {op}")
                    if field == "machine_type":
                        # desktop is the exact complement of laptop, so a device
                        # reporting an unknown/identifier model classifies as
                        # desktop rather than matching neither branch.
                        # NB: Intune rejects -notStartsWith and unary -not on
                        # device.model in assignment filters (verified against the
                        # Graph validator), so desktop uses -notContains "MacBook"
                        # -- equivalent here since every marketing MacBook string
                        # contains "MacBook" and identifier-laptops are excluded by
                        # -ne below.
                        laptop_rule = "(" + " or ".join(
                            ['(device.model -startsWith "MacBook")']
                            + [f'(device.model -eq "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        desktop_rule = "(" + " and ".join(
                            ['(device.model -notContains "MacBook")']
                            + [f'(device.model -ne "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        if value == "laptop":
                            return laptop_rule if op == "==" else desktop_rule
                        if value == "desktop":
                            return desktop_rule if op == "==" else laptop_rule
                        raise UnsupportedCondition(f'machine_type {op} "{value}"')
                    if field == "os_vers_major":
                        if kind == "number" and op == "==":
                            return f'(device.osVersion -startsWith "{value}.")'
                        if kind == "number" and op == "!=":
                            return f'(device.osVersion -notStartsWith "{value}.")'
                        raise UnsupportedCondition(f"os_vers_major {op}")
                    raise UnsupportedCondition(f"{field} {op}")

                def translate_condition(text):
                    """Translate a Munki condition string to (display_name, intune_rule).
                    Raises CondParseError or UnsupportedCondition on failure."""
                    normalized = " ".join(text.split())
                    rule = _translate_node(_CondParser(_tokenize_cond(normalized)).parse())
                    display = f"Munki: {normalized}"
                    if len(display) > 250:
                        h = hashlib.sha1(normalized.encode()).hexdigest()[:8]
                        display = display[:240] + f"... [{h}]"
                    return display, rule

                class GraphAPIClient:
                    def __init__(self, token):
                        self.token = token
                        self.group_cache = {}
                        logging.info("Graph API token provided.")

                    def _headers(self):
                        return {
                            "Authorization": f"Bearer {self.token}",
                            "Content-Type": "application/json"
                        }

                    def list_mac_custom_configs(self):
                        all_items = []
                        url = f"{GRAPH_BASE}/deviceManagement/deviceConfigurations?$top=999"
                        while url:
                            resp = requests.get(url, headers=self._headers())
                            resp.raise_for_status()
                            data = resp.json()
                            all_items.extend(data.get("value", []))
                            url = data.get("@odata.nextLink")
                        macos_configs = {}
                        for cfg in all_items:
                            odata = cfg.get("@odata.type", "")
                            if odata == "#microsoft.graph.macOSCustomConfiguration":
                                disp = cfg.get("displayName")
                                if disp:
                                    macos_configs[disp] = cfg
                        return macos_configs

                    def get_group_id(self, group_name):
                        if group_name in self.group_cache:
                            return self.group_cache[group_name]
                        safe_name = group_name.replace("'", "''")
                        url = f"{GRAPH_BASE}/groups?$filter=displayName eq '{safe_name}'"
                        r = requests.get(url, headers=self._headers())
                        r.raise_for_status()
                        data = r.json().get("value", [])
                        if not data:
                            if group_name == "Devices-ManagementPrefs":
                                fallback = "Devices-All"
                                logging.warning(f"Group '{group_name}' not found; falling back to '{fallback}'.")
                                return self.get_group_id(fallback)
                            else:
                                logging.error(f"Group '{group_name}' not found. Skipping assignment.")
                                return None
                        gid = data[0]["id"]
                        self.group_cache[group_name] = gid
                        return gid

                    def list_assignment_filters(self):
                        """Return dict of {displayName: filter_obj} for macOS filters."""
                        all_items = []
                        url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters"
                        while url:
                            resp = requests.get(url, headers=self._headers())
                            resp.raise_for_status()
                            data = resp.json()
                            all_items.extend(data.get("value", []))
                            url = data.get("@odata.nextLink")
                        return {f["displayName"]: f for f in all_items if f.get("platform") == "macOS"}

                    def create_assignment_filter(self, name, rule, description=""):
                        body = {
                            "displayName": name,
                            "description": description,
                            "platform": "macOS",
                            "rule": rule,
                            "assignmentFilterManagementType": "devices",
                        }
                        url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters"
                        resp = requests.post(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to create filter '{name}': {resp.status_code} {resp.text}")
                            return None
                        logging.info(f"Created Intune filter '{name}'.")
                        return resp.json()

                    def update_assignment_filter(self, filter_id, name, rule, description=""):
                        body = {
                            "displayName": name,
                            "description": description,
                            "rule": rule,
                        }
                        url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters/{filter_id}"
                        resp = requests.patch(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to update filter '{name}': {resp.status_code} {resp.text}")
                            return False
                        logging.info(f"Updated Intune filter '{name}'.")
                        return True

                    def assign_profile(self, config_id, assignments_spec):
                        """Assign a profile to one or more groups, optionally scoped by a filter.
                        assignments_spec: list of dicts {group_id, filter_id (optional),
                        filter_type ('include'/'exclude'), exclude (bool -> emit an
                        exclusionGroupAssignmentTarget instead of an include)}.
                        """
                        assignments = []
                        for spec in assignments_spec:
                            odata_type = ("#microsoft.graph.exclusionGroupAssignmentTarget"
                                          if spec.get("exclude")
                                          else "#microsoft.graph.groupAssignmentTarget")
                            target = {
                                "@odata.type": odata_type,
                                "groupId": spec["group_id"],
                            }
                            if spec.get("filter_id"):
                                target["deviceAndAppManagementAssignmentFilterId"] = spec["filter_id"]
                                target["deviceAndAppManagementAssignmentFilterType"] = spec.get("filter_type", "include")
                            assignments.append({"target": target})
                        body = {"assignments": assignments}
                        url = f"{GRAPH_BASE}/deviceManagement/deviceConfigurations/{config_id}/assign"
                        resp = requests.post(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to assign profile {config_id}: {resp.status_code} {resp.text}")
                        else:
                            logging.info(f"Profile {config_id} => assigned to {len(assignments_spec)} target(s).")

                def walk_managed_key(data, key, parent_cond=None):
                    """Yield (name, condition_text_or_None) for every entry under `key`
                    in a manifest, descending through conditional_items and combining
                    nested conditions with AND."""
                    top = data.get(key) or []
                    if isinstance(top, list):
                        for entry in top:
                            if isinstance(entry, str):
                                yield entry, parent_cond
                    for block in data.get("conditional_items") or []:
                        if not isinstance(block, dict):
                            continue
                        cond = (block.get("condition") or "").strip()
                        if not cond:
                            continue
                        combined = f"({parent_cond}) AND ({cond})" if parent_cond else cond
                        yield from walk_managed_key(block, key, combined)

                def walk_managed_profiles(data, parent_cond=None):
                    yield from walk_managed_key(data, "managed_profiles", parent_cond)

                def manifest_path_to_group(short_path):
                    """Convert a manifest path (relative to deployment/manifests/) to an
                    Entra group name, or None if the manifest doesn't map to a group."""
                    bits = short_path.split("/")
                    base_no_ext = bits[-1].replace(".yaml", "").replace(".yml", "")
                    if bits[0].replace(".yaml", "").replace(".yml", "") not in {"Assigned", "Shared"}:
                        return None
                    path_segs = bits[:-1] + [base_no_ext]
                    if len(path_segs) > 4:
                        return "Devices-" + "-".join(path_segs[:4])
                    if len(path_segs) == 4 and path_segs[1] == "Faculty" and path_segs[2] in ("Instructor", "Laptop"):
                        return "Devices-" + "-".join(path_segs[:3])
                    return "Devices-" + "-".join(path_segs)

                def load_manifest_assignments(root_path):
                    """Return (assignments, exclusions), each a list of
                    (name, condition_text_or_None, group_name):
                      - assignments come from managed_profiles (profiles to assign to
                        the manifest's group)
                      - exclusions come from managed_uninstalls (profiles a manifest
                        wants gone). These are honoured as exclusionGroupAssignmentTarget
                        on the manifest's own group when the profile is inherited from an
                        ancestor group -- the native way a child manifest opts out of a
                        parent's profile (e.g. Library opting out of CurriculumBrowsersHomepage).
                    """
                    out = []
                    excl = []
                    yaml_files = glob.glob(f"{root_path}/**/*.yaml", recursive=True)
                    excluded = {
                        "deployment/manifests/Shared/Curriculum/Apps.yaml",
                        "deployment/manifests/Shared/Curriculum/Classroom.yaml",
                    }
                    for fp in yaml_files:
                        normalized_path = fp.replace("\\", "/")
                        if normalized_path in excluded:
                            logging.info(f"Excluding special manifest: {fp}")
                            continue
                        short = normalized_path
                        if short.startswith(root_path):
                            short = short[len(root_path):].strip("/")
                        group_name = manifest_path_to_group(short)
                        if not group_name:
                            continue
                        try:
                            with open(fp, "r") as f:
                                data = yaml.safe_load(f) or {}
                        except Exception as ex:
                            logging.warning(f"Skipping {fp}: {ex}")
                            continue
                        if not isinstance(data, dict):
                            continue
                        for profile, cond in walk_managed_profiles(data):
                            out.append((profile, cond, group_name))
                        for profile, cond in walk_managed_key(data, "managed_uninstalls"):
                            excl.append((profile, cond, group_name))
                    return out, excl

                def ensure_filter_for_condition(client, cond_text, existing_filters, cache):
                    """Translate cond_text and ensure a matching Intune filter exists.
                    Returns filter_id, or raises UnsupportedCondition / CondParseError."""
                    if cond_text in cache:
                        return cache[cond_text]
                    display, rule = translate_condition(cond_text)
                    desc = f"Auto-generated from Munki condition: {cond_text}"
                    if display in existing_filters:
                        cur = existing_filters[display]
                        if cur.get("rule") != rule or cur.get("description", "") != desc:
                            client.update_assignment_filter(cur["id"], display, rule, desc)
                        cache[cond_text] = cur["id"]
                        return cur["id"]
                    created = client.create_assignment_filter(display, rule, desc)
                    if not created:
                        raise UnsupportedCondition(f"Intune rejected filter create for '{display}'")
                    existing_filters[display] = created
                    cache[cond_text] = created["id"]
                    return created["id"]

                def load_critical_display_names():
                    """
                    Return the set of profile display names (last dot-separated
                    component of each identifier) that munki-bootstrap-mgmt.yml
                    manages and this pipeline must never touch with its group assignment logic.
                    Source of truth: provisioning/profiles.yaml -- the All, Assigned
                    and Shared sections. munki-bootstrap-mgmt.yml applies the Intune assignments for
                    these (All Devices, optionally with an enrollmentProfileName
                    filter); skipping them here leaves those assignments intact even
                    when the profile is also referenced by a manifest's managed_profiles.
                    """
                    critical = set()
                    path = "provisioning/profiles.yaml"
                    if not os.path.exists(path):
                        logging.warning(f"profiles.yaml not found at {path}; no profiles will be protected.")
                        return critical
                    with open(path) as f:
                        data = yaml.safe_load(f) or {}
                    for section in ("All", "Assigned", "Shared"):
                        for identifier in data.get(section) or []:
                            if isinstance(identifier, str) and identifier.strip():
                                critical.add(identifier.strip().rsplit('.', 1)[-1])
                    logging.info(f"munki-bootstrap-mgmt-managed profiles skipped by this pipeline: {sorted(critical)}")
                    return critical

                def compute_scoped_groups():
                    """In targeted mode, return the set of Entra group names whose
                    profile assignments may need updating for the targeted manifests
                    (the targeted leaves AND their ancestors, since a device sits in
                    every group up its hierarchy). Returns None when not targeted,
                    meaning "process everything" -- preserves the previous behavior
                    for full and changed-files runs.
                    """
                    targeted = os.getenv("TARGETED_MODE", "").strip().lower() == "true"
                    paths = os.getenv("CHANGED_MANIFEST_PATHS", "").strip()
                    if not targeted or not paths or paths == "__ALL__":
                        return None
                    groups = set()
                    for raw_path in paths.split(";"):
                        rel = raw_path.strip()
                        if not rel:
                            continue
                        if rel.startswith("deployment/manifests/"):
                            rel = rel[len("deployment/manifests/"):]
                        bits = rel.replace(".yaml", "").replace(".yml", "").split("/")
                        # Walk leaf + ancestors so e.g. Assigned/Staff/IT.yaml expands to
                        # Devices-Assigned, Devices-Assigned-Staff, Devices-Assigned-Staff-IT.
                        for i in range(1, len(bits) + 1):
                            ancestor = "/".join(bits[:i]) + ".yaml"
                            g = manifest_path_to_group(ancestor)
                            if g:
                                groups.add(g)
                    return groups

                # --- Assignment floor guards ------------------------------------------
                # assign_profile REPLACES a profile's whole assignment set, so an empty
                # spec unassigns it from every device. The membership sync has guards
                # against a collapsed desired set stripping groups; these are the same
                # guards for the other half of the problem -- a collapsed manifest parse
                # stripping the assignments themselves. A profile that loses its
                # assignment silently stops applying: no error, no drift report, just
                # machines quietly falling out of policy.
                # Floor on how many profiles the manifests must assign. load_manifest_assignments
                # fails atomically -- a bad tree or a raised exception yields ~0 desired, never a
                # healthy-looking subset -- so a floor comfortably below the real baseline (126
                # assigned macOS profiles as of 2026-07-23) but well above "collapsed" catches the
                # real failure mode. There is deliberately NO clear-ratio guard: measured against
                # live Intune, a healthy run clears 37% of existing macOS configs (68/185, Cimian
                # 29%), because Intune holds many profiles no manifest assigns (portal-created,
                # stale, intentionally-unassigned). "existing minus desired" is dominated by those,
                # so a ratio on it fires constantly on healthy data while saying nothing about a
                # collapse. The desired floor is the signal; the ratio was noise.
                MIN_DESIRED_PROFILES = 20
                ALLOW_LARGE_UNASSIGN = os.getenv("ALLOW_LARGE_UNASSIGN", "").lower() in ("1", "true", "yes")

                def validate_assignment_plan(desired_names, clears, keeps, collapsed):
                    """Abort before any /assign call if the manifests collapsed to near-nothing,
                    or if a profile the manifests DO assign resolved to no group (a Graph failure
                    that would clear a live assignment). Raises RuntimeError; the caller must not
                    have written anything yet. See the block comment for why there is no
                    clear-ratio guard."""
                    if len(desired_names) < MIN_DESIRED_PROFILES and not ALLOW_LARGE_UNASSIGN:
                        raise RuntimeError(
                            f"manifests yielded only {len(desired_names)} assigned profile(s) "
                            f"(floor {MIN_DESIRED_PROFILES}). That is a collapsed or failed manifest "
                            "parse, not a real configuration; refusing to touch any assignment. "
                            "Re-run with ALLOW_LARGE_UNASSIGN=true if this shrink is intended."
                        )
                    if collapsed:
                        raise RuntimeError(
                            f"{len(collapsed)} profile(s) are assigned by the manifests but every "
                            f"target group failed to resolve: {', '.join(sorted(collapsed)[:5])}. "
                            "Applying would clear their assignments and unassign live policy. "
                            "This is a Graph/group-lookup failure; refusing to sync."
                        )

                def main():
                    token = os.getenv("GRAPH_TOKEN")
                    if not token:
                        logging.error("Missing GRAPH_TOKEN env var.")
                        return 1
                    client = GraphAPIClient(token)
                    existing_filters = client.list_assignment_filters()
                    logging.info(f"Found {len(existing_filters)} existing macOS assignment filters in Intune.")
                    existing_map = client.list_mac_custom_configs()
                    logging.info(f"Found {len(existing_map)} macOSCustomConfiguration profiles in Intune.")
                    raw, raw_exclusions = load_manifest_assignments("deployment/manifests")
                    # Group by profile name.
                    by_profile = {}
                    for profile, cond, group in raw:
                        by_profile.setdefault(profile, []).append((cond, group))
                    desired_names = set(by_profile.keys())
                    critical_names = load_critical_display_names()
                    filter_cache = {}            # cond_text -> filter_id
                    unsupported = {}             # cond_text -> reason (for end-of-run warning)

                    # --- managed_uninstalls -> Intune profile exclusions ------------------
                    # A profile in a manifest's managed_uninstalls means "devices under
                    # this group must not have it". When the profile is assigned to an
                    # ancestor group, that intent maps exactly to an exclusionGroupAssignmentTarget
                    # on this manifest's own group. Group names mirror the manifest tree
                    # ("Devices-Shared-Curriculum-ExampleArea" sits under "Devices-Shared-Curriculum"),
                    # so an exclusion is meaningful iff its group is a strict hyphen-descendant
                    # of a group the profile is actually assigned to. Anything else is a no-op
                    # (skip, keeps the plan clean). Conditional uninstalls are hierarchy
                    # subtraction that also wants a filter -- not yet supported, so they are
                    # logged and skipped rather than silently mis-applied.
                    apply_exclusions = os.getenv("APPLY_MANAGED_EXCLUSIONS", "").strip().lower() == "true"
                    include_groups = {p: {g for _, g in tuples} for p, tuples in by_profile.items()}

                    def _is_descendant(child, ancestor):
                        return child.startswith(ancestor + "-")

                    exclusions_by_profile = {}      # profile -> set of groups to exclude
                    skipped_conditional_excl = []   # (profile, cond, group) qualifying but conditional
                    for profile, cond, group in raw_exclusions:
                        if profile not in desired_names:
                            continue
                        if not any(_is_descendant(group, a) for a in include_groups.get(profile, set())):
                            continue  # not inherited here -> exclusion would be inert
                        if cond is not None:
                            skipped_conditional_excl.append((profile, cond, group))
                            continue
                        exclusions_by_profile.setdefault(profile, set()).add(group)

                    total_excl = sum(len(v) for v in exclusions_by_profile.values())
                    mode = "APPLY" if apply_exclusions else "DRY-RUN (log only; rerun with applyManagedExclusions=true to apply)"
                    logging.info(f"managed_uninstalls -> profile exclusions [{mode}]: "
                                 f"{total_excl} exclusion(s) across {len(exclusions_by_profile)} profile(s).")
                    for profile in sorted(exclusions_by_profile):
                        for group in sorted(exclusions_by_profile[profile]):
                            logging.info(f"  EXCLUDE {group} from profile '{profile}'")
                    for profile, cond, group in skipped_conditional_excl:
                        logging.warning(f"  SKIPPED conditional exclusion: '{profile}' on {group} "
                                        f"(condition '{cond}' not supported for exclusions)")

                    scoped_groups = compute_scoped_groups()
                    in_scope_names = None
                    if scoped_groups is not None:
                        in_scope_names = {
                            p for p, tuples in by_profile.items()
                            if any(g in scoped_groups for _, g in tuples)
                        }
                        logging.info(
                            f"Targeted mode: scoped to {len(scoped_groups)} group(s); "
                            f"{len(in_scope_names)}/{len(desired_names)} profiles in scope."
                        )

                    # Plan every profile before writing anything. assign_profile replaces a
                    # profile's entire assignment set, so a half-applied stage leaves some
                    # profiles live and others unassigned -- worse than not running at all.
                    clears = []     # (disp_name, cfg_id): no manifest assigns this profile
                    keeps = []      # (disp_name, cfg_id, assignments_spec)
                    collapsed = []  # assigned by a manifest, but no target group resolved
                    for disp_name in sorted(existing_map.keys()):
                        if disp_name in critical_names:
                            logging.info(f"Skipping critical profile '{disp_name}' (managed as All Devices assignment).")
                            continue
                        if in_scope_names is not None and disp_name not in in_scope_names:
                            # Targeted mode: leave out-of-scope profiles untouched
                            # rather than re-asserting their global assignments.
                            continue
                        cfg_id = existing_map[disp_name]["id"]
                        if disp_name not in desired_names:
                            clears.append((disp_name, cfg_id))
                            continue
                        seen_keys = set()
                        assignments_spec = []
                        for cond, group in sorted(by_profile[disp_name], key=lambda x: (x[1], x[0] or "")):
                            gid = client.get_group_id(group)
                            if not gid:
                                continue
                            if cond is None:
                                key = (gid, None)
                                if key in seen_keys:
                                    continue
                                seen_keys.add(key)
                                assignments_spec.append({"group_id": gid})
                                continue
                            try:
                                fid = ensure_filter_for_condition(client, cond, existing_filters, filter_cache)
                            except (CondParseError, UnsupportedCondition) as ex:
                                unsupported[cond] = str(ex)
                                logging.warning(f"Skipping '{disp_name}' -> {group}: cannot translate condition: {cond}  ({ex})")
                                continue
                            key = (gid, fid)
                            if key in seen_keys:
                                continue
                            seen_keys.add(key)
                            assignments_spec.append({"group_id": gid, "filter_id": fid, "filter_type": "include"})
                        # Append exclusionGroupAssignmentTarget assignments for this profile.
                        # assign_profile replaces all assignments in one call, so exclusions
                        # must ride along with the includes here.
                        if apply_exclusions:
                            for excl_group in sorted(exclusions_by_profile.get(disp_name, set())):
                                excl_gid = client.get_group_id(excl_group)
                                if not excl_gid:
                                    logging.warning(f"  exclusion group '{excl_group}' not found for '{disp_name}' -- skipping")
                                    continue
                                excl_key = (excl_gid, "__exclude__")
                                if excl_key in seen_keys:
                                    continue
                                seen_keys.add(excl_key)
                                assignments_spec.append({"group_id": excl_gid, "exclude": True})
                        if not assignments_spec:
                            # The manifests DO assign this profile, yet nothing resolved.
                            # Writing the empty spec here would unassign a live profile,
                            # so treat it as a lookup failure and let the guard abort.
                            collapsed.append(disp_name)
                            continue
                        keeps.append((disp_name, cfg_id, assignments_spec))

                    try:
                        validate_assignment_plan(desired_names, clears, keeps, collapsed)
                    except RuntimeError as ex:
                        logging.error(f"ABORTED before any assignment change: {ex}")
                        return 1
                    logging.info(
                        f"Assignment plan validated: {len(keeps)} profile(s) to assign, "
                        f"{len(clears)} to clear, from {len(desired_names)} manifest-assigned profile(s)."
                    )
                    for disp_name, cfg_id in clears:
                        logging.info(f"Profile '{disp_name}' not in manifests => clearing assignments.")
                        client.assign_profile(cfg_id, [])
                    for disp_name, cfg_id, assignments_spec in keeps:
                        logging.info(f"Assigning profile '{disp_name}' => {assignments_spec}")
                        client.assign_profile(cfg_id, assignments_spec)
                    missing_names = desired_names - set(existing_map.keys()) - critical_names
                    for mn in sorted(missing_names):
                        logging.warning(f"Manifest references profile '{mn}' but no matching macOS config found in Intune.")
                    if unsupported:
                        logging.warning("Untranslatable conditions encountered (profile assignments for these blocks were skipped):")
                        for c in sorted(unsupported):
                            logging.warning(f"  - {c}  ({unsupported[c]})")
                    logging.info("All profile assignment operations completed.")
                    return 0

                if __name__ == "__main__":
                    raise SystemExit(main())
          - task: PythonScript@0
            displayName: "Force Sync Affected Devices"
            condition: succeeded()
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              TARGET_SERIALS: ''
              CHANGED_MANIFEST_PATHS: $(changedManifestPaths)
            inputs:
              scriptSource: 'inline'
              script: |
                import os, csv, logging, time, requests

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _n in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_n).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH_BETA = "https://graph.microsoft.com/beta"
                COMPUTERS_CSV = "deployment/enroll/computers.csv"
                MAX_SYNC = 200
                USAGE_ROOTS = {"Assigned", "Shared"}

                def fetch_managed_device_ids(token, serials_set):
                    headers = {"Authorization": f"Bearer {token}"}
                    serial_to_rec = {}
                    url = (f"{GRAPH_BETA}/deviceManagement/managedDevices"
                           f"?$select=id,serialNumber,managementState,enrolledDateTime"
                           f"&$filter=operatingSystem+eq+'macOS'&$top=999")
                    while url:
                        r = requests.get(url, headers=headers)
                        if r.status_code != 200:
                            log.error("Managed devices fetch failed: %s", r.status_code)
                            break
                        data = r.json()
                        for d in data.get("value", []):
                            s = d.get("serialNumber", "").strip().upper()
                            if s not in serials_set:
                                continue
                            ex = serial_to_rec.get(s)
                            retired = {"retired", "deleted"}
                            if ex is None or (
                                ex.get("managementState") in retired
                                and d.get("managementState") not in retired
                            ) or (
                                d.get("enrolledDateTime", "") > ex.get("enrolledDateTime", "")
                                and d.get("managementState") not in retired
                            ):
                                serial_to_rec[s] = d
                        url = data.get("@odata.nextLink")
                    return {s: d["id"] for s, d in serial_to_rec.items()}

                def sync_devices(token, dev_id_map):
                    headers = {"Authorization": f"Bearer {token}", "Content-Length": "0"}
                    ok = err = 0
                    for serial, dev_id in dev_id_map.items():
                        r = requests.post(
                            f"{GRAPH_BETA}/deviceManagement/managedDevices/{dev_id}/syncDevice",
                            headers=headers)
                        if r.status_code == 204:
                            log.info("Synced %s (%s)", serial, dev_id)
                            ok += 1
                        else:
                            log.warning("Sync failed for %s: HTTP %s", serial, r.status_code)
                            err += 1
                        if (ok + err) % 20 == 0:
                            time.sleep(1)
                    log.info("Device sync complete: %d OK, %d failed", ok, err)

                def resolve_serials():
                    target_serials = os.getenv("TARGET_SERIALS", "").strip()
                    if target_serials:
                        return [s.strip().upper() for s in target_serials.split(",") if s.strip()]
                    changed = os.getenv("CHANGED_MANIFEST_PATHS", "").strip()
                    if not changed:
                        return []
                    with open(COMPUTERS_CSV) as f:
                        devices = list(csv.DictReader(f))
                    if changed == "__ALL__":
                        serials = [d["serial"].strip().upper() for d in devices
                                   if d.get("platform") == "Macintosh"
                                   and d.get("status") == "Active"
                                   and d.get("usage") in USAGE_ROOTS]
                        log.info("Full run: %d candidate devices (capping at %d)", len(serials), MAX_SYNC)
                        return serials[:MAX_SYNC]
                    criteria = []
                    for p in changed.split(";"):
                        p = p.strip().replace("deployment/manifests/", "")
                        p = p.replace(".yaml", "").replace(".yml", "")
                        parts = p.split("/")
                        if parts and parts[0] in USAGE_ROOTS:
                            criteria.append(parts)
                    serials = set()
                    for dev in devices:
                        if dev.get("platform") != "Macintosh" or dev.get("status") != "Active":
                            continue
                        usage = dev.get("usage", "").strip()
                        catalog = dev.get("catalog", "").strip()
                        area = dev.get("area", "").strip()
                        for parts in criteria:
                            if len(parts) >= 1 and usage != parts[0]: continue
                            if len(parts) >= 2 and catalog != parts[1]: continue
                            if len(parts) >= 3 and area != parts[2]: continue
                            serials.add(dev.get("serial", "").strip().upper())
                            break
                    return list(serials)

                token = os.getenv("GRAPH_TOKEN")
                if not token:
                    log.error("Missing GRAPH_TOKEN, skipping sync.")
                    raise SystemExit(0)
                serials = resolve_serials()
                if not serials:
                    log.info("No devices to sync.")
                    raise SystemExit(0)
                if len(serials) > MAX_SYNC:
                    log.warning("Capping to %d of %d devices.", MAX_SYNC, len(serials))
                    serials = serials[:MAX_SYNC]
                log.info("Syncing %d device(s): %s%s", len(serials),
                         ", ".join(serials[:5]), "..." if len(serials) > 5 else "")
                dev_ids = fetch_managed_device_ids(token, set(serials))
                missing = set(serials) - set(dev_ids)
                if missing:
                    log.warning("No Intune record for: %s", ", ".join(sorted(missing)))
                if dev_ids:
                    sync_devices(token, dev_ids)

#------------------------------------------------------------------------------
# STAGE 4: Assign macOS VPP Apps to Groups from Munki XML manifests
#------------------------------------------------------------------------------
  - stage: manageVppApps
    displayName: "Assign VPP Apps"
    dependsOn:
      - detectChanges
      - manageProfileAssignments
    condition: |
      and(
        succeeded('manageProfileAssignments'),
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.TargetedMode'], 'true'),
        ne(dependencies.detectChanges.outputs['detectFolderChanges.setVars.ReconcileOnly'], 'true')
      )
    variables:
      changedManifestPaths: $[ stageDependencies.detectChanges.detectFolderChanges.outputs['setVars.ChangedManifestPaths'] ]
    jobs:
      - job: manageVpp
        displayName: "Assign macOS VPP Apps from manifests"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests pyyaml
            displayName: "Install Python Dependencies"
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: PythonScript@0
            displayName: "Assign macOS VPP Apps"
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              APPLY_MANAGED_EXCLUSIONS: ${{ parameters.applyManagedExclusions }}
            inputs:
              scriptSource: 'inline'
              script: |
                import os
                import glob
                import plistlib
                import logging
                import requests
                import re
                import yaml
                
                logging.basicConfig(level=logging.INFO)
                for _noisy in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_noisy).setLevel(logging.WARNING)
                
                # Use beta endpoint for macOsVppApp
                GRAPH_BETA = "https://graph.microsoft.com/beta"
                MANIFESTS_ROOT = "deployment/manifests"  # Adjust to your folder
                
                # Enhanced VPP apps configuration with version control
                # Uses bundleId for matching since appStoreUrl is not available on macOS VPP apps
                # Name in a manifest -> what the API needs to find the app.
                #
                # Trimmed to a few entries for this sample. The real table is a
                # statement about what one organisation licenses, so build your
                # own. Match on bundleId: macOS VPP app objects do not reliably
                # carry an appStoreUrl, so a lookup built on it works for iOS
                # examples and quietly matches nothing on Mac.
                VPP_APPS_CONFIG = {
                    "Keynote": {
                        "store_id": "409183694",
                        "bundle_id": "com.apple.Keynote",
                        "version_control": {
                            "prevent_auto_update": False,
                            "assignment_intent": "required",
                            # Device licensing, so the app installs on shared and
                            # unattended machines with no Apple Account signed in.
                            "use_device_licensing": True
                        }
                    },
                    "Pages": {
                        "store_id": "409201541",
                        "bundle_id": "com.apple.Pages",
                        "version_control": {
                            "prevent_auto_update": False,
                            "assignment_intent": "required",
                            "use_device_licensing": True
                        }
                    },
                    "Example Available App": {
                        "store_id": "000000000",
                        "bundle_id": "com.example.availableapp",
                        "version_control": {
                            "prevent_auto_update": False,
                            "assignment_intent": "available",
                            "use_device_licensing": True
                        }
                    }
                }
                
                class GraphAPIClient:
                    def __init__(self, token):
                        self.token = token
                        self.group_cache = {}
                        logging.info("Graph API token provided.")
                
                    def _headers(self):
                        return {
                            "Authorization": f"Bearer {self.token}",
                            "Content-Type": "application/json"
                        }
                
                    def list_mac_vpp_apps(self):
                        """Return dict keyed by bundleId for all macOS VPP apps in Intune."""
                        all_items = []
                        url = f"{GRAPH_BETA}/deviceAppManagement/mobileApps?$top=999"
                        while url:
                            resp = requests.get(url, headers=self._headers())
                            resp.raise_for_status()
                            data = resp.json()
                            all_items.extend(data.get("value", []))
                            url = data.get("@odata.nextLink")
                        vpp_map = {}
                        for app in all_items:
                            odata = app.get("@odata.type", "")
                            if odata.lower() == "#microsoft.graph.macosvppapp":
                                bundle_id = app.get("bundleId") or ""
                                if bundle_id:
                                    vpp_map[bundle_id] = app
                                else:
                                    logging.warning(f"VPP app '{app.get('displayName')}' has no bundleId, skipping.")
                        return vpp_map
                
                    def get_group_id(self, group_name):
                        if group_name in self.group_cache:
                            return self.group_cache[group_name]
                        safe_name = group_name.replace("'", "''")
                        url = f"{GRAPH_BETA}/groups?$filter=displayName eq '{safe_name}'"
                        r = requests.get(url, headers=self._headers())
                        r.raise_for_status()
                        data = r.json().get("value", [])
                        if not data:
                            if group_name == "Devices-ManagementPrefs":
                                fallback = "Devices-All"
                                logging.warning(f"Group '{group_name}' not found; falling back to '{fallback}'.")
                                return self.get_group_id(fallback)
                            else:
                                logging.error(f"Group '{group_name}' not found. Skipping assignment.")
                                return None
                        gid = data[0]["id"]
                        self.group_cache[group_name] = gid
                        return gid
                
                    def assign_vpp_app(self, app_id, group_ids, app_config=None, exclude_group_ids=None):
                        assignments = []
                        for gid in group_ids:
                            assignment = {
                                "@odata.type": "#microsoft.graph.mobileAppAssignment",
                                "intent": "required",
                                "target": {
                                    "@odata.type": "#microsoft.graph.groupAssignmentTarget",
                                    "groupId": gid
                                },
                                # Always use device licensing so VPP apps install on shared/unattended
                                # devices without requiring a user Apple ID.
                                "settings": {
                                    "@odata.type": "#microsoft.graph.macOsVppAppAssignmentSettings",
                                    "useDeviceLicensing": True,
                                    "preventAutoAppUpdate": False
                                }
                            }

                            # Apply version control overrides if provided
                            if app_config and "version_control" in app_config:
                                vc = app_config["version_control"]
                                assignment["intent"] = vc.get("assignment_intent", "required")
                                assignment["settings"]["preventAutoAppUpdate"] = vc.get("prevent_auto_update", False)
                                assignment["settings"]["useDeviceLicensing"] = vc.get("use_device_licensing", True)

                            assignments.append(assignment)

                        # Exclusion targets carry no VPP settings -- they only subtract a group
                        # from the assignment so an inherited app stops reaching it.
                        for gid in (exclude_group_ids or []):
                            assignments.append({
                                "@odata.type": "#microsoft.graph.mobileAppAssignment",
                                "intent": "required",
                                "target": {
                                    "@odata.type": "#microsoft.graph.exclusionGroupAssignmentTarget",
                                    "groupId": gid
                                }
                            })

                        if not assignments:
                            logging.info(f"macOsVppApp {app_id} => no groups to assign, skipping.")
                            return
                        body = {"mobileAppAssignments": assignments}
                        url = f"{GRAPH_BETA}/deviceAppManagement/mobileApps/{app_id}/assign"
                        resp = requests.post(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            # Intune blocks changing useDeviceLicensing on an existing 'available'-intent
                            # assignment. Work around by clearing all assignments first, then reassigning.
                            if resp.status_code == 400 and "UseDeviceLicensing" in resp.text:
                                logging.warning(f"VPP app {app_id}: device-licensing conflict on existing assignment, retrying with clear+reassign.")
                                clear = requests.post(url, headers=self._headers(), json={"mobileAppAssignments": []})
                                if clear.status_code < 400:
                                    retry = requests.post(url, headers=self._headers(), json=body)
                                    if retry.status_code < 400:
                                        logging.info(f"macOsVppApp {app_id} => assigned to {len(group_ids)} group(s) (clear+reassign).")
                                        return
                                    logging.error(f"Failed to assign VPP app {app_id} after clear: {retry.status_code} {retry.text}")
                                else:
                                    logging.error(f"Failed to clear assignments for VPP app {app_id}: {clear.status_code} {clear.text}")
                            else:
                                logging.error(f"Failed to assign VPP app {app_id}: {resp.status_code} {resp.text}")
                        else:
                            logging.info(f"macOsVppApp {app_id} => assigned to {len(group_ids)} group(s).")
                
                USAGE_ROOTS = {"Assigned", "Shared"}

                # Top-level manifest → Entra device group. Three tiers:
                #   ManagedApps.yaml → Devices-All       (apps every device gets)
                #   Assigned.yaml    → Devices-Assigned  (1:1 staff/faculty devices)
                #   Shared.yaml      → Devices-Shared    (multi-user / classroom devices)
                ROOT_MANIFEST_GROUPS = {
                    "ManagedApps.yaml": "Devices-All",
                    "Assigned.yaml": "Devices-Assigned",
                    "Shared.yaml": "Devices-Shared",
                }

                def load_manifests(root_path):
                    """Load hierarchy manifests from YAML files with support for managed_apps key.

                    Pass 1 reads each top-level root manifest and routes its managed_apps to the
                    matching parent Entra group (see ROOT_MANIFEST_GROUPS).
                    Pass 2 reads leaf manifests under Assigned/ and Shared/ and assigns their
                    managed_apps to the matching Devices-<Usage>-<...> leaf group.

                    Returns (results, exclusions) where exclusions is a list of
                    (app_name, group_name) from each manifest's top-level managed_uninstalls
                    -- the native way a child group opts out of a VPP app inherited from an
                    ancestor. Conditional managed_uninstalls are ignored here, mirroring how
                    this stage only reads top-level managed_apps.
                    """
                    results = []
                    exclusions = []

                    # Pass 1: top-level root manifests → parent groups.
                    for fname, group_name in ROOT_MANIFEST_GROUPS.items():
                        root_fp = os.path.join(root_path, fname)
                        if not os.path.exists(root_fp):
                            logging.warning(f"Root manifest not found at {root_fp}")
                            continue
                        try:
                            with open(root_fp, "r") as f:
                                data = yaml.safe_load(f) or {}
                            managed_apps = data.get("managed_apps", [])
                            if isinstance(managed_apps, list) and managed_apps:
                                logging.info(f"{fname}: assigning {sorted(managed_apps)} to {group_name}")
                                results.append({
                                    "group_name": group_name,
                                    "apps": set(managed_apps)
                                })
                            for app in data.get("managed_uninstalls", []) or []:
                                if isinstance(app, str):
                                    exclusions.append((app, group_name))
                        except Exception as ex:
                            logging.warning(f"Skipping root manifest {root_fp}: {ex}")

                    # Pass 2: leaf manifests inside subdirectories
                    yaml_files = glob.glob(f"{root_path}/**/*.yaml", recursive=True)

                    for fp in yaml_files:
                        short = fp.replace("\\", "/")
                        if short.startswith(root_path):
                            short = short[len(root_path):].strip("/")
                        bits = short.split("/")
                        base_no_ext = bits[-1].replace(".yaml", "").replace(".yml", "")

                        if bits[0] not in USAGE_ROOTS:
                            continue

                        # Skip hostname-level manifests (5+ segments): no matching Intune group exists
                        # Groups only go to room level (Usage/Catalog/Area/Location = 4 segments)
                        if len(bits) > 4:
                            continue

                        # Faculty Instructors don't use location in manifest paths
                        # (4th segment is device hostname, not location).
                        if len(bits) == 4 and bits[1] == "Faculty" and bits[2] in ("Instructor", "Laptop"):
                            group_name = "Devices-" + "-".join(bits[:3])
                        else:
                            group_name = "Devices-" + "-".join(bits[:-1] + [base_no_ext])

                        try:
                            with open(fp, "r") as f:
                                data = yaml.safe_load(f) or {}

                            apps = set()
                            managed_apps = data.get("managed_apps", [])
                            if isinstance(managed_apps, list):
                                apps.update(managed_apps)

                            if apps:
                                results.append({
                                    "group_name": group_name,
                                    "apps": apps
                                })
                            for app in data.get("managed_uninstalls", []) or []:
                                if isinstance(app, str):
                                    exclusions.append((app, group_name))
                        except Exception as ex:
                            logging.warning(f"Skipping {fp}: {ex}")

                    return results, exclusions
                
                def build_final_map(manifest_data):
                    """Build map of bundle_id -> {groups, config} from manifest data."""
                    final = {}
                    for row in manifest_data:
                        g = row["group_name"]
                        for appname in row["apps"]:
                            app_config = VPP_APPS_CONFIG.get(appname)
                            if not app_config:
                                continue
                            bundle_id = app_config["bundle_id"]
                            # Collect all bundle IDs to check (primary + alternates)
                            all_bids = [bundle_id] + app_config.get("alt_bundle_ids", [])
                            for bid in all_bids:
                                if bid not in final:
                                    final[bid] = {"groups": set(), "config": app_config, "name": appname}
                                final[bid]["groups"].add(g)
                    return final
                
                def main():
                    token = os.getenv("GRAPH_TOKEN")
                    if not token:
                        logging.error("Missing GRAPH_TOKEN env var.")
                        return 1
                    client = GraphAPIClient(token)
                    existing_vpp = client.list_mac_vpp_apps()
                    existing_bundle_ids = set(existing_vpp.keys())
                    logging.info(f"Found {len(existing_bundle_ids)} macOsVppApp objects in Intune (by bundleId).")
                    man_data, raw_exclusions = load_manifests("deployment/manifests")
                    final_desired = build_final_map(man_data)
                    desired_bundle_ids = set(final_desired.keys())

                    # --- managed_uninstalls -> Intune VPP app exclusions ------------------
                    # An app in a manifest's managed_uninstalls means "devices under this
                    # group must not have it". When the app is assigned to an ancestor group,
                    # that maps to an exclusionGroupAssignmentTarget on this group. Group
                    # names mirror the manifest tree, so an exclusion is meaningful iff its
                    # group is a strict hyphen-descendant of a group the app is actually
                    # assigned to; anything else is inert and skipped.
                    apply_exclusions = os.getenv("APPLY_MANAGED_EXCLUSIONS", "").strip().lower() == "true"

                    def _is_descendant(child, ancestor):
                        return child.startswith(ancestor + "-")

                    exclusions_by_bid = {}   # bundle_id -> set of groups to exclude
                    for appname, group in raw_exclusions:
                        cfg = VPP_APPS_CONFIG.get(appname)
                        if not cfg:
                            continue
                        for bid in [cfg["bundle_id"]] + cfg.get("alt_bundle_ids", []):
                            if bid not in final_desired:
                                continue  # app not assigned anywhere -> exclusion inert
                            if not any(_is_descendant(group, a) for a in final_desired[bid]["groups"]):
                                continue  # not inherited here -> exclusion inert
                            exclusions_by_bid.setdefault(bid, set()).add(group)

                    total_excl = sum(len(v) for v in exclusions_by_bid.values())
                    excl_mode = "APPLY" if apply_exclusions else "DRY-RUN (log only; rerun with applyManagedExclusions=true to apply)"
                    logging.info(f"managed_uninstalls -> VPP app exclusions [{excl_mode}]: "
                                 f"{total_excl} exclusion(s) across {len(exclusions_by_bid)} app(s).")
                    for bid in sorted(exclusions_by_bid):
                        name = final_desired[bid].get("name", bid)
                        for group in sorted(exclusions_by_bid[bid]):
                            logging.info(f"  EXCLUDE {group} from app '{name}' ({bid})")

                    for bid in sorted(existing_bundle_ids):
                        app_obj = existing_vpp[bid]
                        app_id = app_obj["id"]
                        disp = app_obj.get("displayName", bid)
                        if bid not in desired_bundle_ids:
                            logging.info(f"VPP app '{disp}' ({bid}) not in manifests => skipping (no hierarchy groups reference it).")
                            continue
                        group_ids = []
                        app_config = final_desired[bid].get("config")
                        for g in sorted(final_desired[bid]["groups"]):
                            gid = client.get_group_id(g)
                            if gid:
                                group_ids.append(gid)
                        exclude_group_ids = []
                        if apply_exclusions:
                            for g in sorted(exclusions_by_bid.get(bid, set())):
                                gid = client.get_group_id(g)
                                if gid:
                                    exclude_group_ids.append(gid)
                                else:
                                    logging.warning(f"  exclusion group '{g}' not found for '{disp}' -- skipping")
                        logging.info(f"Assigning '{disp}' ({bid}) => {len(group_ids)} group(s), {len(exclude_group_ids)} exclusion(s)")
                        client.assign_vpp_app(app_id, group_ids, app_config=app_config, exclude_group_ids=exclude_group_ids)
                    missing = desired_bundle_ids - existing_bundle_ids
                    for bid in sorted(missing):
                        name = final_desired[bid].get("name", bid)
                        logging.warning(f"Manifest references '{name}' (bundleId={bid}), but no matching macOsVppApp found in Intune.")
                    logging.info("All VPP app assignment operations completed.")
                    return 0
                
                if __name__ == "__main__":
                    raise SystemExit(main())
          - task: PythonScript@0
            displayName: "Force Sync Affected Devices"
            condition: succeeded()
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              TARGET_SERIALS: ''
              CHANGED_MANIFEST_PATHS: $(changedManifestPaths)
            inputs:
              scriptSource: 'inline'
              script: |
                import os, csv, logging, time, requests

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _n in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_n).setLevel(logging.WARNING)
                log = logging.getLogger(__name__)

                GRAPH_BETA = "https://graph.microsoft.com/beta"
                COMPUTERS_CSV = "deployment/enroll/computers.csv"
                MAX_SYNC = 200
                USAGE_ROOTS = {"Assigned", "Shared"}

                def fetch_managed_device_ids(token, serials_set):
                    headers = {"Authorization": f"Bearer {token}"}
                    serial_to_rec = {}
                    url = (f"{GRAPH_BETA}/deviceManagement/managedDevices"
                           f"?$select=id,serialNumber,managementState,enrolledDateTime"
                           f"&$filter=operatingSystem+eq+'macOS'&$top=999")
                    while url:
                        r = requests.get(url, headers=headers)
                        if r.status_code != 200:
                            log.error("Managed devices fetch failed: %s", r.status_code)
                            break
                        data = r.json()
                        for d in data.get("value", []):
                            s = d.get("serialNumber", "").strip().upper()
                            if s not in serials_set:
                                continue
                            ex = serial_to_rec.get(s)
                            retired = {"retired", "deleted"}
                            if ex is None or (
                                ex.get("managementState") in retired
                                and d.get("managementState") not in retired
                            ) or (
                                d.get("enrolledDateTime", "") > ex.get("enrolledDateTime", "")
                                and d.get("managementState") not in retired
                            ):
                                serial_to_rec[s] = d
                        url = data.get("@odata.nextLink")
                    return {s: d["id"] for s, d in serial_to_rec.items()}

                def sync_devices(token, dev_id_map):
                    headers = {"Authorization": f"Bearer {token}", "Content-Length": "0"}
                    ok = err = 0
                    for serial, dev_id in dev_id_map.items():
                        r = requests.post(
                            f"{GRAPH_BETA}/deviceManagement/managedDevices/{dev_id}/syncDevice",
                            headers=headers)
                        if r.status_code == 204:
                            log.info("Synced %s (%s)", serial, dev_id)
                            ok += 1
                        else:
                            log.warning("Sync failed for %s: HTTP %s", serial, r.status_code)
                            err += 1
                        if (ok + err) % 20 == 0:
                            time.sleep(1)
                    log.info("Device sync complete: %d OK, %d failed", ok, err)

                def resolve_serials():
                    target_serials = os.getenv("TARGET_SERIALS", "").strip()
                    if target_serials:
                        return [s.strip().upper() for s in target_serials.split(",") if s.strip()]
                    changed = os.getenv("CHANGED_MANIFEST_PATHS", "").strip()
                    if not changed:
                        return []
                    with open(COMPUTERS_CSV) as f:
                        devices = list(csv.DictReader(f))
                    if changed == "__ALL__":
                        serials = [d["serial"].strip().upper() for d in devices
                                   if d.get("platform") == "Macintosh"
                                   and d.get("status") == "Active"
                                   and d.get("usage") in USAGE_ROOTS]
                        log.info("Full run: %d candidate devices (capping at %d)", len(serials), MAX_SYNC)
                        return serials[:MAX_SYNC]
                    criteria = []
                    for p in changed.split(";"):
                        p = p.strip().replace("deployment/manifests/", "")
                        p = p.replace(".yaml", "").replace(".yml", "")
                        parts = p.split("/")
                        if parts and parts[0] in USAGE_ROOTS:
                            criteria.append(parts)
                    serials = set()
                    for dev in devices:
                        if dev.get("platform") != "Macintosh" or dev.get("status") != "Active":
                            continue
                        usage = dev.get("usage", "").strip()
                        catalog = dev.get("catalog", "").strip()
                        area = dev.get("area", "").strip()
                        for parts in criteria:
                            if len(parts) >= 1 and usage != parts[0]: continue
                            if len(parts) >= 2 and catalog != parts[1]: continue
                            if len(parts) >= 3 and area != parts[2]: continue
                            serials.add(dev.get("serial", "").strip().upper())
                            break
                    return list(serials)

                token = os.getenv("GRAPH_TOKEN")
                if not token:
                    log.error("Missing GRAPH_TOKEN, skipping sync.")
                    raise SystemExit(0)
                serials = resolve_serials()
                if not serials:
                    log.info("No devices to sync.")
                    raise SystemExit(0)
                if len(serials) > MAX_SYNC:
                    log.warning("Capping to %d of %d devices.", MAX_SYNC, len(serials))
                    serials = serials[:MAX_SYNC]
                log.info("Syncing %d device(s): %s%s", len(serials),
                         ", ".join(serials[:5]), "..." if len(serials) > 5 else "")
                dev_ids = fetch_managed_device_ids(token, set(serials))
                missing = set(serials) - set(dev_ids)
                if missing:
                    log.warning("No Intune record for: %s", ", ".join(sorted(missing)))
                if dev_ids:
                    sync_devices(token, dev_ids)

  - stage: manageShellScripts
    displayName: "Manage Shell Scripts"
    dependsOn: lintConditions
    condition: succeeded('lintConditions')
    jobs:
      - job: manageMacShellScripts
        displayName: "Upsert & assign macOS shell scripts from scripts/"
        steps:
          - checkout: self
            fetchDepth: 1
            displayName: 'Checkout Munki Repository'
          - script: |
              python3 -m pip install --upgrade pip
              pip install requests pyyaml
            displayName: "Install Python Dependencies"
          - task: AzureCLI@2
            displayName: 'Acquire Graph API Token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$GRAPH_TOKEN"
          - task: PythonScript@0
            displayName: "Upsert, assign & reconcile macOS shell scripts"
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              LOCAL_ADMIN_PASSWORD: $(LocalAdminPassword)
              APPLY_MANAGED_EXCLUSIONS: ${{ parameters.applyManagedExclusions }}
            inputs:
              scriptSource: 'inline'
              script: |
                import os
                import re
                import glob
                import base64
                import logging
                import requests
                import yaml

                logging.basicConfig(level=logging.INFO, format="%(levelname)-8s | %(message)s")
                for _noisy in ("azure", "msal", "urllib3", "requests"):
                    logging.getLogger(_noisy).setLevel(logging.WARNING)

                MANIFESTS_ROOT = "deployment/manifests"
                SCRIPTS_DIR = "scripts"
                GRAPH_BASE = "https://graph.microsoft.com/v1.0"
                GRAPH_BETA = "https://graph.microsoft.com/beta"

                # Provisioning shell scripts owned by munki-bootstrap-mgmt.yml. The reconcile
                # below must never delete or clobber these, even though they live in Intune
                # as deviceShellScripts alongside the ones this pipeline manages.
                PROVISIONING_ALLOWLIST = {"BootstrapMate Installer", "InstallCompanyPortal"}


                # --- Condition translation (mirrors the managed_profiles stage) -------------

                class CondParseError(Exception):
                    pass

                class UnsupportedCondition(Exception):
                    pass

                _COND_TOKEN_RE = re.compile(
                    r'"(?:[^"\\]|\\.)*"'
                    r"|'(?:[^'\\]|\\.)*'"
                    r"|\d+"
                    r"|==|!=|>=|<=|>|<"
                    r"|\(|\)"
                    r"|[A-Za-z_][A-Za-z_0-9]*"
                )

                def _tokenize_cond(text):
                    return _COND_TOKEN_RE.findall(text)

                class _CondParser:
                    def __init__(self, tokens):
                        self.tokens = tokens
                        self.pos = 0
                    def _peek(self):
                        return self.tokens[self.pos] if self.pos < len(self.tokens) else None
                    def _take(self):
                        t = self._peek()
                        if t is None:
                            raise CondParseError("unexpected end of expression")
                        self.pos += 1
                        return t
                    def parse(self):
                        node = self._parse_or()
                        if self.pos < len(self.tokens):
                            raise CondParseError(f"trailing tokens: {self.tokens[self.pos:]}")
                        return node
                    def _parse_or(self):
                        n = self._parse_and()
                        while self._peek() == "OR":
                            self._take()
                            n = ("or", n, self._parse_and())
                        return n
                    def _parse_and(self):
                        n = self._parse_not()
                        while self._peek() == "AND":
                            self._take()
                            n = ("and", n, self._parse_not())
                        return n
                    def _parse_not(self):
                        if self._peek() == "NOT":
                            self._take()
                            return ("not", self._parse_unary())
                        return self._parse_unary()
                    def _parse_unary(self):
                        if self._peek() == "(":
                            self._take()
                            n = self._parse_or()
                            if self._peek() != ")":
                                raise CondParseError("missing ')'")
                            self._take()
                            return n
                        return self._parse_pred()
                    def _parse_pred(self):
                        ident = self._take()
                        if ident in ("ANY", "ALL", "SOME", "NONE"):
                            ident = f"{ident} {self._take()}"
                        op = self._take()
                        val = self._take()
                        if val and val[0] in ('"', "'"):
                            return ("pred", ident, op, val[1:-1], "string")
                        return ("pred", ident, op, val, "number")

                # machine_type form-factor classification.
                #
                # Intune reports device.model as a marketing name ("MacBook Pro",
                # "iMac") when Microsoft's lookup tables know the hardware, and as
                # a bare identifier ("Mac16,3") when they don't. Laptops are matched
                # by the stable "MacBook" prefix; desktop is the exact complement,
                # so every device matches exactly one branch -- no "matches nothing"
                # gap, and new desktop models need zero maintenance. A bare
                # identifier carries no form-factor signal, so the only case the
                # prefix misses is a laptop currently reporting one; those are
                # listed (form_factor: laptop) in provisioning/models.yaml, which
                # the maintainModelRegistry stage keeps current from Intune. That
                # override file is the only thing read here.
                def _is_model_identifier(m):
                    if not m.startswith("Mac"):
                        return False
                    a, sep, b = m[3:].partition(",")
                    return bool(sep) and a.isdigit() and b.isdigit()

                def _laptop_model_ids():
                    path = "provisioning/models.yaml"
                    ids = set()
                    if not os.path.exists(path):
                        return ids
                    try:
                        data = yaml.safe_load(open(path)) or {}
                    except Exception as e:
                        logging.warning(f"models.yaml unreadable ({e}); using MacBook prefix only.")
                        return ids
                    for entry in data.get("models") or []:
                        m = (entry.get("model") or "").strip()
                        if entry.get("form_factor") == "laptop" and _is_model_identifier(m):
                            ids.add(m)
                    return ids

                _LAPTOP_MODEL_IDS = _laptop_model_ids()
                _STR_OP_TO_INTUNE = {
                    "==": "-eq",
                    "!=": "-ne",
                    "CONTAINS": "-contains",
                    "BEGINSWITH": "-startsWith",
                    "ENDSWITH": "-endsWith",
                }

                def _translate_node(node):
                    if node[0] == "and":
                        return f"({_translate_node(node[1])} and {_translate_node(node[2])})"
                    if node[0] == "or":
                        return f"({_translate_node(node[1])} or {_translate_node(node[2])})"
                    if node[0] == "not":
                        return f"(not {_translate_node(node[1])})"
                    if node[0] == "pred":
                        return _translate_pred(*node[1:])
                    raise UnsupportedCondition(f"unknown AST node: {node[0]}")

                def _translate_pred(field, op, value, kind):
                    if field == "hostname":
                        if op in _STR_OP_TO_INTUNE:
                            return f'(device.deviceName {_STR_OP_TO_INTUNE[op]} "{value}")'
                        raise UnsupportedCondition(f"hostname {op}")
                    if field == "machine_type":
                        # desktop is the exact complement of laptop, so a device
                        # reporting an unknown/identifier model classifies as
                        # desktop rather than matching neither branch.
                        # NB: Intune rejects -notStartsWith and unary -not on
                        # device.model in assignment filters (verified against the
                        # Graph validator), so desktop uses -notContains "MacBook"
                        # -- equivalent here since every marketing MacBook string
                        # contains "MacBook" and identifier-laptops are excluded by
                        # -ne below.
                        laptop_rule = "(" + " or ".join(
                            ['(device.model -startsWith "MacBook")']
                            + [f'(device.model -eq "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        desktop_rule = "(" + " and ".join(
                            ['(device.model -notContains "MacBook")']
                            + [f'(device.model -ne "{m}")' for m in sorted(_LAPTOP_MODEL_IDS)]
                        ) + ")"
                        if value == "laptop":
                            return laptop_rule if op == "==" else desktop_rule
                        if value == "desktop":
                            return desktop_rule if op == "==" else laptop_rule
                        raise UnsupportedCondition(f'machine_type {op} "{value}"')
                    if field == "os_vers_major":
                        if kind == "number" and op == "==":
                            return f'(device.osVersion -startsWith "{value}.")'
                        if kind == "number" and op == "!=":
                            return f'(device.osVersion -notStartsWith "{value}.")'
                        raise UnsupportedCondition(f"os_vers_major {op}")
                    raise UnsupportedCondition(f"{field} {op}")

                def translate_condition(text):
                    """Translate a Munki condition string to (display_name, intune_rule)."""
                    import hashlib
                    normalized = " ".join(text.split())
                    rule = _translate_node(_CondParser(_tokenize_cond(normalized)).parse())
                    display = f"Munki: {normalized}"
                    if len(display) > 250:
                        h = hashlib.sha1(normalized.encode()).hexdigest()[:8]
                        display = display[:240] + f"... [{h}]"
                    return display, rule


                # --- Manifest walking (mirrors managed_profiles, keyed on managed_scripts) --

                def walk_managed_key(data, key, parent_cond=None):
                    """Yield (name, condition_text_or_None) for every entry under `key` in a
                    manifest, descending through conditional_items and AND-combining nested
                    conditions."""
                    top = data.get(key) or []
                    if isinstance(top, list):
                        for entry in top:
                            if isinstance(entry, str):
                                yield entry, parent_cond
                    for block in data.get("conditional_items") or []:
                        if not isinstance(block, dict):
                            continue
                        cond = (block.get("condition") or "").strip()
                        if not cond:
                            continue
                        combined = f"({parent_cond}) AND ({cond})" if parent_cond else cond
                        yield from walk_managed_key(block, key, combined)

                def walk_managed_scripts(data, parent_cond=None):
                    yield from walk_managed_key(data, "managed_scripts", parent_cond)

                def manifest_path_to_group(short_path):
                    """Convert a manifest path (relative to deployment/manifests/) to an Entra
                    group name, or None if the manifest doesn't map to a group."""
                    bits = short_path.split("/")
                    base_no_ext = bits[-1].replace(".yaml", "").replace(".yml", "")
                    if bits[0].replace(".yaml", "").replace(".yml", "") not in {"Assigned", "Shared"}:
                        return None
                    path_segs = bits[:-1] + [base_no_ext]
                    if len(path_segs) > 4:
                        return "Devices-" + "-".join(path_segs[:4])
                    if len(path_segs) == 4 and path_segs[1] == "Faculty" and path_segs[2] in ("Instructor", "Laptop"):
                        return "Devices-" + "-".join(path_segs[:3])
                    return "Devices-" + "-".join(path_segs)

                def load_manifest_assignments(root_path):
                    """Return (assignments, exclusions), each a list of
                    (script_name, condition_text_or_None, group_name):
                      - assignments come from managed_scripts (scripts to assign to the
                        manifest's group)
                      - exclusions come from managed_uninstalls (scripts a child manifest
                        opts out of). Honoured as exclusionGroupAssignmentTarget on the
                        manifest's own group when the script is inherited from an ancestor
                        group -- the native way a child opts out of a parent's script.
                    """
                    out = []
                    excl = []
                    yaml_files = glob.glob(f"{root_path}/**/*.yaml", recursive=True)
                    excluded = {
                        "deployment/manifests/Shared/Curriculum/Apps.yaml",
                        "deployment/manifests/Shared/Curriculum/Classroom.yaml",
                    }
                    for fp in yaml_files:
                        normalized_path = fp.replace("\\", "/")
                        if normalized_path in excluded:
                            logging.info(f"Excluding special manifest: {fp}")
                            continue
                        short = normalized_path
                        if short.startswith(root_path):
                            short = short[len(root_path):].strip("/")
                        group_name = manifest_path_to_group(short)
                        if not group_name:
                            continue
                        try:
                            with open(fp, "r") as f:
                                data = yaml.safe_load(f) or {}
                        except Exception as ex:
                            logging.warning(f"Skipping {fp}: {ex}")
                            continue
                        if not isinstance(data, dict):
                            continue
                        for script, cond in walk_managed_scripts(data):
                            out.append((script, cond, group_name))
                        for script, cond in walk_managed_key(data, "managed_uninstalls"):
                            excl.append((script, cond, group_name))
                    return out, excl


                # --- Graph client for deviceShellScripts ------------------------------------

                class GraphAPIClient:
                    def __init__(self, token):
                        self.token = token
                        self.group_cache = {}
                        logging.info("Graph API token provided.")

                    def _headers(self):
                        return {
                            "Authorization": f"Bearer {self.token}",
                            "Content-Type": "application/json",
                        }

                    def get_group_id(self, group_name):
                        if group_name in self.group_cache:
                            return self.group_cache[group_name]
                        safe_name = group_name.replace("'", "''")
                        url = f"{GRAPH_BASE}/groups?$filter=displayName eq '{safe_name}'"
                        r = requests.get(url, headers=self._headers())
                        r.raise_for_status()
                        data = r.json().get("value", [])
                        if not data:
                            logging.error(f"Group '{group_name}' not found. Skipping assignment.")
                            return None
                        gid = data[0]["id"]
                        self.group_cache[group_name] = gid
                        return gid

                    def list_shell_scripts(self):
                        """Return dict of {displayName: shellScriptObj} from Intune."""
                        out = {}
                        url = f"{GRAPH_BETA}/deviceManagement/deviceShellScripts?$select=id,displayName"
                        while url:
                            resp = requests.get(url, headers=self._headers())
                            resp.raise_for_status()
                            data = resp.json()
                            for item in data.get("value", []):
                                disp = item.get("displayName")
                                if disp:
                                    out[disp] = item
                            url = data.get("@odata.nextLink")
                        return out

                    def create_shell_script(self, display_name, file_name, script_b64):
                        body = {
                            "@odata.type": "#microsoft.graph.deviceShellScript",
                            "displayName": display_name,
                            "fileName": file_name,
                            "runAsAccount": "system",
                            "blockExecutionNotifications": True,
                            "scriptContent": script_b64,
                            "description": "Managed by Munki DevOps repo",
                            "executionFrequency": "P1D",
                            "retryCount": 3,
                        }
                        url = f"{GRAPH_BETA}/deviceManagement/deviceShellScripts"
                        resp = requests.post(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to create shell script '{display_name}': {resp.status_code} {resp.text}")
                            return None
                        logging.info(f"Created Intune shell script '{display_name}'.")
                        return resp.json()

                    def update_shell_script(self, script_id, display_name, file_name, script_b64):
                        body = {
                            "@odata.type": "#microsoft.graph.deviceShellScript",
                            "displayName": display_name,
                            "fileName": file_name,
                            "runAsAccount": "system",
                            "blockExecutionNotifications": True,
                            "scriptContent": script_b64,
                            "description": "Managed by Munki DevOps repo",
                        }
                        url = f"{GRAPH_BETA}/deviceManagement/deviceShellScripts/{script_id}"
                        resp = requests.patch(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to update shell script '{display_name}': {resp.status_code} {resp.text}")
                            return False
                        logging.info(f"Updated Intune shell script '{display_name}'.")
                        return True

                    def delete_shell_script(self, script_id, display_name):
                        url = f"{GRAPH_BETA}/deviceManagement/deviceShellScripts/{script_id}"
                        resp = requests.delete(url, headers=self._headers())
                        if resp.status_code >= 400:
                            logging.error(f"Failed to delete shell script '{display_name}': {resp.status_code} {resp.text}")
                            return False
                        logging.info(f"Deleted unmanaged Intune shell script '{display_name}' (id={script_id}).")
                        return True

                    def assign_shell_script(self, script_id, display_name, assignments_spec):
                        """Replace ALL assignments for a deviceShellScript in one /assign call.
                        assignments_spec: list of dicts {group_id, filter_id (optional),
                        exclude (bool -> emit an exclusionGroupAssignmentTarget instead of
                        an include)}."""
                        assignments = []
                        for spec in assignments_spec:
                            if spec.get("exclude"):
                                target = {
                                    "@odata.type": "#microsoft.graph.exclusionGroupAssignmentTarget",
                                    "groupId": spec["group_id"],
                                }
                            else:
                                fid = spec.get("filter_id")
                                target = {
                                    "@odata.type": "#microsoft.graph.groupAssignmentTarget",
                                    "groupId": spec["group_id"],
                                    "deviceAndAppManagementAssignmentFilterId": fid,
                                    "deviceAndAppManagementAssignmentFilterType": "include" if fid else "none",
                                }
                            assignments.append({
                                "@odata.type": "#microsoft.graph.deviceManagementScriptAssignment",
                                "target": target,
                            })
                        body = {"deviceManagementScriptAssignments": assignments}
                        url = f"{GRAPH_BETA}/deviceManagement/deviceShellScripts/{script_id}/assign"
                        resp = requests.post(url, headers=self._headers(), json=body)
                        if resp.status_code >= 400:
                            logging.error(f"Failed to assign shell script '{display_name}': {resp.status_code} {resp.text}")
                        else:
                            logging.info(f"Shell script '{display_name}' => assigned to {len(assignments)} target(s).")


                # --- Assignment-filter helpers (mirrors managed_profiles) -------------------

                def list_assignment_filters(client):
                    all_items = []
                    url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters"
                    while url:
                        resp = requests.get(url, headers=client._headers())
                        resp.raise_for_status()
                        data = resp.json()
                        all_items.extend(data.get("value", []))
                        url = data.get("@odata.nextLink")
                    return {f["displayName"]: f for f in all_items if f.get("platform") == "macOS"}

                def create_assignment_filter(client, name, rule, description=""):
                    body = {
                        "displayName": name,
                        "description": description,
                        "platform": "macOS",
                        "rule": rule,
                        "assignmentFilterManagementType": "devices",
                    }
                    url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters"
                    resp = requests.post(url, headers=client._headers(), json=body)
                    if resp.status_code >= 400:
                        logging.error(f"Failed to create filter '{name}': {resp.status_code} {resp.text}")
                        return None
                    logging.info(f"Created Intune filter '{name}'.")
                    return resp.json()

                def update_assignment_filter(client, filter_id, name, rule, description=""):
                    body = {"displayName": name, "description": description, "rule": rule}
                    url = f"{GRAPH_BETA}/deviceManagement/assignmentFilters/{filter_id}"
                    resp = requests.patch(url, headers=client._headers(), json=body)
                    if resp.status_code >= 400:
                        logging.error(f"Failed to update filter '{name}': {resp.status_code} {resp.text}")
                        return False
                    logging.info(f"Updated Intune filter '{name}'.")
                    return True

                def ensure_filter_for_condition(client, cond_text, existing_filters, cache):
                    """Translate cond_text and ensure a matching Intune filter exists.
                    Returns filter_id, or raises UnsupportedCondition / CondParseError."""
                    if cond_text in cache:
                        return cache[cond_text]
                    display, rule = translate_condition(cond_text)
                    desc = f"Auto-generated from Munki condition: {cond_text}"
                    if display in existing_filters:
                        cur = existing_filters[display]
                        if cur.get("rule") != rule or cur.get("description", "") != desc:
                            update_assignment_filter(client, cur["id"], display, rule, desc)
                        cache[cond_text] = cur["id"]
                        return cur["id"]
                    created = create_assignment_filter(client, display, rule, desc)
                    if not created:
                        raise UnsupportedCondition(f"Intune rejected filter create for '{display}'")
                    existing_filters[display] = created
                    cache[cond_text] = created["id"]
                    return created["id"]


                def load_repo_scripts():
                    """Return dict of {displayName: (fileName, base64_content)} for scripts/*.sh."""
                    out = {}
                    for fp in sorted(glob.glob(f"{SCRIPTS_DIR}/*.sh")):
                        file_name = os.path.basename(fp)
                        display = file_name[:-3]  # strip ".sh"
                        with open(fp, "rb") as f:
                            content = f.read()
                        # Only CreateAdmin.sh may carry the password placeholder. Inject
                        # the secret there and treat the token anywhere else as a hard
                        # error, so a secret can never be substituted into an unexpected
                        # script.
                        if b"__LOCAL_ADMIN_PASSWORD__" in content:
                            if file_name != "CreateAdmin.sh":
                                raise SystemExit(f"ERROR: __LOCAL_ADMIN_PASSWORD__ placeholder in {file_name}; only CreateAdmin.sh may use it.")
                            mac_pw = os.environ.get("LOCAL_ADMIN_PASSWORD", "")
                            if not mac_pw:
                                raise SystemExit("ERROR: LOCAL_ADMIN_PASSWORD is empty but CreateAdmin.sh requires it.")
                            content = content.replace(b"__LOCAL_ADMIN_PASSWORD__", mac_pw.encode())
                        out[display] = (file_name, base64.b64encode(content).decode("ascii"))
                    return out


                def main():
                    token = os.getenv("GRAPH_TOKEN")
                    if not token:
                        logging.error("Missing GRAPH_TOKEN env var.")
                        return 1
                    client = GraphAPIClient(token)

                    repo_scripts = load_repo_scripts()
                    logging.info(f"Found {len(repo_scripts)} shell script(s) under {SCRIPTS_DIR}/.")
                    existing = client.list_shell_scripts()
                    logging.info(f"Found {len(existing)} deviceShellScript(s) in Intune.")

                    # 1) Upsert every scripts/*.sh, matched by displayName.
                    for display, (file_name, script_b64) in repo_scripts.items():
                        if display in existing:
                            sid = existing[display]["id"]
                            client.update_shell_script(sid, display, file_name, script_b64)
                        else:
                            created = client.create_shell_script(display, file_name, script_b64)
                            if created:
                                existing[display] = created

                    # 2) Assign per manifest. /assign replaces ALL targets, so accumulate every
                    #    target for a given script across all manifests and send them together.
                    existing_filters = list_assignment_filters(client)
                    logging.info(f"Found {len(existing_filters)} existing macOS assignment filters in Intune.")
                    raw, raw_exclusions = load_manifest_assignments(MANIFESTS_ROOT)
                    by_script = {}
                    for script, cond, group in raw:
                        by_script.setdefault(script, []).append((cond, group))

                    # --- managed_uninstalls -> Intune script exclusions -------------------
                    # A script in a manifest's managed_uninstalls means "devices under this
                    # group must not run it". When the script is assigned to an ancestor
                    # group, that maps to an exclusionGroupAssignmentTarget on this group.
                    # Group names mirror the manifest tree, so an exclusion is meaningful
                    # iff its group is a strict hyphen-descendant of a group the script is
                    # actually assigned to; anything else is inert (skip). Conditional
                    # uninstalls also want a filter -- not supported, so logged and skipped.
                    apply_exclusions = os.getenv("APPLY_MANAGED_EXCLUSIONS", "").strip().lower() == "true"
                    excludable_scripts = set(by_script.keys()) & set(existing.keys())
                    include_groups = {s: {g for _, g in tuples} for s, tuples in by_script.items()}

                    def _is_descendant(child, ancestor):
                        return child.startswith(ancestor + "-")

                    exclusions_by_script = {}       # script -> set of groups to exclude
                    skipped_conditional_excl = []   # (script, cond, group) qualifying but conditional
                    for script, cond, group in raw_exclusions:
                        if script not in excludable_scripts:
                            continue
                        if not any(_is_descendant(group, a) for a in include_groups.get(script, set())):
                            continue  # not inherited here -> exclusion would be inert
                        if cond is not None:
                            skipped_conditional_excl.append((script, cond, group))
                            continue
                        exclusions_by_script.setdefault(script, set()).add(group)

                    total_excl = sum(len(v) for v in exclusions_by_script.values())
                    excl_mode = "APPLY" if apply_exclusions else "DRY-RUN (log only; rerun with applyManagedExclusions=true to apply)"
                    logging.info(f"managed_uninstalls -> script exclusions [{excl_mode}]: "
                                 f"{total_excl} exclusion(s) across {len(exclusions_by_script)} script(s).")
                    for script in sorted(exclusions_by_script):
                        for group in sorted(exclusions_by_script[script]):
                            logging.info(f"  EXCLUDE {group} from script '{script}'")
                    for script, cond, group in skipped_conditional_excl:
                        logging.warning(f"  SKIPPED conditional exclusion: '{script}' on {group} "
                                        f"(condition '{cond}' not supported for exclusions)")

                    filter_cache = {}
                    unsupported = {}
                    for display in sorted(by_script.keys()):
                        if display not in existing:
                            logging.warning(f"Manifest references script '{display}' but no scripts/{display}.sh and no Intune match; skipping assignment.")
                            continue
                        sid = existing[display]["id"]
                        seen_keys = set()
                        assignments_spec = []
                        for cond, group in sorted(by_script[display], key=lambda x: (x[1], x[0] or "")):
                            gid = client.get_group_id(group)
                            if not gid:
                                continue
                            if cond is None:
                                key = (gid, None)
                                if key in seen_keys:
                                    continue
                                seen_keys.add(key)
                                assignments_spec.append({"group_id": gid})
                                continue
                            try:
                                fid = ensure_filter_for_condition(client, cond, existing_filters, filter_cache)
                            except (CondParseError, UnsupportedCondition) as ex:
                                unsupported[cond] = str(ex)
                                logging.warning(f"Skipping '{display}' -> {group}: cannot translate condition: {cond}  ({ex})")
                                continue
                            key = (gid, fid)
                            if key in seen_keys:
                                continue
                            seen_keys.add(key)
                            assignments_spec.append({"group_id": gid, "filter_id": fid})
                        # Append exclusionGroupAssignmentTarget specs for this script.
                        # /assign replaces all targets, so exclusions must ride along here.
                        if apply_exclusions:
                            for excl_group in sorted(exclusions_by_script.get(display, set())):
                                excl_gid = client.get_group_id(excl_group)
                                if not excl_gid:
                                    logging.warning(f"  exclusion group '{excl_group}' not found for '{display}' -- skipping")
                                    continue
                                excl_key = (excl_gid, "__exclude__")
                                if excl_key in seen_keys:
                                    continue
                                seen_keys.add(excl_key)
                                assignments_spec.append({"group_id": excl_gid, "exclude": True})
                        logging.info(f"Assigning shell script '{display}' => {assignments_spec}")
                        client.assign_shell_script(sid, display, assignments_spec)

                    # 3) Reconcile: delete any Intune deviceShellScript that is neither defined
                    #    under scripts/ nor in the provisioning allowlist.
                    managed_names = set(repo_scripts.keys())
                    for display in sorted(existing.keys()):
                        if display in managed_names:
                            continue
                        if display in PROVISIONING_ALLOWLIST:
                            logging.info(f"Skipping provisioning-owned shell script '{display}' (managed by munki-bootstrap-mgmt.yml).")
                            continue
                        sid = existing[display]["id"]
                        logging.info(f"Shell script '{display}' is unmanaged (not in scripts/ or allowlist) => deleting.")
                        client.delete_shell_script(sid, display)

                    if unsupported:
                        logging.warning("Untranslatable conditions encountered (assignments for these blocks were skipped):")
                        for c in sorted(unsupported):
                            logging.warning(f"  - {c}  ({unsupported[c]})")
                    logging.info("All shell script operations completed.")
                    return 0

                if __name__ == "__main__":
                    raise SystemExit(main())
