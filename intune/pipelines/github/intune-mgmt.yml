# The same stages behind GitHub Actions. Federated credentials, no secrets.
name: intune-mgmt

on:
  push:
    branches: [main]
    paths:
      - 'intune/manifests/**'
      - 'intune/profiles/**'
  workflow_dispatch:
    inputs:
      whatIf:
        description: 'Plan only'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 -m stages.lint_conditions manifests/
        working-directory: intune

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 tests/test_intune.py
        working-directory: intune
      - run: python3 tests/test_group_ladder.py
        working-directory: enrollment

  plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 -m stages.plan_assignments manifests/
        working-directory: intune

  apply:
    needs: plan
    if: github.event_name == 'push' || inputs.whatIf == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml requests
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Write assignments
        working-directory: intune
        run: |
          GRAPH_TOKEN=$(az account get-access-token \
            --resource https://graph.microsoft.com --query accessToken -o tsv)
          GRAPH_TOKEN="$GRAPH_TOKEN" python3 -m stages.apply_assignments manifests/
