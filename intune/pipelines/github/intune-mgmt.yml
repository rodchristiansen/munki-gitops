# The same stages behind GitHub Actions. Federated credentials, no secrets.
name: intune-mgmt

on:
  push:
    branches: [main]
    paths:
      - 'intune/manifests/**'
      - 'intune/profiles/**'
      - 'pkgsinfo/apps/managed/**'
  workflow_dispatch:
    inputs:
      whatIf:
        description: 'Plan only'
        type: boolean
        default: true

# id-token: write is granted only to the apply job, which runs in a protected
# environment. Make the federated credential's subject that environment
# (repo:<owner>/<repo>:environment:intune-production), so a workflow edited on
# another branch cannot mint a token.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: python3 -m stages.lint_conditions manifests/
        working-directory: intune

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: python3 tests/test_intune.py
        working-directory: intune
      - name: Catalog and PayloadVersion invariants
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import yaml

          waterfall = ["Development", "Testing", "Staging", "Production"]
          yaml_paths = list(pathlib.Path("intune/profiles").rglob("*.yaml"))
          yaml_paths += list(pathlib.Path("pkgsinfo/apps/managed").rglob("*.yaml"))
          for path in yaml_paths:
              catalogs = (yaml.safe_load(path.read_text()) or {}).get("catalogs") or []
              if not catalogs or catalogs != waterfall[:len(catalogs)]:
                  raise SystemExit(f"{path}: catalogs must be a cumulative waterfall prefix")
          for path in pathlib.Path("intune/profiles").rglob("*.mobileconfig"):
              profile = plistlib.loads(path.read_bytes())
              catalogs = profile.get("Catalogs") or []
              if not catalogs or catalogs != waterfall[:len(catalogs)]:
                  raise SystemExit(f"{path}: Catalogs must be a cumulative waterfall prefix")
              def validate(value):
                  if isinstance(value, dict):
                      if "PayloadType" in value and (type(value.get("PayloadVersion")) is not int or value["PayloadVersion"] != 1):
                          raise SystemExit(f"{path}: every PayloadVersion must be integer 1")
                      for child in value.values(): validate(child)
                  elif isinstance(value, list):
                      for child in value: validate(child)
              validate(profile)
          PY
      - run: python3 tests/test_group_ladder.py
        working-directory: enrollment

  plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pyyaml
      - run: python3 -m stages.plan_assignments manifests/
        working-directory: intune

  apply:
    needs: plan
    if: github.event_name == 'push' || inputs.whatIf == false
    runs-on: ubuntu-latest
    environment: intune-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install pyyaml requests
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Write assignments
        working-directory: intune
        run: |
          GRAPH_TOKEN=$(az account get-access-token \
            --resource https://graph.microsoft.com --query accessToken -o tsv)
          GRAPH_TOKEN="$GRAPH_TOKEN" python3 -m stages.apply_assignments manifests/
