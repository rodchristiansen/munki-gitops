# Manifest tree -> Intune, through the shared intune-gitops composite action.
#
# The action is pinned to the v0.1.5 commit, and pinning the action pins the
# engine. Copy this into .github/workflows/ to run it. Before the first real
# apply, configure the environments and federated credentials described in
# pipelines/README.md in intune-gitops.
name: intune-mgmt

on:
  pull_request:
    paths:
      - 'intune/manifests/**'
      - 'intune/profiles/**'
      - 'pkgsinfo/apps/managed/**'
  push:
    branches: [main]
    paths:
      - 'intune/manifests/**'
      - 'intune/profiles/**'
      - 'pkgsinfo/apps/managed/**'
  workflow_dispatch:
    inputs:
      whatIf:
        description: 'Plan only'
        type: boolean
        default: true

# Nothing at workflow level can mint an Azure token. Only the two apply jobs
# get id-token: write, and each signs in as a different app registration whose
# federated credential matches only that job's environment.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: windowsadmins/intune-gitops/pipelines/github@7ccbab250b588a6ed7bdf414795d6210ac756d85 # v0.1.5
        with:
          stage: lint
          platform: macos
          manifests: intune/manifests

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: windowsadmins/intune-gitops/pipelines/github@7ccbab250b588a6ed7bdf414795d6210ac756d85 # v0.1.5
        with:
          stage: test
          platform: macos
      - name: Catalog and PayloadVersion invariants
        run: python3 intune/checks/profile_invariants.py

  plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: windowsadmins/intune-gitops/pipelines/github@7ccbab250b588a6ed7bdf414795d6210ac756d85 # v0.1.5
        with:
          stage: plan
          platform: macos
          manifests: intune/manifests

  # A whatIf apply for pull requests, other branches and dispatches that ask
  # for it. It signs in as the read-only app registration and needs no approval.
  apply-whatif:
    needs: plan
    if: >-
      github.event_name == 'pull_request' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch) ||
      (github.event_name == 'workflow_dispatch' && inputs.whatIf)
    runs-on: ubuntu-latest
    environment: intune-plan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_READ_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - id: token
        run: |
          token=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "graph=$token" >> "$GITHUB_OUTPUT"
      - uses: windowsadmins/intune-gitops/pipelines/github@7ccbab250b588a6ed7bdf414795d6210ac756d85 # v0.1.5
        with:
          stage: apply
          platform: macos
          manifests: intune/manifests
          graph-token: ${{ steps.token.outputs.graph }}
          what-if: 'true'

  # The real apply: default branch only, never a pull request, and behind the
  # intune-production environment. Give that environment required reviewers
  # and restrict it to the default branch in the repo settings. The write app
  # registration's only federated credential has the subject
  # repo:<owner>/<repo>:environment:intune-production, so no other job can
  # sign in as it.
  apply:
    needs: plan
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.whatIf))
    runs-on: ubuntu-latest
    environment: intune-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_WRITE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - id: token
        run: |
          token=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "graph=$token" >> "$GITHUB_OUTPUT"
      - uses: windowsadmins/intune-gitops/pipelines/github@7ccbab250b588a6ed7bdf414795d6210ac756d85 # v0.1.5
        with:
          stage: apply
          platform: macos
          manifests: intune/manifests
          graph-token: ${{ steps.token.outputs.graph }}
          what-if: 'false'
