# Manifest tree -> Intune. Thin: every stage is a module under intune/stages/.
#
# The lint stage has dependsOn: [] and gates everything, because the failure it
# catches -- a condition that cannot be translated, skipped in silence -- is
# invisible once the run is underway.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - intune/manifests/**
      - intune/profiles/**
      - pkgsinfo/apps/managed/**

parameters:
  - name: whatIf
    displayName: 'Plan only: log every write instead of making it'
    type: boolean
    default: true
  - name: allowLargeShrink
    displayName: 'Permit a removal batch above the cap'
    type: boolean
    default: false

variables:
  - name: azureServiceConnection
    value: '$(INTUNE_SERVICE_CONNECTION)'

stages:
  - stage: lint
    displayName: 'Lint manifest conditions'
    dependsOn: []
    jobs:
      - job: lint
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1
          - script: pip install pyyaml
            displayName: 'Dependencies'
          - script: python3 -m stages.lint_conditions manifests/
            workingDirectory: intune
            displayName: 'Every condition must translate'

  - stage: test
    displayName: 'Test'
    dependsOn: lint
    jobs:
      - job: test
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1
          - script: pip install pyyaml
            displayName: 'Dependencies'
          - script: python3 tests/test_intune.py
            workingDirectory: intune
            displayName: 'Assignment and translation guards'
          - script: |
              python3 - <<'PY'
              import pathlib
              import plistlib
              import yaml

              waterfall = ["Development", "Testing", "Staging", "Production"]
              for path in pathlib.Path("intune/profiles").rglob("*.yaml"):
                  catalogs = (yaml.safe_load(path.read_text()) or {}).get("catalogs") or []
                  if not catalogs or catalogs != waterfall[:len(catalogs)]:
                      raise SystemExit(f"{path}: catalogs must be a cumulative waterfall prefix")
              for path in pathlib.Path("pkgsinfo/apps/managed").rglob("*.yaml"):
                  catalogs = (yaml.safe_load(path.read_text()) or {}).get("catalogs") or []
                  if not catalogs or catalogs != waterfall[:len(catalogs)]:
                      raise SystemExit(f"{path}: catalogs must be a cumulative waterfall prefix")
              for path in pathlib.Path("intune/profiles").rglob("*.mobileconfig"):
                  profile = plistlib.loads(path.read_bytes())
                  catalogs = profile.get("Catalogs") or []
                  if not catalogs or catalogs != waterfall[:len(catalogs)]:
                      raise SystemExit(f"{path}: Catalogs must be a cumulative waterfall prefix")
                  def validate(value):
                      if isinstance(value, dict):
                          if "PayloadType" in value and (type(value.get("PayloadVersion")) is not int or value["PayloadVersion"] != 1):
                              raise SystemExit(f"{path}: every PayloadVersion must be integer 1")
                          for child in value.values(): validate(child)
                      elif isinstance(value, list):
                          for child in value: validate(child)
                  validate(profile)
              PY
            displayName: 'Catalog and PayloadVersion invariants'
          - script: python3 tests/test_group_ladder.py
            workingDirectory: enrollment
            displayName: 'Group membership guards'

  - stage: plan
    displayName: 'Plan'
    dependsOn: test
    jobs:
      - job: plan
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1
          - script: pip install pyyaml
            displayName: 'Dependencies'
          - script: python3 -m stages.plan_assignments manifests/
            workingDirectory: intune
            displayName: 'Assignments this tree implies'

  - stage: apply
    displayName: 'Apply'
    dependsOn: plan
    condition: and(succeeded(), eq('${{ parameters.whatIf }}', false))
    jobs:
      - job: apply
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self
            fetchDepth: 1
          - script: pip install pyyaml requests
            displayName: 'Dependencies'
          - task: AzureCLI@2
            displayName: 'Acquire Graph token'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                TOKEN=$(az account get-access-token \
                  --resource https://graph.microsoft.com \
                  --query accessToken -o tsv)
                echo "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$TOKEN"
          - script: python3 -m stages.apply_assignments manifests/
            workingDirectory: intune
            displayName: 'Write assignments'
            env:
              GRAPH_TOKEN: $(GRAPH_TOKEN)
              WHATIF: ${{ parameters.whatIf }}
              ALLOW_LARGE_SHRINK: ${{ parameters.allowLargeShrink }}
