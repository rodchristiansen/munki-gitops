# Manifest tree -> Intune, through the shared intune-gitops template.
#
# The lint, test, plan and apply stages, and the gate on the real apply, live
# in windowsadmins/intune-gitops at the pinned tag. This file supplies Munki's
# side only: where the manifests are, which connections and environment to
# use, and the catalog and PayloadVersion check for the test stage. Moving the
# engine means moving `ref`.
#
# The write connection and the environment need approvals, branch control on
# refs/heads/main and a required-template check on the template at this tag.
# See pipelines/README.md in intune-gitops.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - intune/manifests/**
      - intune/profiles/**
      - pkgsinfo/apps/managed/**

parameters:
  - name: whatIf
    displayName: 'Plan only: log every write instead of making it'
    type: boolean
    default: true

resources:
  repositories:
    - repository: intune_gitops
      type: github
      endpoint: github-public
      name: windowsadmins/intune-gitops
      ref: refs/tags/v0.1.4

stages:
  - template: pipelines/azure/intune-mgmt.yml@intune_gitops
    parameters:
      platform: macos
      manifestsPath: intune/manifests
      readServiceConnection: intune-graph-read
      writeServiceConnection: intune-graph-write
      environment: intune-production
      whatIf: ${{ parameters.whatIf }}
      validationSteps:
        - script: pip install pyyaml && python3 intune/checks/profile_invariants.py
          workingDirectory: $(Pipeline.Workspace)/s/self
          displayName: 'Catalog and PayloadVersion invariants'
