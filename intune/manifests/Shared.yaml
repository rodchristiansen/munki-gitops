# Every multi-user / lab device. Maps to Devices-Shared.
catalogs:
- Production

managed_installs:
- Chrome
- Firefox

conditional_items:
# Assignment filters have no ordered comparison, so a profile scoped to an
# OS release names the major version exactly.
- condition: os_vers_major == 26
  managed_installs:
  - ExampleAppNeedingCurrentOS
  managed_profiles:
  - ModernOSPrefs

- condition: machine_type == "laptop"
  managed_profiles:
  - LaptopPowerPrefs

managed_apps:
- Keynote

managed_profiles:
- GlobalPrefs
- SharedSoftwareUpdate

managed_scripts:
- ClearSoftwareCaches
