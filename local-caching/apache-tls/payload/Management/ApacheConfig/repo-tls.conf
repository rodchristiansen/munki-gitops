# HTTPS for a local caching server. The postinstall renders this to
# /private/etc/apache2/other/repo-tls.conf, filling in __FQDN__ and __DOCROOT__.
#
# It stays inert until apache-tls-sync.sh has written the certificate, key and
# htpasswd, so Apache never fails to start on a missing file. The port 80
# vhost in httpd.conf is left alone, which lets Macs that do not trust this
# server's certificate yet keep using the mirror over http while the
# certificate profile rolls out.

<IfFile "/private/etc/apache2/tls/server.crt">
<IfFile "/private/etc/apache2/tls/server.key">
<IfFile "/private/etc/apache2/tls/htpasswd">

LoadModule ssl_module libexec/apache2/mod_ssl.so
LoadModule socache_shmcb_module libexec/apache2/mod_socache_shmcb.so

Listen 443

SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLHonorCipherOrder off
SSLSessionCache "shmcb:/private/var/run/apache2/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost *:443>
    ServerName __FQDN__
    SSLEngine on
    SSLCertificateFile "/private/etc/apache2/tls/server.crt"
    SSLCertificateKeyFile "/private/etc/apache2/tls/server.key"

    # Only the repo is served on 443; the rest of the checkout is not.
    DocumentRoot "/Library/WebServer/Documents"
    Alias "/deployment" "__DOCROOT__/deployment"

    <Location "/">
        Require all denied
    </Location>

    # The same Basic Auth credential as the cloud repo, so a client needs no
    # change beyond the URL scheme: Munki's AdditionalHttpHeaders already carry it.
    <Location "/deployment">
        AuthType Basic
        AuthName "Munki repository"
        AuthBasicProvider file
        AuthUserFile "/private/etc/apache2/tls/htpasswd"
        Require valid-user
    </Location>

    ErrorLog "/private/var/log/apache2/ssl_error_log"
    CustomLog "/private/var/log/apache2/ssl_access_log" common
</VirtualHost>

</IfFile>
</IfFile>
</IfFile>
