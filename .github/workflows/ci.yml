# Checks for this repo itself: the offline tests, a syntax pass over every
# script and pipeline, and the workflow pin and permission rules. Nothing here
# reaches a tenant, a storage account or a bucket.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Shared Intune engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: windowsadmins/intune-gitops
          ref: f5c18eaaa5f7b1d6e5bccea5087c4f0fd80972f3 # v0.1.4
          path: .intune-gitops
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml
      - name: Munki enrollment consumer tests
        env:
          PYTHONPATH: enrollment:.intune-gitops/enrollment
        run: python -m unittest discover -s enrollment/tests -v
      - name: Inventory projection
        run: |
          python inventory/projections/project.py inventory/inventory.csv --out-dir "$RUNNER_TEMP/out"
          head -1 "$RUNNER_TEMP/out/munki.csv" | tr -d '\r' | grep -qx 'serial,catalog,area,location,asset,usage,status,allocation,username,platform,hostname,fleet'
      - name: Intune lint and plan on the sample manifests
        run: |
          python .intune-gitops/engine/stages/lint_conditions.py --platform macos intune/manifests
          python .intune-gitops/engine/stages/plan_assignments.py --platform macos intune/manifests
      - name: Catalog and PayloadVersion invariants
        run: python intune/checks/profile_invariants.py
      - name: Sample managed-app descriptors pass the hook linter
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location("lint", "githooks/lib/pkgsinfo-lint.py")
          lint = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(lint)
          bad = {str(p): lint.issues_for_file(p) for p in pathlib.Path("pkgsinfo/apps/managed").glob("*.yaml")}
          bad = {k: v for k, v in bad.items() if v}
          for path, issues in bad.items():
              print(f"{path}: {issues}")
          sys.exit(1 if bad else 0)
          PY
      - name: Hook helpers compile
        run: python -m py_compile githooks/lib/*.py
      - name: Workflow pins and permissions
        run: python .github/scripts/check_workflows.py
      - name: Every YAML file parses
        run: |
          python - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '.git' in p.parts or '.intune-gitops' in p.parts:
                  continue
              try:
                  list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
              except yaml.YAMLError as exc:
                  bad.append(f'{p}: {exc}')
          print('\n'.join(bad) or 'All YAML parses.')
          sys.exit(1 if bad else 0)
          PY

  # The hooks, preflight and package scripts are macOS tools, so they are
  # checked and tested on macOS.
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every script parses
        run: |
          bad=0
          for f in githooks/azure/* githooks/aws/* githooks/lib/*.sh githooks/tests/*.zsh \
                   preflight/*/payload/* preflight/*/scripts/* preflight/*/tests/*.zsh \
                   local-caching/*/scripts/* local-caching/*/payload/Management/*/*.sh \
                   local-caching/*/tests/*.zsh; do
            case "$(head -1 "$f")" in
              *zsh*) zsh -n "$f" || { echo "::error file=$f::zsh syntax error"; bad=1; } ;;
              *bash*|*/sh*) bash -n "$f" || { echo "::error file=$f::bash syntax error"; bad=1; } ;;
            esac
          done
          exit $bad
      - name: Property lists are well formed
        run: find . -name '*.plist' -not -path './.git/*' -print0 | xargs -0 plutil -lint
      - name: Git hook tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          for t in githooks/tests/*.zsh; do echo "== $t"; zsh "$t"; done
      - name: Preflight tests
        run: for t in preflight/*/tests/*.zsh; do echo "== $t"; zsh "$t"; done
      - name: Caching server tests
        run: for t in local-caching/*/tests/*.zsh; do echo "== $t"; zsh "$t"; done

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Listener scripts parse
        run: for f in local-caching/*/payload/Management/CommitsListener/*.js; do node --check "$f"; done

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - working-directory: local-caching/apache-tls/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
